function getDefaultDark() {
  const saved = localStorage.getItem("dijitally-theme");
  if (saved) return saved === "dark";
  const h = new Date().getHours();
  return h >= 18 || h < 6;
}

function _stripTransition(targetPage) {
  const isDark = localStorage.getItem('dijitally-theme') === 'dark';
  const overlayColor = isDark ? '#121010' : '#F5F3EE';
  const sliceH = 2;
  const H = window.innerHeight;
  const total = Math.ceil(H / sliceH);
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;';
  for (var i = 0; i < total; i++) {
    var s = document.createElement('div');
    s.style.cssText = 'position:absolute;left:0;width:100%;top:' + (i * sliceH) + 'px;height:' + (sliceH + 1) + 'px;background:' + overlayColor + ';transform:translateX(-100%);will-change:transform;';
    overlay.appendChild(s);
  }
  document.body.appendChild(overlay);
  var slices = Array.from(overlay.children);
  var maxEnd = 0;
  slices.forEach(function(sl, i) {
    var frac = i / Math.max(total - 1, 1);
    var delay = frac * 0.5 + (Math.random() * 0.05);
    var dur = 0.18 + Math.random() * 0.12;
    if (delay + dur > maxEnd) maxEnd = delay + dur;
    setTimeout(function() {
      sl.style.transition = 'transform ' + dur.toFixed(3) + 's linear';
      sl.style.transform = 'translateX(0)';
    }, delay * 1000);
  });
  setTimeout(function() {
    if (targetPage === 'home') sessionStorage.setItem('skipIntro', '1');
    if (window.__setPage) window.__setPage(targetPage);
    window.scrollTo(0, 0);
    // wipe strips back out
    slices.forEach(function(sl, i) {
      var frac = i / Math.max(total - 1, 1);
      var delay = frac * 0.35 + (Math.random() * 0.05);
      var dur = 0.18 + Math.random() * 0.12;
      setTimeout(function() {
        sl.style.transition = 'transform ' + dur.toFixed(3) + 's linear';
        sl.style.transform = 'translateX(100%)';
      }, delay * 1000);
    });
    setTimeout(function() { document.body.removeChild(overlay); }, 800);
  }, maxEnd * 1000 + 50);
}

function goToServices() { _stripTransition('services'); }
function goToWork()     { _stripTransition('work'); }
function goToHome()     { _stripTransition('home'); }

function Page() {
  const [dark,        setDark]        = useState(getDefaultDark);
  const [page,        setPage]        = useState('home');
  const [scrolled,    setScrolled]    = useState(false);
  const [isMobile,    setIsMobile]    = useState(()=> window.innerWidth <= 768);
  const scrollYRef    = useRef(0);
  const menuScrollRef = useRef(0);
  const scrolledRef   = useRef(false);
  const [activeModel, setActiveModel] = useState(0);
  const [hoverModel,  setHoverModel]  = useState(-1);
  const [activeFilter,setActiveFilter]= useState("ALL");
  const [reelOpen,    setReelOpen]    = useState(false);
  const [ctaOpen,     setCtaOpen]     = useState(false);
  const [menuOpen,    setMenuOpen]    = useState(false);
  const [menuReady,      setMenuReady]      = useState(false);
  const [menuItemsReady, setMenuItemsReady] = useState(false);
  const menuContentRef = useRef(null);
  const [thumbHover,  setThumbHover]  = useState(false);

  const CTA_W = isMobile ? window.innerWidth : 661;

  // Wire global setPage for strip transition
  useEffect(()=>{ window.__setPage = setPage; return ()=>{ delete window.__setPage; }; }, [setPage]);

  // Slide #smooth-wrapper left and animate CTA panel in/out
  useEffect(()=>{
    const wrapper = document.getElementById("smooth-wrapper");
    const panel   = document.getElementById("cta-panel");
    const overlay = document.getElementById("cta-overlay");
    if (!wrapper || !panel || !overlay) return;
    const cursor  = document.getElementById("dj-cursor");
    const heading = document.getElementById("cta-heading");
    const slideTarget = isMobile ? document.getElementById("smooth-content") || wrapper : wrapper;
    if (ctaOpen) {
      gsap.to(slideTarget, { x: -CTA_W, duration: 0.7, ease: "power3.inOut" });
      panel.classList.add("open");
      overlay.classList.add("open");
      wrapper.classList.add("cta-open");
      if (cursor) cursor.classList.add("cta-open");

      // SplitText on the heading — animate lines up after panel slides in
      if (heading && typeof SplitText !== "undefined") {
        // Revert any previous split so the DOM is clean
        heading._ctaSplit && heading._ctaSplit.revert();
        const split = new SplitText(heading, { type:"lines", linesClass:"split-line" });
        heading._ctaSplit = split;
        split.lines.forEach(line => {
          const wrap = document.createElement("div");
          wrap.style.overflow = "hidden";
          wrap.style.display = "block";
          line.parentNode.insertBefore(wrap, line);
          wrap.appendChild(line);
        });
        gsap.from(split.lines, {
          y: "110%",
          duration: 0.75,
          ease: "power3.out",
          stagger: 0.08,
          delay: 0.35,
        });
      }
    } else {
      gsap.to(slideTarget, { x: 0, duration: 0.7, ease: "power3.inOut" });
      panel.classList.remove("open");
      overlay.classList.remove("open");
      wrapper.classList.remove("cta-open");
      if (cursor) cursor.classList.remove("cta-open");
    }
  }, [ctaOpen]);

  // Menu Lottie — load after pixel reveal completes (menuReady), not on open
  useEffect(()=>{
    if (!menuReady || typeof lottie === "undefined") return;
    const el = menuLogoRef.current;
    if (!el || el._menuAnim) return;
    el._menuAnim = lottie.loadAnimation({
      container: el,
      renderer: "svg",
      loop: false,
      autoplay: true,
      path: "json/Dijitally-Logo.json",
      rendererSettings: { preserveAspectRatio:"xMidYMid meet" },
    });
    return () => {
      if (el._menuAnim) { el._menuAnim.destroy(); el._menuAnim = null; }
    };
  }, [menuReady]);

  // Mobile menu open/close — lock body scroll and pointer events while open
  useLayoutEffect(()=>{
    if (!isMobile) return;
    const wrapper = document.getElementById("smooth-wrapper");
    const cursor  = document.getElementById("dj-cursor");
    if (menuOpen) {
      // Lock scroll: use position saved before setState to avoid timing gap
      const scrollY = menuScrollRef.current;
      document.body.style.position   = 'fixed';
      document.body.style.top        = `-${scrollY}px`;
      document.body.style.left       = '0';
      document.body.style.right      = '0';
      document.body.style.overflowY  = 'scroll'; // keep scrollbar width stable
      wrapper?.classList.add("cta-open");
      if (cursor) cursor.classList.add("cta-open");
    } else {
      // Restore scroll position exactly
      const scrollY = parseInt(document.body.style.top || '0') * -1;
      document.body.style.position  = '';
      document.body.style.top       = '';
      document.body.style.left      = '';
      document.body.style.right     = '';
      document.body.style.overflowY = '';
      window.scrollTo(0, scrollY);
      wrapper?.classList.remove("cta-open");
      if (cursor) cursor.classList.remove("cta-open");
      setMenuReady(false);
      setMenuItemsReady(false);
    }
  }, [menuOpen, isMobile]);

  // Animate menu items up once the glitch completes and background is solid
  useEffect(()=>{
    if (!menuReady || !menuContentRef.current) return;
    const items = menuContentRef.current.querySelectorAll('.menu-nav-item');
    if (!items.length) return;
    gsap.fromTo(items,
      { y: "110%", opacity: 0 },
      { y: "0%", opacity: 1, duration: 0.75, ease: "power2.out", stagger: 0.06, delay: 0.05 }
    );
  }, [menuReady]);

  useEffect(()=>{
    // Only update isMobile on genuine width changes (not iOS chrome height-only resize)
    let lastWidth = window.innerWidth;
    const onResize = () => {
      const w = window.innerWidth;
      if (w !== lastWidth) { lastWidth = w; setIsMobile(w <= 768); }
    };
    window.addEventListener('resize', onResize, { passive: true });
    return () => window.removeEventListener('resize', onResize);
  }, []);

  useEffect(()=>{
    localStorage.setItem("dijitally-theme", dark ? "dark" : "light");
    document.body.classList.toggle("dark", dark);
    document.documentElement.style.setProperty('--scrollbar-thumb', dark ? '#F5F3EE' : '#121010');
  }, [dark]);

  // ScrollSmoother — desktop only; on mobile native scroll is far smoother
  useEffect(()=>{
    if (isMobile) return; // skip entirely on mobile
    if (typeof ScrollSmoother === "undefined" || typeof ScrollTrigger === "undefined") return;
    const smoother = ScrollSmoother.create({
      wrapper: "#smooth-wrapper",
      content: "#smooth-content",
      smooth: 1.5,
      effects: true,
      normalizeScroll: true,
    });
    smoother.paused(true); // hold until hero sequence finishes
    smootherRef.current = smoother;

    return () => { smoother.kill(); smootherRef.current = null; };
  }, []);

  const smootherRef       = useRef(null);
  const heroLogoRef       = useRef(null);
  const heroBodyRef       = useRef(null);
  const navRef            = useRef(null);
  const menuLogoRef       = useRef(null);
  const heroThumbRef      = useRef(null);
  const thumbSlideRef     = useRef(null);
  const heroViewportRef   = useRef(null);
  const philoCardRef      = useRef(null);
  const philoSlideRef     = useRef(null);
  const philoTextRef      = useRef(null);
  const philoLeftTextRef  = useRef(null);
  const [philoResolved, setPhiloResolved] = useState(false);
  const [heroThumbResolved, setHeroThumbResolved] = useState(false);
  const philoRevealedRef  = useRef(false);
  const philoMouseRef     = useRef({ targetX:0, currentX:0, targetRotY:0, currentRotY:0, targetY:0, currentY:0, targetRotX:0, currentRotX:0 });
  const carouselRef       = useRef(null);
  const carouselSectionRef  = useRef(null);
  const [carouselVisible, setCarouselVisible] = useState(false);
  const [modelsVisible,  setModelsVisible]  = useState(false);
  const dragRef           = useRef({ active: false, startX: 0, scrollLeft: 0 });
  const reelPlayerRef     = useRef(null);
  const modelPanelRef     = useRef(null);
  const modelVideoRefs    = useRef([]);
  const heroTextRef       = useRef(null);

  // Capture the hero logo's initial bounding rect (once, before any scroll)




  // Hide nav + hero body before first paint — skip if returning from a secondary page
  useLayoutEffect(()=>{
    if (typeof gsap === "undefined") return;
    if (sessionStorage.getItem('skipIntro')) return;
    if (navRef.current)     gsap.set(navRef.current,     { y:"-100%" });
    if (heroBodyRef.current) gsap.set(heroBodyRef.current, { opacity:0, y:16 });
  }, []);

  // Lottie + hero entrance sequence — re-runs when navigating back to home
  useEffect(()=>{
    if (page !== 'home') return;
    if (typeof lottie === "undefined" || typeof gsap === "undefined") return;
    const el = heroLogoRef.current;
    if (!el) return;

    const skipIntro = !!sessionStorage.getItem('skipIntro');
    if (skipIntro) sessionStorage.removeItem('skipIntro');

    const isDark = localStorage.getItem('dijitally-theme') === 'dark';

    const doEntrance = () => {
      setHeroThumbResolved(true);
      // Animate nav in
      gsap.to(navRef.current, { y:"0%", duration:0.55, ease:"power2.out",
        onComplete: () => { if (smootherRef.current) smootherRef.current.paused(false); }
      });
      // Animate hero body text
      if (typeof SplitText !== "undefined" && heroBodyRef.current) {
        const heroSpan = heroBodyRef.current.querySelector("[data-split-entrance]");
        if (heroSpan) {
          const split = new SplitText(heroSpan, { type:"lines", linesClass:"split-line" });
          split.lines.forEach(line => {
            const w = document.createElement("div");
            w.style.overflow = "hidden"; w.style.display = "block";
            line.parentNode.insertBefore(w, line); w.appendChild(line);
          });
          gsap.set(split.lines, { y:"110%" });
          if (isMobile) {
            gsap.to(heroBodyRef.current, { opacity:1, y:0, duration:0.6, ease:"power2.out", delay:0.2 });
            gsap.to(split.lines, { y:"0%", duration:0.7, ease:"power3.out", stagger:0.08, delay:0.2 });
          } else {
            gsap.to(heroBodyRef.current, { opacity:1, y:0, duration:0.6, ease:"power2.out", delay:0.2,
              onComplete: () => gsap.to(split.lines, { y:"0%", duration:0.7, ease:"power3.out", stagger:0.08 })
            });
          }
        } else {
          gsap.to(heroBodyRef.current, { opacity:1, y:0, duration:0.6, ease:"power2.out", delay:0.2 });
        }
      } else {
        gsap.to(heroBodyRef.current, { opacity:1, y:0, duration:0.6, ease:"power2.out", delay:0.2 });
      }
    };

    // ── Skip intro: show hero logo at final frame immediately ──
    if (skipIntro) {
      const anim = lottie.loadAnimation({
        container: el, renderer:"svg", loop:false, autoplay:false,
        path:"json/Dijitally-Logo.json",
        rendererSettings: { preserveAspectRatio:"xMidYMid meet" },
      });
      anim.addEventListener("DOMLoaded", () => {
        anim.goToAndStop(anim.totalFrames - 1, true);
        if (smootherRef.current) smootherRef.current.paused(false);
        setHeroThumbResolved(true);
      });
      return () => anim.destroy();
    }

    // ── Full intro: logo plays above overlay, then triggers glitch ──
    const introEl = document.getElementById('intro-logo-overlay');

    // Adjust position for mobile
    if (introEl) {
      if (isMobile) {
        const s42 = getComputedStyle(document.documentElement).getPropertyValue('--s42').trim() || '16px';
        introEl.style.top = '72px'; introEl.style.transform = 'none';
        introEl.style.left = s42; introEl.style.right = s42;
      }
      introEl.style.display = 'block';
      // SVG mask: strips will paint black rects here as they exit, masking Logo A strip-by-strip
      introEl.style.webkitMask = 'url(#logo-a-mask)';
      introEl.style.mask = 'url(#logo-a-mask)';
    }

    // Load intro animation into fixed overlay
    const introAnim = lottie.loadAnimation({
      container: introEl || el,
      renderer:"svg", loop:false, autoplay:false,
      path:"json/Dijitally-Logo.json",
      rendererSettings: { preserveAspectRatio:"xMidYMid meet" },
    });

    // Load hero logo at final frame in background (hidden behind overlay)
    let heroAnim = null;
    heroAnim = lottie.loadAnimation({
      container: el,
      renderer:"svg", loop:false, autoplay:false,
      path:"json/Dijitally-Logo.json",
      rendererSettings: { preserveAspectRatio:"xMidYMid meet" },
    });
    heroAnim.addEventListener("DOMLoaded", () => {
      heroAnim.goToAndStop(heroAnim.totalFrames - 1, true);
    });

    // Logo A = contrast colour: SVG feColorMatrix filter inverts black → #F5F3EE exactly (no per-frame DOM patching)
    // Light mode: black logo paths → #F5F3EE via url(#to-warm-white)
    // Dark mode: logo stays dark (off-black against off-white overlay) — no filter
    if (introEl) introEl.style.filter = isDark ? 'none' : 'url(#to-warm-white)';

    introAnim.addEventListener("DOMLoaded", () => {
      introAnim.play();
    });

    introAnim.addEventListener("complete", () => {
      // Logo done — trigger the glitch transition
      if (window.__beginGlitchTransition) window.__beginGlitchTransition();

      // Start hero entrance while strips are still sliding
      setTimeout(doEntrance, 300);

      // After glitch fully completes: fade out Logo A overlay
      window.__onGlitchDone = () => {
        if (introEl) gsap.to(introEl, { opacity:0, duration:0.4, onComplete:() => { introEl.style.display='none'; } });
      };
    });

    return () => {
      introAnim.destroy();
      if (heroAnim) heroAnim.destroy();
    };
  }, [page]);


  // Capture thumbnail + reel rects once at mount
  const initThumbRect = useRef(null);
  const initReelRect  = useRef(null);
  useEffect(()=>{
    const raf = requestAnimationFrame(()=>{
      // initThumbRect is captured in the entrance animation's onComplete (after x:0 resolves)
      // so we don't capture it here — only set initial opacity/overlay state
      if (heroThumbRef.current)  heroThumbRef.current.style.opacity = "1";
      if (reelPlayerRef.current) {
        initReelRect.current = reelPlayerRef.current.getBoundingClientRect();
        reelPlayerRef.current.style.opacity = "0";
      }
      const ov = document.getElementById("thumb-overlay");
      if (ov) ov.style.opacity = "0";
    });
    return ()=> cancelAnimationFrame(raf);
  }, []);

  // Scroll-driven thumbnail animations (desktop only):
  //   Hero thumb → slides DOWN out of clip mask (1s tween, fires on first scroll)
  //   Philosophy card → slides UP into clip mask (scroll-scrubbed)
  useLayoutEffect(()=>{
    if (isMobile || typeof ScrollTrigger === "undefined") return;
    const ctx = gsap.context(()=>{
      // --- philosophy card: fade in shadow + right caption on enter ---
      if (philoCardRef.current) {
        if (philoTextRef.current) gsap.set(philoTextRef.current, { opacity: 0 });
        if (philoLeftTextRef.current) gsap.set(philoLeftTextRef.current, { opacity: 0 });
        ScrollTrigger.create({
          trigger: philoCardRef.current,
          start: "top 85%",
          onEnter: () => {
            philoMouseRef.current.targetX = philoMouseRef.current.currentX = 0;
            philoMouseRef.current.targetRotY = philoMouseRef.current.currentRotY = 0;
            philoMouseRef.current.targetY = philoMouseRef.current.currentY = 0;
            philoMouseRef.current.targetRotX = philoMouseRef.current.currentRotX = 0;
            philoRevealedRef.current = true;
            setPhiloResolved(true);
            gsap.to(philoCardRef.current, { boxShadow: "0px 63px 100px 0px rgba(0,0,0,0.11)", duration: 0.6, ease: "power2.out" });
            gsap.to(philoTextRef.current,     { opacity: 1, duration: 0.6, ease: "power2.out" });
            gsap.to(philoLeftTextRef.current, { opacity: 1, duration: 0.6, ease: "power2.out" });
          },
          onLeaveBack: () => {
            philoRevealedRef.current = false;
            gsap.to(philoCardRef.current, { x: 0, y: 0, rotateY: 0, rotateX: 0, boxShadow: "0px 63px 100px 0px rgba(0,0,0,0)", duration: 0.3, ease: "power2.in" });
            gsap.to(philoTextRef.current,     { x: 0, y: 0, opacity: 0, duration: 0.3, ease: "power2.in",
              onComplete: () => {
                philoMouseRef.current.targetX = philoMouseRef.current.currentX = 0;
                philoMouseRef.current.targetRotY = philoMouseRef.current.currentRotY = 0;
                philoMouseRef.current.targetY = philoMouseRef.current.currentY = 0;
                philoMouseRef.current.targetRotX = philoMouseRef.current.currentRotX = 0;
              },
            });
            gsap.to(philoLeftTextRef.current, { x: 0, y: 0, opacity: 0, duration: 0.3, ease: "power2.in" });
          },
        });
      }
    });
    return () => ctx.revert();
  }, [isMobile]);


  // Philosophy card — cursor X tracking + faux-3D tilt (active only after reveal)
  useEffect(()=>{
    if (isMobile) return;
    const lerp = (a, b, t) => a + (b - a) * t;
    let raf;

    const onMouseMove = (e) => {
      if (!philoRevealedRef.current) return;
      const cx = window.innerWidth / 2;
      const norm = (e.clientX - cx) / cx; // -1 to +1
      const cy = window.innerHeight / 2;
      const normY = (e.clientY - cy) / cy; // -1 to +1
      philoMouseRef.current.targetX    =  norm  * 40;
      philoMouseRef.current.targetRotY = -norm  * 14;
      philoMouseRef.current.targetY    =  normY * 40;
      philoMouseRef.current.targetRotX =  normY * 14;
    };

    const tick = () => {
      const m = philoMouseRef.current;
      m.currentX    = lerp(m.currentX,    m.targetX,    0.07);
      m.currentRotY = lerp(m.currentRotY, m.targetRotY, 0.07);
      m.currentY    = lerp(m.currentY,    m.targetY,    0.07);
      m.currentRotX = lerp(m.currentRotX, m.targetRotX, 0.07);

      if (philoRevealedRef.current) {
        if (philoCardRef.current) gsap.set(philoCardRef.current, {
          x: m.currentX, y: m.currentY,
          rotateY: m.currentRotY, rotateX: m.currentRotX,
          transformPerspective: 900,
        });
        if (philoTextRef.current) gsap.set(philoTextRef.current, {

  // Magnetic hover on work cards — image + text attract to cursor within 60px
  useEffect(() => {
    if (isMobile || typeof gsap === 'undefined') return;
    const PULL   = 60;  // max translation px
    const MARGIN = 60;  // attraction zone outside card edge
    const nearState = new Map();

    const isNear = (rect, x, y) =>
      x >= rect.left - MARGIN && x <= rect.right  + MARGIN &&
      y >= rect.top  - MARGIN && y <= rect.bottom + MARGIN;

    const cards = Array.from(document.querySelectorAll('#work .wc'));
    const onMove = (e) => {
      let anyNear = false;
      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        const near = isNear(rect, e.clientX, e.clientY);
        const was  = nearState.get(card);
        if (near) anyNear = true;
        if (near) {
          nearState.set(card, true);
          const cx = rect.left + rect.width  / 2;
          const cy = rect.top  + rect.height / 2;
          const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / (rect.width  / 2)));
          const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / (rect.height / 2)));
          gsap.to(card, { x: dx * PULL, y: dy * PULL, filter: 'blur(0px)', duration: 0.4, ease: 'power2.out', overwrite: 'auto' });
        } else if (was) {
          nearState.set(card, false);
          gsap.to(card, { x: 0, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'elastic.out(1, 0.5)', overwrite: 'auto' });
        }
      });
      // Blur/dim cards that aren't being hovered when any card is active
      cards.forEach(card => {
        const near = nearState.get(card);
        if (anyNear && !near) {
          gsap.to(card, { filter: 'blur(15px)', duration: 0.35, ease: 'power2.out', overwrite: 'auto' });
        } else if (!anyNear) {
          gsap.to(card, { filter: 'blur(0px)', duration: 0.45, ease: 'power2.out', overwrite: 'auto' });
