    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<script>
(function(){
  var isDark = localStorage.getItem('dijitally-theme') === 'dark';
  var C = {
    speed:0.3, spread:0.3, stagger:0.002,
    bellStrength:0.8, curveShape:'bell',
    sliceH:2, order:'random', direction:'right',
    easing:'linear', overlayColor: isDark ? '#F5F3EE' : '#1A1818'
  };
  window.__glitchDone = false;
  window.__onGlitchDone = null;
  window.__invertIntroLogo = null;
  window.__beginGlitchTransition = null;
  if (sessionStorage.getItem('skipIntro')) {
    window.__glitchDone = true;
    var _il = document.getElementById('intro-logo-overlay');
    if (_il) _il.remove();
    var _ov = document.getElementById('glitch-overlay');
    if (_ov) {
      var _h = new Date().getHours();
      var _dark = localStorage.getItem('dijitally-theme') === 'dark' || (!localStorage.getItem('dijitally-theme') && (_h >= 18 || _h < 6));
      var _color = _dark ? '#121010' : '#F5F3EE';
      _ov.style.background = 'transparent';
      var _sliceH = 2, _H = window.innerHeight, _total = Math.ceil(_H / _sliceH);
      var _frag = document.createDocumentFragment(), _maxEnd = 0;
      var _delays = [], _durs = [];
      for (var _i = 0; _i < _total; _i++) {
        var _frac = _i / Math.max(_total - 1, 1);
        var _delay = _frac * 0.45 + Math.random() * 0.05;
        var _dur = 0.16 + Math.random() * 0.1;
        _delays.push(_delay); _durs.push(_dur);
        if (_delay + _dur > _maxEnd) _maxEnd = _delay + _dur;
        var _s = document.createElement('div');
        _s.style.cssText = 'position:absolute;left:0;width:100%;top:' + (_i * _sliceH) + 'px;height:' + (_sliceH + 1) + 'px;background:' + _color + ';transform:translateX(0);will-change:transform;';
        _frag.appendChild(_s);
      }
      _ov.appendChild(_frag);
      var _slices = Array.from(_ov.children);
      _slices.forEach(function(sl, i) {
        (function(sl, delay, dur) { setTimeout(function() { sl.style.transition = 'transform ' + dur.toFixed(3) + 's linear'; sl.style.transform = 'translateX(100%)'; }, delay * 1000); })(_slices[i], _delays[i], _durs[i]);
      });
      setTimeout(function() { _ov.parentNode && _ov.parentNode.removeChild(_ov); }, (_maxEnd + 0.2) * 1000);
    }
    return;
  }
  document.addEventListener('DOMContentLoaded', function() {
    var overlay = document.getElementById('glitch-overlay');
    if (!overlay) return;
    var H = window.innerHeight;
    var total = Math.ceil(H / C.sliceH);
    var slices = [];
    for (var i = 0; i < total; i++) {
      var el = document.createElement('div');
      el.style.cssText = 'position:absolute;left:0;width:100%;top:' + (i * C.sliceH) + 'px;height:' + C.sliceH + 'px;background:' + C.overlayColor + ';will-change:transform;';
      overlay.appendChild(el);
      slices.push(el);
    }
    var exitTransform = 'translateX(100%)';
    var indices = Array.from({length:total}, function(_,i){ return i; });
    var ordered = indices.slice().sort(function(){ return Math.random() - 0.5; });
    // Pre-calculate all strip timings
    var stripData = ordered.map(function(sliceIdx, i) {
      var variation = 0.2 + Math.random() * 1.6;
      var duration = C.speed * variation;
      var t = sliceIdx / Math.max(total - 1, 1);
      var norm = t * 2 - 1;
      var curveFactor = Math.exp(-norm * norm * 3.5);
      var bellDelay = curveFactor * C.bellStrength;
      var delay = (C.stagger * i) + bellDelay + (Math.random() * C.spread);
      return { sliceIdx: sliceIdx, duration: duration, delay: delay };
    });
    var maxEnd = 0;
    stripData.forEach(function(d) {
      var ms = (d.delay + d.duration) * 1000;
      if (ms > maxEnd) maxEnd = ms;
    });
    // Find when center of screen clears (for logo color inversion)
    var centerStripIdx = Math.round(total / 2);
    var centerMs = maxEnd / 2; // fallback
    for (var j = 0; j < stripData.length; j++) {
      if (stripData[j].sliceIdx === centerStripIdx) {
        centerMs = (stripData[j].delay + stripData[j].duration) * 1000;
        break;
      }
    }
    window.__beginGlitchTransition = function() {
      // Capture logo A's top offset once so mask rects use correct local coordinates
      var introEl = document.getElementById('intro-logo-overlay');
      var logoTop = introEl ? introEl.getBoundingClientRect().top : 0;
      var maskEl = document.getElementById('logo-a-mask');
      stripData.forEach(function(d) {
        (function(sl, sliceIdx, dur, del) {
          // Animate strip exit
          setTimeout(function() {
            sl.style.transition = 'transform ' + dur.toFixed(3) + 's ' + C.easing;
            sl.style.transform = exitTransform;
          }, del * 1000);
          // When strip finishes sliding away, mask Logo A at that Y band
          setTimeout(function() {
            if (!maskEl) return;
            var vy = sliceIdx * C.sliceH;
            var ly = vy - logoTop;
            var r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            r.setAttribute('x', '-99999');
            r.setAttribute('y', String(ly - 1));
            r.setAttribute('width', '199998');
            r.setAttribute('height', String(C.sliceH + 2));
            r.setAttribute('fill', 'black');
            maskEl.appendChild(r);
          }, (del + dur) * 1000);
        })(slices[d.sliceIdx], d.sliceIdx, d.duration, d.delay);
      });
      setTimeout(function() {
        overlay.remove();
        window.__glitchDone = true;
        if (window.__onGlitchDone) window.__onGlitchDone();
      }, maxEnd + 100);
    };
  });
})();

<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useRef } = React;
const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

if (typeof gsap !== 'undefined') {
  if (typeof ScrollTrigger !== 'undefined') {
    gsap.registerPlugin(ScrollTrigger);
    // Prevent ScrollTrigger from refreshing (and snapping scroll) when iOS browser chrome hides/shows
    ScrollTrigger.config({

/* ── ASCII reveal — left to right, 9 randomisations per char, 2s total ── */
const SPECIAL = '!@#$%&|<>{}░▒▓×±§÷¶~^*_+=[]/?\\';

function useAsciiReveal(text, totalMs=2000, active=true) {
  const [state, setState] = useState({
    chars: Array.from(text).map(c => c===' ' ? ' ' : ' '),
    cursorIdx: 0,
    done: false,
  });

  useEffect(() => {
    const RAND = 6;
    const perChar = totalMs / text.length;
    const perFrame = perChar / (RAND + 1);
    const ts = [];

    for (let step = 0; step < text.length; step++) {
      const i = step; // left → right
      const base = step * perChar;

      if (text[i] === ' ') {
        ts.push(setTimeout(() =>
          setState(prev => {
            const chars = [...prev.chars]; chars[i] = ' ';
            return { chars, cursorIdx: i + 1, done: i === text.length - 1 };
          }), base));
      } else {
        for (let r = 0; r < RAND; r++) {
          ts.push(setTimeout(() =>
            setState(prev => {
              const chars = [...prev.chars];
              chars[i] = SPECIAL[Math.floor(Math.random() * SPECIAL.length)];
              return { chars, cursorIdx: i, done: false };
            }), base + r * perFrame));
        }
        ts.push(setTimeout(() =>
          setState(prev => {
            const chars = [...prev.chars]; chars[i] = text[i];
            return { chars, cursorIdx: i + 1, done: i === text.length - 1 };
          }), base + RAND * perFrame));
      }
    }
    return () => ts.forEach(clearTimeout);
    if (!active) return;
  }, [text, totalMs, active]);

  return state;
}

function AsciiReveal({ text, style, active=true, getColor=null }) {
  const { chars, cursorIdx, done } = useAsciiReveal(text, 2000, active);
  const isCursor = (i) => active && !done && i === cursorIdx;
  return (
    <span style={style}>
      {Array.from(text).map((_, i) => (
        <span key={i} style={{
          background: isCursor(i) ? 'var(--secondary)' : 'transparent',
          color: isCursor(i) ? 'var(--bg)' : getColor ? getColor(i) : 'inherit',
        }}>
          {chars[i]}
        </span>
      ))}
    </span>
  );
}

/* ── StripRevealVideo — samples average colour from first video frame, uses it as
   the strip base, then wipes strips away to reveal the video on externalTrigger. ── */
function StripRevealVideo({ src, videoRef: externalVideoRef, videoProps={}, style={}, externalTrigger=false }) {
  const containerRef     = useRef(null);
  const internalVideoRef = useRef(null);
  const overlayRef       = useRef(null);
  const colorRef         = useRef(null);
  const doneRef          = useRef(false);
  const [ready, setReady] = useState(false);

  const setVideoRef = (el) => {
    internalVideoRef.current = el;
    if (typeof externalVideoRef === 'function') externalVideoRef(el);
    else if (externalVideoRef && 'current' in externalVideoRef) externalVideoRef.current = el;
  };

  const sampleColor = (video) => {
    try {
      const smpl = document.createElement('canvas');
      smpl.width = 64; smpl.height = 64;
      const ctx = smpl.getContext('2d');
      ctx.drawImage(video, 0, 0, 64, 64);
      const d = ctx.getImageData(0, 0, 64, 64).data;
      const buckets = {};
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i]   >> 5;
        const g = d[i+1] >> 5;
        const b = d[i+2] >> 5;
        const key = (r << 6) | (g << 3) | b;
        buckets[key] = (buckets[key] || 0) + 1;
      }
      const topKey = Object.keys(buckets).reduce((a, b) => buckets[a] > buckets[b] ? a : b);
      const r = ((topKey >> 6) & 7) * 36 + 18;
      const g = ((topKey >> 3) & 7) * 36 + 18;
      const b = ( topKey       & 7) * 36 + 18;
      return `rgb(${r},${g},${b})`;
    } catch(e) { return '#888'; }
  };

  // Wait for first decodable frame, sample colour, mark ready
  useEffect(() => {
    const video = internalVideoRef.current;
    if (!video) return;
    const onReady = () => {
      const color = sampleColor(video);
      colorRef.current = color;
      if (overlayRef.current) overlayRef.current.style.background = color;
      setReady(true);
    };
    if (video.readyState >= 2) { onReady(); return; }
    video.addEventListener('canplay', onReady, { once: true });
    return () => video.removeEventListener('canplay', onReady);
  }, []);

  // Gate strip animation on BOTH trigger and video ready
  useEffect(() => {
    if (!externalTrigger || !ready || doneRef.current) return;
    doneRef.current = true;
    const overlay = overlayRef.current;
    if (!overlay) return;

    const color  = colorRef.current || '#888';
    const H      = overlay.offsetHeight;
    const sliceH = 2;
    const total  = Math.ceil(H / sliceH);

    for (let i = 0; i < total; i++) {
      const s = document.createElement('div');
      s.style.cssText = `position:absolute;left:0;width:100%;top:${i*sliceH}px;height:${sliceH+1}px;background:${color};transform:translateX(0);will-change:transform;`;
      overlay.appendChild(s);
    }
    overlay.style.background = 'transparent';

    let maxEnd = 0;
    Array.from(overlay.children).forEach((sl, i) => {
      const frac  = i / Math.max(total - 1, 1);
      const delay = frac * 0.45 + Math.random() * 0.05;
      const dur   = 0.16 + Math.random() * 0.1;
      if (delay + dur > maxEnd) maxEnd = delay + dur;
      setTimeout(() => {
        sl.style.transition = `transform ${dur.toFixed(3)}s linear`;
        sl.style.transform  = 'translateX(100%)';
      }, delay * 1000);
    });
    setTimeout(() => { overlay.innerHTML = ''; }, (maxEnd + 0.15) * 1000);
  }, [externalTrigger, ready]);

  return (
    <div ref={containerRef} style={{ position:'relative', width:'100%', height:'100%', ...style }}>
      <video
        ref={setVideoRef}
        src={src}
        {...videoProps}
        style={{ display:'block', width:'100%', height:'100%', ...(videoProps.style||{}) }}
      />
      <div ref={overlayRef} style={{
        position:'absolute', inset:0, overflow:'hidden',
        background:'#888',
        pointerEvents:'none',
      }} />
    </div>
  );
}

/* ── StripRevealImg — samples the most-used colour from an image, overlays it,
   then wipes strips away to reveal the image when it enters the viewport. ── */
function StripRevealImg({ src, alt, style={}, delay=0 }) {
  const containerRef = useRef(null);
  const overlayRef   = useRef(null);
  const colorRef     = useRef(null);
  const doneRef      = useRef(false);

  // Histogram: find most-used colour bucket (32 levels per channel)
  const sampleColor = (img) => {
    try {
      const smpl = document.createElement('canvas');
      smpl.width = 64; smpl.height = 64;
      const ctx = smpl.getContext('2d');
      ctx.drawImage(img, 0, 0, 64, 64);
      const d = ctx.getImageData(0, 0, 64, 64).data;
      const buckets = {};
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i]   >> 5;
        const g = d[i+1] >> 5;
        const b = d[i+2] >> 5;
        const key = (r << 6) | (g << 3) | b;
        buckets[key] = (buckets[key] || 0) + 1;
      }
      const topKey = +Object.keys(buckets).reduce((a, b) => buckets[a] > buckets[b] ? a : b);
      const r = ((topKey >> 6) & 7) * 36 + 18;
      const g = ((topKey >> 3) & 7) * 36 + 18;
      const b = ( topKey       & 7) * 36 + 18;
      return `rgb(${r},${g},${b})`;
    } catch(e) { return '#888'; }
  };

  // Load image off-screen to sample colour, then apply to overlay
  useEffect(() => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const color = sampleColor(img);
      colorRef.current = color;
      if (overlayRef.current) overlayRef.current.style.background = color;
    };
    img.src = src;
  }, [src]);

  // Trigger strip wipe when card enters viewport
  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting || doneRef.current) return;
      doneRef.current = true;
      obs.disconnect();
      const overlay = overlayRef.current;
      if (!overlay) return;
      setTimeout(() => {
        const color = colorRef.current || '#888';
        const H = overlay.offsetHeight;
        const sliceH = 2;
        const total = Math.ceil(H / sliceH);
        for (let i = 0; i < total; i++) {
          const s = document.createElement('div');
          s.style.cssText = `position:absolute;left:0;width:100%;top:${i*sliceH}px;height:${sliceH+1}px;background:${color};transform:translateX(0);will-change:transform;`;
          overlay.appendChild(s);
        }
        overlay.style.background = 'transparent';
        const slices = Array.from(overlay.children);
        let maxEnd = 0;
        slices.forEach((sl, i) => {
          const frac = i / Math.max(total - 1, 1);
          const d = frac * 0.45 + Math.random() * 0.05;
          const dur = 0.16 + Math.random() * 0.1;
          if (d + dur > maxEnd) maxEnd = d + dur;
          setTimeout(() => {
            sl.style.transition = `transform ${dur.toFixed(3)}s linear`;
            sl.style.transform = 'translateX(100%)';
          }, d * 1000);
        });
        setTimeout(() => { overlay.innerHTML = ''; }, (maxEnd + 0.15) * 1000);
      }, delay * 1000);
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <div ref={containerRef} style={{ position:'relative', width:'100%', height:'100%', ...style }}>
      <img src={src} alt={alt||''} style={{ display:'block', width:'100%', height:'100%', objectFit:'cover' }} />
      <div ref={overlayRef} style={{
        position:'absolute', inset:0, overflow:'hidden',
        background:'#888',
        pointerEvents:'none',
      }} />
    </div>
  );
}


/* ── InViewAscii — triggers AsciiReveal when element enters viewport ── */
function InViewAscii({ text, style, getColor=null }) {
  const [active, setActive] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setActive(true); obs.disconnect(); } },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <span ref={ref} style={{display:'contents'}}>
      <AsciiReveal text={text} style={style} active={active} getColor={getColor} />
    </span>
  );
}

function PixelResolveImg({ src, alt, style={}, delay=0 }) {
  const containerRef = useRef(null), imgElRef = useRef(null), canvasRef = useRef(null);
  const timerRef = useRef(null);
  const [ready, setReady] = useState(false), [inView, setInView] = useState(false);
  const PX = 16, RAMP = 1200;
  const smplRef = useRef(document.createElement('canvas'));
  const sctxRef = useRef(smplRef.current.getContext('2d'));

  useEffect(() => {
    const img = imgElRef.current;
    if (!img) return;
    if (img.complete && img.naturalWidth) { setReady(true); return; }
    const h = () => setReady(true);
    img.addEventListener('load', h);
    return () => img.removeEventListener('load', h);
  }, []);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  const drawAt = (ctx, W, H, curPX, img) => {
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
    const smpl = smplRef.current, sctx = sctxRef.current;
    const sw = Math.max(1, Math.ceil(W / curPX)), sh = Math.max(1, Math.ceil(H / curPX));
    if (smpl.width !== sw)  smpl.width  = sw;
    if (smpl.height !== sh) smpl.height = sh;
    const vW = img.naturalWidth, vH = img.naturalHeight;
    const scale = Math.max(W / vW, H / vH);
    const sx = ((vW * scale - W) / 2) / scale, sy = ((vH * scale - H) / 2) / scale;
    sctx.drawImage(img, sx, sy, W / scale, H / scale, 0, 0, sw, sh);
    ctx.drawImage(smpl, 0, 0, sw, sh, 0, 0, W, H);
  };

  useEffect(() => {
    if (!ready || inView) return;
    const canvas = canvasRef.current, img = imgElRef.current;
    if (!canvas || !img) return;
    const W = containerRef.current?.offsetWidth, H = containerRef.current?.offsetHeight;
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;
    drawAt(canvas.getContext('2d'), W, H, PX, img);
  }, [ready, inView]);

  useEffect(() => {
    if (!inView || !ready) return;
    const timers = [];
    timerRef.current = setTimeout(() => {
      const canvas = canvasRef.current, img = imgElRef.current;
      if (!canvas || !img) return;
      const W = containerRef.current?.offsetWidth, H = containerRef.current?.offsetHeight;
      if (!W || !H) return;
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      const steps = new Set();
      for (let i = 0; i <= 60; i++) {
        const t = i / 60;
        steps.add(Math.max(1, Math.round(1 + (PX - 1) * ease(1 - t))));
      }
      Array.from(steps).sort((a,b) => b-a).forEach(px => {
        const t = 1 - (px - 1) / (PX - 1);
        const id = setTimeout(() => {
          if (px === 1) ctx.clearRect(0, 0, W, H);
          else          drawAt(ctx, W, H, px, img);
        }, ease(t) * RAMP);
        timers.push(id);
      });
    }, delay * 1000);
    return () => { clearTimeout(timerRef.current); timers.forEach(clearTimeout); };
  }, [inView, ready]);

  return (
    <div ref={containerRef} style={{position:'relative',width:'100%',height:'100%',...style}}>
      <img ref={imgElRef} src={src} alt={alt||''} style={{display:'block',width:'100%',height:'100%',objectFit:'cover'}}/>
      <canvas ref={canvasRef} style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none'}}/>
    </div>
  );
}

function DitherBg({ src, dark, active, px=8 }) {
  const canvasRef  = React.useRef(null);
  const videoRef   = React.useRef(null);
  const darkRef    = React.useRef(dark);
  const activeRef  = React.useRef(active);
  React.useEffect(()=>{ darkRef.current  = dark;   }, [dark]);
  React.useEffect(()=>{ activeRef.current = active; }, [active]);

  React.useEffect(()=>{
    const canvas = canvasRef.current;
    const video  = videoRef.current;
    if (!canvas || !video) return;

    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d', { willReadFrequently: true });

    const PX=px;
    const BR=0.10, CT=2.4, GM=1.13;
    const LON=[237,234,229], LOFF=[245,243,238];
    const DON=[18,16,16],    DOFF=[0,0,0];
    const BAYER=[[0,2,0,2],[3,1,3,1],[0,2,0,2],[3,1,3,1]];

    let cols=0, rows=0, raf;
    let outBuf=null, outImageData=null;
    let frameCount=0, cachedId=null;

    function build(){
      cols = Math.floor(canvas.width/PX);
      rows = Math.floor(canvas.height/PX);
      smpl.width=cols; smpl.height=rows;
      outBuf = new Uint8ClampedArray(canvas.width*canvas.height*4);
      outImageData = ctx.createImageData(canvas.width, canvas.height);
    }

    function setSize(){
      const vw = video.videoWidth  || 640;
      const vh = video.videoHeight || 360;
      const cw = canvas.parentElement ? canvas.parentElement.offsetWidth  : 400;
      const ch = canvas.parentElement ? canvas.parentElement.offsetHeight : 400;
      const scale = Math.max(cw / vw, ch / vh) * 0.85;
      const w = Math.round(vw * scale);
      const h = Math.round(vh * scale);
      canvas.width  = Math.floor(w / PX) * PX;
      canvas.height = Math.floor(h / PX) * PX;
      canvas.style.width  = canvas.width  + 'px';
      canvas.style.height = canvas.height + 'px';
      canvas.style.left   = Math.round((cw - canvas.width)  / 2) + 'px';
      canvas.style.top    = Math.round((ch - canvas.height) / 2) + 'px';
      build();
    }

    function loop(){
      raf = requestAnimationFrame(loop);
      if (!activeRef.current) return;
      frameCount++;
      if (!outBuf || video.readyState < 2) return;
      if (frameCount % 2 === 0) {
        sctx.drawImage(video, 0, 0, cols, rows);
        cachedId = sctx.getImageData(0, 0, cols, rows);
      }
      if (!cachedId) return;
      outBuf.fill(0);
      const W = canvas.width;
      const isDark = darkRef.current;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const idx = (row * cols + col) * 4;
          let lum = (0.299*cachedId.data[idx] + 0.587*cachedId.data[idx+1] + 0.114*cachedId.data[idx+2]) / 255;
          lum = Math.pow(Math.max(0, lum), GM);
          lum = (lum - 0.5) * CT + 0.5;
          lum = Math.max(0, Math.min(1, lum + BR));
          const bl = isDark ? 1 - lum : lum;
          const thr = (BAYER[row & 3][col & 3] + 0.5) / 4;
          const ch = (bl <= thr) ? (isDark ? DON : LON) : (isDark ? DOFF : LOFF);
          const gx = col * PX, gy = row * PX;
          for (let dy = 0; dy < PX; dy++) {
            let base = ((gy + dy) * W + gx) * 4;
            for (let dx = 0; dx < PX; dx++) {
              outBuf[base]=ch[0]; outBuf[base+1]=ch[1]; outBuf[base+2]=ch[2]; outBuf[base+3]=255;
              base += 4;
            }
          }
        }
      }
      outImageData.data.set(outBuf);
      ctx.putImageData(outImageData, 0, 0);
    }

    const ro = new ResizeObserver(setSize);
    ro.observe(canvas.parentElement);
    setSize();
    video.addEventListener('loadedmetadata', setSize);
    video.play().catch(()=>{});
    loop();
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);

  return (
    <>
      <video ref={videoRef} src={src} autoPlay muted loop playsInline crossOrigin="anonymous"
        style={{position:'absolute', opacity:0, width:1, height:1, pointerEvents:'none'}} />
      <canvas ref={canvasRef} style={{
        position:'absolute',
        pointerEvents:'none', zIndex:0, opacity:0.9,
      }} />
    </>
  );
}

function ServicesHero({ isMobile, dark }) {
  const [activeStep, setActiveStep] = React.useState(0);
  const [carouselIndex, setCarouselIndex] = React.useState(0);
  const [carouselEngaged, setCarouselEngaged] = React.useState(false);
  const mobileBracketRef = useRef(null);
  const mobileCycleRef = useRef(null);
  const mobileSplitRef = useRef(null);
  const mobileYourRef       = useRef(null);
  const mobileBracketOpenRef  = useRef(null);
  const mobileBracketCloseRef = useRef(null);
  const mobileAllyRef       = useRef(null);
  const allyContainerRef = useRef(null);
  const bgRefs           = useRef([]);
  const yourInnerRef     = useRef(null);
  const yourWrapRef      = useRef(null);
  const bracketOpenRef   = useRef(null);
  const posRef           = useRef(null);
  const svcWordRefs      = useRef([]);
  const bracketCloseRef  = useRef(null);
  const allyMarkRef      = useRef(null);
  const wordSlotRef      = useRef(null);
  const pillsRef         = useRef(null);
  const pillBoxRef       = useRef(null);
  const pillTextRefs     = useRef([]);
  const bodyRefs         = useRef([]);
  const step0BodyRef     = useRef(null);
  const videoRefs        = useRef([]);
  const ditherBgRefs     = useRef([]);
  const ditherHeroRef    = useRef(null);
  const ditherOverlayRefs = useRef([]);
  const darkPropRef      = useRef(dark);
  const carouselRef      = useRef(null);
  const carouselThumbRef = useRef(null);
  const goToStepRef      = useRef(null);
  const circleWrapRef    = useRef(null);
  const circleImgRefs    = useRef([]);

  useEffect(() => { darkPropRef.current = dark; }, [dark]);

  useEffect(() => {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    if (typeof SplitText === 'undefined') return;
    if (isMobile) return;
    const el = allyContainerRef.current;
    if (!el) return;

    const N = 7;
    const STEP = 1 / N;

    const posNaturalW  = posRef.current ? Math.ceil(posRef.current.getBoundingClientRect().width) : 0;
    const svcNaturalWs = svcWordRefs.current.map(el => el ? Math.ceil(el.getBoundingClientRect().width) : 0);

    if (wordSlotRef.current) gsap.set(wordSlotRef.current, { width: posNaturalW });

    const yourSplit = new SplitText(yourInnerRef.current, { type: "words" });
    gsap.set(yourSplit.words, { y: "0%" });

    const posSplit = new SplitText(posRef.current, { type: "words" });
    gsap.set(posSplit.words, { y: "0%" });

    const svcSplits = svcWordRefs.current.map(el => {
      if (!el) return null;
      const s = new SplitText(el, { type: "chars" });
      gsap.set(s.chars, { y: "110%", opacity: 0 });
      return s;
    });

    var cascadeEls = [
      yourWrapRef.current,
      bracketOpenRef.current,
      posRef.current,
      bracketCloseRef.current,
      allyMarkRef.current,
    ];
    gsap.set(cascadeEls, { y: 60, opacity: 0 });
    gsap.set(pillsRef.current, { opacity: 0 });
    videoRefs.current.forEach(v => v && gsap.set(v, { opacity: 0 }));
    bodyRefs.current.forEach(b => b && gsap.set(b, { opacity: 0 }));
    if (step0BodyRef.current) gsap.set(step0BodyRef.current, { opacity: 0 });

    const pillPitch  = pillTextRefs.current[0] ? pillTextRefs.current[0].offsetHeight + 8 : 45;
    const pillWidths = pillTextRefs.current.map(el => el ? Math.ceil(el.getBoundingClientRect().width) : 0);
    if (pillBoxRef.current) gsap.set(pillBoxRef.current, { y: 0, width: 0, height: pillTextRefs.current[0]?.offsetHeight || 37, opacity: 0 });

    const tl = gsap.timeline({ paused: true });

    SVC_ROWS.forEach((svc, i) => {
      const s = (i + 1) * STEP;

      if (i === 0) {
        tl.to(posSplit.words, {
          y: "-110%", opacity: 0, duration: STEP * 0.12, ease: "power2.in",
          stagger: { each: STEP * 0.04, from: "end" },
        }, s - STEP * 0.25);
        if (yourWrapRef.current) tl.to(yourWrapRef.current, {
          opacity: 0, width: 0, duration: STEP * 0.15, ease: "power2.in",
        }, s - STEP * 0.25);
      }

      if (i === 0) {
        tl.to(pillsRef.current,   { opacity: 1, duration: STEP * 0.15 }, s - STEP * 0.3);
        tl.to(pillBoxRef.current, { opacity: 1, duration: STEP * 0.15 }, s - STEP * 0.3);
      }
      if (pillTextRefs.current[i]) {
        tl.to(pillTextRefs.current[i], { color: "var(--bg)", duration: STEP * 0.1 }, s - STEP * 0.45);
      }
      if (i > 0 && pillTextRefs.current[i - 1]) {
        tl.to(pillTextRefs.current[i - 1], { color: "var(--secondary)", duration: STEP * 0.1 }, s - STEP * 0.45);
      }
    });

    var currentStep = 0;
    var cascadeDone = false;
    var animating = false;
    var sectionActive = false;
    var pinST = null;
    var cascadeHasPlayed = false;

    var bodySplits = bodyRefs.current.map(function(el) {
      if (!el) return null;
      var s = new SplitText(el, { type: "words" });
      gsap.set(s.words, { y: "18px", opacity: 0 });
      return s;
    });

    var CIRCLE_R = 270, CIRCLE_IMG_SIZE = 100;
    var circleAnimDone = true;
    var circleLayout = CIRCLE_IMGS.map(function(_, i) {
      var baseAngle = (i / CIRCLE_IMGS.length) * Math.PI * 2 - Math.PI / 2;
      return {
        baseAngle: baseAngle,
        stackX:  (Math.random() - 0.5) * 28,
        stackY:  110 + (Math.random() - 0.5) * 18,
        stackR:  (Math.random() - 0.5) * 32,
        fanX:    Math.cos(baseAngle) * CIRCLE_R,
        fanY:    Math.sin(baseAngle) * CIRCLE_R,
      };
    });

    function positionCircleCenter() {
      var wrap = circleWrapRef.current;
      var slot = wordSlotRef.current;
      var container = allyContainerRef.current;
      if (!wrap || !slot || !container) return;
      var slotRect = slot.getBoundingClientRect();
      var cRect   = container.getBoundingClientRect();
      gsap.set(wrap, {
        left: 0,
        top:  slotRect.top + slotRect.height / 2 - cRect.top,
      });
    }
    positionCircleCenter();

    function setCircleStack() {
      circleLayout.forEach(function(d, i) {
        var img = circleImgRefs.current[i];
        if (!img) return;
        gsap.set(img, { x: d.stackX, y: d.stackY, rotation: d.stackR, opacity: 0 });
      });
    }

    var orbitAngle = 0;
    var orbitTicker = null;
    var circleRotateTween = null;
    var circleSlideX = 0;
    var circleSlideStart = 0;

    function startOrbitTicker() {
      if (orbitTicker) return;
      orbitTicker = function() {
        orbitAngle += (Math.PI * 2) / (30 * 60);
        circleLayout.forEach(function(d, i) {
          var img = circleImgRefs.current[i];
          if (!img) return;
          var a = d.baseAngle + orbitAngle;
          gsap.set(img, { x: Math.cos(a) * CIRCLE_R, y: Math.sin(a) * CIRCLE_R });
        });
      };
      gsap.ticker.add(orbitTicker);
    }

    function stopOrbitTicker() {
      if (orbitTicker) { gsap.ticker.remove(orbitTicker); orbitTicker = null; }
    }

    function initCircleSlide() {
      circleSlideStart = CIRCLE_R * 2 + 60;
      circleSlideX = 0;
      circleAnimDone = false;
      circleLayout.forEach(function(d, i) {
        var img = circleImgRefs.current[i];
        if (!img) return;
        var a = d.baseAngle + orbitAngle;
        gsap.set(img, { x: Math.cos(a) * CIRCLE_R, y: Math.sin(a) * CIRCLE_R, opacity: 1 });
      });
      gsap.set(circleWrapRef.current, { left: -circleSlideStart });
      startOrbitTicker();
    }

    function slideCircleStep() {
      var step = circleSlideStart / 4;
      circleSlideX = Math.min(circleSlideX + step, circleSlideStart);
      var targetLeft = -circleSlideStart + circleSlideX;
      gsap.to(circleWrapRef.current, { left: targetLeft, duration: 0.6, ease: "power3.out",
        onComplete: function() {
          if (targetLeft >= 0) {
            circleAnimDone = true;
          }
        }
      });
    }

    function showCircleOrbit() {
      gsap.set(circleWrapRef.current, { left: 0 });
      circleAnimDone = true;
      circleLayout.forEach(function(d, i) {
        var img = circleImgRefs.current[i];
        if (!img) return;
        var a = d.baseAngle + orbitAngle;
        gsap.set(img, { x: Math.cos(a) * CIRCLE_R, y: Math.sin(a) * CIRCLE_R, rotation: 0, opacity: 1 });
      });
      startOrbitTicker();
    }

    function rotateCircleToVideoSlot(pi) {
      var newSrc = (pi >= 0 && SVC_ROWS[pi]) ? SVC_ROWS[pi].video : CIRCLE_VIDEO_SRC;
      var d9 = circleLayout[9];
      var TWO_PI = Math.PI * 2;
      var currentAbs = d9.baseAngle + orbitAngle;
      var normalised = ((currentAbs % TWO_PI) + TWO_PI) % TWO_PI;
      var forward = (TWO_PI - normalised) % TWO_PI;
      if (forward < 0.15) forward += TWO_PI;
      var targetOrbit = orbitAngle + forward;
      stopOrbitTicker();
      if (circleRotateTween) { circleRotateTween.kill(); circleRotateTween = null; }
      var proxy = { v: orbitAngle };
      var srcSwapped = false;
      circleRotateTween = gsap.to(proxy, {
        v: targetOrbit,
        duration: 1.4,
        ease: "power2.inOut",
        onUpdate: function() {
          orbitAngle = proxy.v;
          circleLayout.forEach(function(d, i) {
            var img = circleImgRefs.current[i];
            if (!img) return;
            var a = d.baseAngle + orbitAngle;
            gsap.set(img, { x: Math.cos(a) * CIRCLE_R, y: Math.sin(a) * CIRCLE_R });
          });
          if (!srcSwapped) {
            var a9 = d9.baseAngle + orbitAngle;
            if (Math.cos(a9) < 0) {
              srcSwapped = true;
              var videoEl = circleImgRefs.current[9];
              if (videoEl) {
                videoEl.src = newSrc;
                videoEl.load();
                videoEl.play().catch(function(){});
              }
            }
          }
        },
        onComplete: function() { circleRotateTween = null; if (pi < 0) startOrbitTicker(); },
      });
    }

    function getBgColor() {
      return darkPropRef.current ? '#121010' : '#F5F3EE';
    }

    function resetOverlay(ov) {
      if (!ov) return;
      if (ov.__stripTimer) { clearTimeout(ov.__stripTimer); ov.__stripTimer = null; }
      ov.innerHTML = '';
      ov.style.background = getBgColor();
    }

    function triggerStripReveal(ov) {
      if (!ov) return;
      if (ov.__stripTimer) { clearTimeout(ov.__stripTimer); ov.__stripTimer = null; }
      var color = getBgColor();
      var W = ov.offsetWidth;
      var sliceW = 6;
      var total = Math.ceil(W / sliceW);
      ov.innerHTML = '';
      ov.style.background = 'transparent';
      var frag = document.createDocumentFragment();
      for (var i = 0; i < total; i++) {
        var s = document.createElement('div');
        s.style.cssText = 'position:absolute;top:0;height:100%;left:' + (i * sliceW) + 'px;width:' + (sliceW + 1) + 'px;background:' + color + ';transform:translateY(0);will-change:transform;';
        frag.appendChild(s);
      }
      ov.appendChild(frag);
      var slices = Array.from(ov.children);
      var maxEnd = 0;
      slices.forEach(function(sl, i) {
        var t = i / Math.max(total - 1, 1);
        var delay = t * 0.35 + Math.random() * 0.1;
        var dur   = 0.18 + Math.random() * 0.14;
        if (delay + dur > maxEnd) maxEnd = delay + dur;
        (function(sl, delay, dur) {
          setTimeout(function() {
            sl.style.transition = 'transform ' + dur.toFixed(3) + 's linear';
            sl.style.transform  = 'translateY(-100%)';
          }, delay * 1000);
        })(sl, delay, dur);
      });
      ov.__stripTimer = setTimeout(function() { ov.innerHTML = ''; ov.__stripTimer = null; }, (maxEnd + 0.15) * 1000);
    }

    function handleSectionChange(step, instant) {
      setActiveStep(step);
      var pi = step - 1;

      var thumb = videoRefs.current[0];
      if (thumb) gsap.to(thumb, { opacity: step === 0 ? 1 : 0, duration: instant ? 0 : 0.4, ease: "power2.out" });

      ditherBgRefs.current.forEach(function(el, idx) {
        if (!el) return;
        var ov = ditherOverlayRefs.current[idx];
        if (idx === pi) {
          gsap.set(el, { opacity: 1 });
          if (!instant && ov) triggerStripReveal(ov);
        } else {
          gsap.set(el, { opacity: 0 });
          if (ov) resetOverlay(ov);
        }
      });

      svcSplits.forEach(function(split, idx) {
        if (!split || !split.chars) return;
        gsap.killTweensOf(split.chars);
        if (instant && idx === pi) {
          gsap.set(split.chars, { y: "0%", opacity: 1 });
        } else {
          gsap.set(split.chars, { y: "110%", opacity: 0 });
        }
      });

      bodyRefs.current.forEach(function(bel, idx) {
        if (!bel) return;
        if (instant && idx === pi) {
          gsap.set(bel, { opacity: 1 });
          if (bodySplits[idx] && bodySplits[idx].words) {
            gsap.killTweensOf(bodySplits[idx].words);
            gsap.set(bodySplits[idx].words, { y: "0px", opacity: 1 });
          }
        } else {
          gsap.set(bel, { opacity: 0 });
          if (bodySplits[idx] && bodySplits[idx].words) {
            gsap.killTweensOf(bodySplits[idx].words);
            gsap.set(bodySplits[idx].words, { y: "18px", opacity: 0 });
          }
        }
      });

      if (step0BodyRef.current) { if (instant) gsap.set(step0BodyRef.current, { opacity: pi < 0 ? 1 : 0 }); else gsap.to(step0BodyRef.current, { opacity: pi < 0 ? 1 : 0, duration: 0.3, ease: "power1.out" }); }
      if (ditherHeroRef.current) { if (instant) gsap.set(ditherHeroRef.current, { opacity: pi < 0 ? 1 : 0 }); else gsap.to(ditherHeroRef.current, { opacity: pi < 0 ? 1 : 0, duration: 0.4, ease: "power1.out" }); }

      if (pi >= 0) {
        if (posSplit && posSplit.words) {
          gsap.killTweensOf(posSplit.words);
          gsap.set(posSplit.words, { y: "-110%", opacity: 0 });
        }
        if (yourWrapRef.current) {
          gsap.killTweensOf(yourWrapRef.current);
          gsap.set(yourWrapRef.current, { opacity: 0, width: 0 });
        }

        if (wordSlotRef.current && svcNaturalWs[pi]) {
          gsap.set(wordSlotRef.current, { width: svcNaturalWs[pi] });
        }
        if (pillBoxRef.current && pillWidths[pi]) {
          gsap.set(pillBoxRef.current, { width: pillWidths[pi], y: pi * pillPitch });
        }
        pillTextRefs.current.forEach(function(pel, idx) {
          if (!pel) return;
          gsap.set(pel, { color: idx === pi ? "var(--bg)" : "var(--secondary)" });
        });
        if (!instant && svcSplits[pi] && svcSplits[pi].chars) {
          gsap.to(svcSplits[pi].chars, { y: "0%", opacity: 1, duration: 0.375, ease: "power2.out", stagger: { each: 0.0225 } });
        }
        if (!instant && bodyRefs.current[pi]) {
          gsap.set(bodyRefs.current[pi], { opacity: 1 });
          if (bodySplits[pi] && bodySplits[pi].words) {
            gsap.to(bodySplits[pi].words, {
              y: "0px", opacity: 1, duration: 0.5, ease: "power2.out",
              stagger: { each: 0.02 }, delay: 0.1,
            });
          }
        }
      }
    }

    var tlTween = null;
    var lastStepTime = 0;
    var STEP_COOLDOWN = 750;
    var wheelAcc = 0;
    var wheelAccTimer = null;
    var pendingExitDown = false;

    function goToStep(next) {
      var now = Date.now();
      if (!cascadeDone || animating || next === currentStep) return;
      if (now - lastStepTime < STEP_COOLDOWN) return;
      if (next < 0 || next >= N) return;
      animating = true;
      lastStepTime = now;
      var prevStep = currentStep;
      currentStep = next;

      if (tlTween) tlTween.kill();

      var prevPi = prevStep - 1;

      if (next === 0) {
        svcSplits.forEach(function(split) {
          if (!split || !split.chars) return;
          gsap.killTweensOf(split.chars);
          gsap.set(split.chars, { y: "110%", opacity: 0 });
        });
        bodyRefs.current.forEach(function(b) { if (b) gsap.set(b, { opacity: 0 }); });
        if (step0BodyRef.current) gsap.set(step0BodyRef.current, { opacity: 0 });
        ditherOverlayRefs.current.forEach(function(ov) { resetOverlay(ov); });
        tl.seek(0, true);
        gsap.set(wordSlotRef.current, { width: posNaturalW });
        gsap.killTweensOf(posSplit.words);
        gsap.set(posSplit.words, { y: "0%", opacity: 1 });
        if (pillBoxRef.current) gsap.set(pillBoxRef.current, { y: 0 });
        handleSectionChange(0);
        setTimeout(function() { animating = false; lastStepTime = 0; }, 420);
        return;
      }

      if (prevPi >= 0) {
        if (svcSplits[prevPi] && svcSplits[prevPi].chars) {
          gsap.killTweensOf(svcSplits[prevPi].chars);
          gsap.to(svcSplits[prevPi].chars, {
            y: "-110%", opacity: 0,
            duration: 0.28, ease: "power2.in",
            stagger: { each: 0.014, from: "end" },
          });
        }
        if (bodyRefs.current[prevPi]) {
          gsap.to(bodyRefs.current[prevPi], { opacity: 0, duration: 0.2, ease: "power1.in" });
        }
      }

      var pi = next - 1;
      if (pillBoxRef.current && pillWidths[pi]) {
        gsap.to(pillBoxRef.current, { width: pillWidths[pi], duration: 0.22, ease: "power2.inOut" });
        gsap.to(pillBoxRef.current, { y: pi * pillPitch, duration: 0.6, ease: "back.out(1.2)", delay: 0.08, overwrite: "auto" });
      }
      if (wordSlotRef.current && svcNaturalWs[pi]) {
        gsap.killTweensOf(wordSlotRef.current);
        gsap.to(wordSlotRef.current, { width: svcNaturalWs[pi], duration: 0.15, ease: "power2.inOut" });
      }
      tlTween = tl.tweenTo(next / N, {
        duration: 0.7,
        ease: "power2.inOut",
        onComplete: function() {
          animating = false;
          lastStepTime = 0;
          handleSectionChange(next);
          if (pendingExitDown) {
            pendingExitDown = false;
            sectionActive = false;
            wheelAcc = 0;
            if (pinST) window.scrollTo(0, pinST.end + 10);
          }
        },
      });
    }

    goToStepRef.current = goToStep;

    var wheelHandler = function(e) {
      if (!sectionActive) {
        // Re-activate if we're sitting at the pin start and the user scrolls down again
        if (pinST && e.deltaY > 0 && cascadeDone && !animating) {
          var sy = window.pageYOffset || document.documentElement.scrollTop;
          if (sy >= pinST.start - 2 && sy <= pinST.start + 2) {
            sectionActive = true;
            // If section was completed, reset so the loop can play again
            if (currentStep >= N - 1) {
              currentStep = 0;
              tl.seek(0, true);
              gsap.set(pillsRef.current, { opacity: 0 });
              if (pillBoxRef.current) gsap.set(pillBoxRef.current, { y: 0, opacity: 0 });
              videoRefs.current.forEach(function(v) { if (v) gsap.set(v, { opacity: 0 }); });
              bodyRefs.current.forEach(function(b) { if (b) gsap.set(b, { opacity: 0 }); });
              if (step0BodyRef.current) gsap.set(step0BodyRef.current, { opacity: 0 });
              if (ditherHeroRef.current) gsap.set(ditherHeroRef.current, { opacity: 1 });
              if (posSplit && posSplit.words) gsap.set(posSplit.words, { y: "0%", opacity: 1 });
              if (wordSlotRef.current) gsap.set(wordSlotRef.current, { width: posNaturalW });
              svcSplits.forEach(function(split) { if (split && split.chars) gsap.set(split.chars, { y: "110%", opacity: 0 }); });
              ditherBgRefs.current.forEach(function(el) { if (el) gsap.set(el, { opacity: 0 }); });
              ditherOverlayRefs.current.forEach(function(ov) { resetOverlay(ov); });
              setActiveStep(0);
              handleSectionChange(0);
            }
          }
        }
        if (!sectionActive) return;
      }
      if (!cascadeDone) { e.preventDefault(); return; }
      e.preventDefault();
      var dir = e.deltaY > 0 ? 1 : -1;

      if (dir > 0 && currentStep >= N - 1) {
        if (animating) {
          pendingExitDown = true;
          return;
        }
        sectionActive = false;
        wheelAcc = 0;
        if (tlTween) { tlTween.kill(); tlTween = null; }
        if (pinST) window.scrollTo(0, pinST.end + 10);
        return;
      }

      if (animating) return;

      if (currentStep === 0 && !circleAnimDone) {
        if (dir < 0) {
          sectionActive = false; animating = false; wheelAcc = 0;
          if (pinST) window.scrollTo(0, Math.max(0, pinST.start - 10));
          return;
        }
        wheelAcc += e.deltaY;
        clearTimeout(wheelAccTimer);
        wheelAccTimer = setTimeout(function() { wheelAcc = 0; }, 150);
        if (Math.abs(wheelAcc) < 60) return;
        wheelAcc = 0;
        slideCircleStep();
        return;
      }

      if (dir < 0 && currentStep <= 0) {
        sectionActive = false;
        animating = false;
        wheelAcc = 0;
        if (tlTween) { tlTween.kill(); tlTween = null; }
        if (pinST) window.scrollTo(0, Math.max(0, pinST.start - 10));
        return;
      }
      wheelAcc += e.deltaY;
      clearTimeout(wheelAccTimer);
      wheelAccTimer = setTimeout(function() { wheelAcc = 0; }, 150);
      if (Math.abs(wheelAcc) < 60) return;
      wheelAcc = 0;
      goToStep(currentStep + dir);
    };
    window.addEventListener('wheel', wheelHandler, { passive: false });

    var touchStartY = 0;
    var touchHandler = function(e) {
      if (!sectionActive || !cascadeDone) return;
      if (e.type === "touchstart") { touchStartY = e.touches[0].clientY; return; }
      var dy = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(dy) < 30) return;
      var dir = dy > 0 ? 1 : -1;
      if (currentStep === 0 && !circleAnimDone) {
        if (dir < 0) { sectionActive = false; if (pinST) window.scrollTo(0, Math.max(0, pinST.start - 10)); return; }
        slideCircleStep();
        return;
      }
      if (dir > 0 && currentStep >= N - 1) return;
      if (dir < 0 && currentStep <= 0) return;
      e.preventDefault();
      goToStep(currentStep + dir);
    };
    window.addEventListener('touchstart', touchHandler, { passive: true });
    window.addEventListener('touchend', touchHandler, { passive: false });

    pinST = ScrollTrigger.create({
      trigger: el,
      start: "top top",
      end: "+=" + ((N - 1) * window.innerHeight),
      pin: true,
      onEnter: function() {
        sectionActive = true;
        currentStep = 0;
        cascadeDone = false;
        animating = false;

        tl.seek(0, true);
        videoRefs.current.forEach(function(v) { if (v) gsap.set(v, { opacity: 0 }); });
        gsap.set(pillsRef.current, { opacity: 0 });
        if (pillBoxRef.current) gsap.set(pillBoxRef.current, { y: 0, opacity: 0 });
        svcSplits.forEach(function(split) {
          if (split && split.chars) gsap.set(split.chars, { y: "110%" });
        });
        bodyRefs.current.forEach(function(b) { if (b) gsap.set(b, { opacity: 0 }); });
        ditherOverlayRefs.current.forEach(function(ov) { resetOverlay(ov); });
        gsap.set(wordSlotRef.current, { width: posNaturalW });
        if (posSplit && posSplit.words) gsap.set(posSplit.words, { y: "0%", opacity: 1 });
        setActiveStep(0);

        if (cascadeHasPlayed) {
          gsap.set([yourWrapRef.current, bracketOpenRef.current, posRef.current, bracketCloseRef.current, allyMarkRef.current], { y: 0, opacity: 1 });
          cascadeDone = true;
          handleSectionChange(0);
          return;
        }

        gsap.set([yourWrapRef.current, bracketOpenRef.current, posRef.current, bracketCloseRef.current, allyMarkRef.current], { y: 60, opacity: 0 });
        var dur = 0.5, ease = "power2.out", stagger = 0.12;
        var t = gsap.timeline({
          delay: 0.2,
          onComplete: function() {
            cascadeDone = true;
            cascadeHasPlayed = true;
            handleSectionChange(0);
          },
        });
        [yourWrapRef.current, bracketOpenRef.current, posRef.current, bracketCloseRef.current, allyMarkRef.current].forEach(function(cel, idx) {
          t.to(cel, { y: 0, opacity: 1, duration: dur, ease: ease }, idx * stagger);
        });
      },
      onLeave: function() {
        sectionActive = false;
        animating = false;
        if (tlTween) { tlTween.kill(); tlTween = null; }
      },
      onEnterBack: function() {
        sectionActive = true;
        lastStepTime = 0;
        animating = false;

/* ── Eyebrow label (JetBrains Mono 12px) ── */
function Eyebrow({children,style={},center=true}) {
  const ref = useRef(null);

  useEffect(()=>{
    const el = ref.current;
    if (!el || typeof gsap==='undefined' || typeof ScrambleTextPlugin==='undefined') return;
    const text = String(children||'');
    const obs = new IntersectionObserver(([e])=>{
      if (!e.isIntersecting) return;
      obs.disconnect();
      gsap.to(el, {
        duration: 1.5, ease:'none',
        scrambleText:{ text, chars:'upperCase', revealDelay:0.3, speed:0.6 },
      });
    },{ threshold:0.5 });
    obs.observe(el);
    return ()=> obs.disconnect();
  },[]);

  return (
    <span
      ref={ref}
      dangerouslySetInnerHTML={{__html: String(children||'')}}
      style={{fontFamily:"var(--mono)",fontSize:"var(--eyebrow)",fontWeight:400,lineHeight:"100%",letterSpacing:"var(--eyebrow-ls)",color:"var(--static)",textAlign:center?"center":"left",...style}}
    />
  );
}

/* ── ScrambleSpan — applies ScrambleText to any inline element on scroll-enter ── */
function ScrambleSpan({children, style={}, tag='span'}) {
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if (!el || typeof gsap==='undefined' || typeof ScrambleTextPlugin==='undefined') return;
    const text = String(children||'');

    // Scroll-enter scramble (one-shot)
    const obs = new IntersectionObserver(([e])=>{
      if (!e.isIntersecting) return;
      obs.disconnect();
      gsap.to(el, { duration:1.5, ease:'none',
        scrambleText:{ text, chars:'upperCase', revealDelay:0.3, speed:0.6 },
      });
    },{ threshold:0.5 });
    obs.observe(el);

    // Hover scramble — lock width first so layout never shifts
    const lockAndScramble = () => {
      el.style.display    = 'inline-block';
      el.style.whiteSpace = 'nowrap';
      if (!el.style.width) el.style.width = el.offsetWidth + 'px';
      el.style.overflow   = 'hidden';
      gsap.to(el, { duration:0.5, ease:'none',
        scrambleText:{ text, chars:'upperCase', revealDelay:0.1, speed:0.8 },
      });
    };
    el.addEventListener('mouseenter', lockAndScramble);

    return ()=>{ obs.disconnect(); el.removeEventListener('mouseenter', lockAndScramble); };
  },[]);
  const Tag = tag;
  return React.createElement(Tag, {
    ref,
    dangerouslySetInnerHTML:{__html: String(children||'')},
    style,
  });
}

/* ── ContactPixels — grid-aligned corner pixel clusters matching Figma design ── */
const SVG_LOGOS = [
  'svgs/pattern_01.svg',
  'svgs/pattern_02.svg',
  'svgs/pattern_03.svg',
];
// Preloaded at module level — used by ContactPixels
const PATTERN_IMGS = SVG_LOGOS.map(src => {
  const img = new Image(); img.src = src; return img;
});

function ContactPixels({ dark, mobile }) {
  const canvasRef     = useRef(null);
  const darkRef       = useRef(dark);
  const scrollProgRef = useRef(0);

  useEffect(()=>{ darkRef.current = dark; }, [dark]);

  useEffect(()=>{
    const canvas = canvasRef.current;
    if (!canvas) return;

    const CELL = mobile ? Math.round(32 * 0.66) : 32;

    let W = 0, H = 0, particles = [], raf;

    // Preload SVG images
    let svgImgs = [];
    Promise.all(SVG_LOGOS.map(src => new Promise(res => {
      const img = new Image();
      img.onload = img.onerror = () => res(img);
      img.src = src;
    }))).then(imgs => { svgImgs = imgs; });

    // Deterministic hash
    const hash = (col, row) => {
      let h = (col * 2654435761 ^ row * 2246822519) >>> 0;
      h ^= h >>> 16; h = Math.imul(h, 0x45d9f3b); h ^= h >>> 16;
      return (h >>> 0) / 0xFFFFFFFF;
    };

    const init = () => {
      particles = [];
      const reach   = mobile ? Math.min(W, H) * 0.50 : H * 0.67;
      const cols    = Math.ceil(reach / CELL);
      const rows    = Math.ceil(reach / CELL);
      const maxDist = Math.sqrt(cols*cols + rows*rows);

      ['tl','br'].forEach(corner => {
        for (let ci = 0; ci < cols; ci++) {
          for (let ri = 0; ri < rows; ri++) {
            const dist    = Math.sqrt(ci*ci + ri*ri);
            const invDist = (maxDist - dist) / maxDist;
            const prob    = Math.min(Math.pow(invDist, mobile ? 2.2 : 1.6) * (mobile ? 1.2 : 1.6), 1);
            const h1 = hash(ci + (corner==='br'?1000:0), ri + (corner==='br'?1000:0));
            if (h1 > prob) continue;

            const totalCols = Math.floor(W / CELL);
            const totalRows = Math.floor(H / CELL);
            const hcol = corner==='tl' ? ci : totalCols - ci;
            const hrow = corner==='tl' ? ri : totalRows - ri;

            const h2 = hash(ci + (corner==='br'?2000:500), ri + (corner==='br'?2000:500));
            const isSvg = h2 < (corner==='tl' ? 0.38 : 0.18);
            const svgIdx = isSvg
              ? Math.floor(hash(ci + (corner==='br'?5000:3000), ri + (corner==='br'?5000:3000)) * SVG_LOGOS.length)
              : -1;

            // Random reveal threshold: spread staggered entry across 0→0.75 of scroll range
            const revealAt = hash(ci + (corner==='br'?6000:8000), ri + (corner==='br'?6000:8000)) * 0.95;

            particles.push({ hcol, hrow, col:hcol, row:hrow,
              cL:'#F5F3EE', cD:'#121010', isSvg, svgIdx, revealAt });
          }
        }
      });
    };

    const setSize = () => {
      W = canvas.offsetWidth; H = canvas.offsetHeight;
      if (!W || !H) return;
      canvas.width = W; canvas.height = H;
      init();
    };

    // ScrollTrigger: progress 0 when section enters bottom of viewport → 1 when section top hits top
    let st;
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
      const section = canvas.parentElement;
      st = ScrollTrigger.create({
        trigger: section,
        start: 'top bottom',
        end:   'top top',
        onUpdate: self => { scrollProgRef.current = self.progress; },
      });
    }

    const loop = () => {
      if (W && H) {
        const ctx      = canvas.getContext('2d');
        const isDark   = darkRef.current;
        const progress = scrollProgRef.current;
        ctx.clearRect(0, 0, W, H);
        for (const p of particles) {
          if (progress < p.revealAt) continue;
          const x = p.col * CELL, y = p.row * CELL;
          if (p.isSvg && svgImgs[p.svgIdx]?.complete) {
            ctx.drawImage(svgImgs[p.svgIdx], x, y, CELL, CELL);
          } else if (!p.isSvg) {
            ctx.fillStyle = isDark ? p.cD : p.cL;
            ctx.fillRect(x, y, CELL, CELL);
          }
        }
      }
      raf = requestAnimationFrame(loop);
    };

    const ro = new ResizeObserver(setSize);
    ro.observe(canvas);
    setSize();
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      if (st) st.kill();
    };
  }, []);

  return (
    <canvas ref={canvasRef} style={{
      position:'absolute', inset:0, width:'100%', height:'100%',
      pointerEvents:'none', zIndex:0,
    }}/>
  );
}

/* ═══════════════════════════════════════════════════
   DITHER CANVAS — hero background
═══════════════════════════════════════════════════ */
function DitherCanvas({ dark }) {
  const canvasRef     = useRef(null);
  const wrapRef       = useRef(null);
  const videoRef      = useRef(null);
  const darkRef   = useRef(dark);
  useEffect(()=>{ darkRef.current = dark; }, [dark]);

  useEffect(()=>{
    const canvas = canvasRef.current;
    const video  = videoRef.current;
    if (!canvas || !video) return;

    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d', { willReadFrequently:true });

    const PX=12;
    const BR=0.10, CT=2.4, GM=1.13;
    const LON=[237,234,229], LOFF=[245,243,238];
    const DON=[18,16,16],    DOFF=[0,0,0];
    const BAYER=[[0,2,0,2],[3,1,3,1],[0,2,0,2],[3,1,3,1]];

    let particles=[], cols=0, rows=0, raf;
    let outBuf=null, outImageData=null;
    let frameCount=0, cachedId=null;

    class P {
      constructor(col,row){
        this.col=col; this.row=row;
        this.x=(col+0.5)*PX; this.y=(row+0.5)*PX;
        this.r=255; this.g=255; this.b=255;
      }
      sample(id){
        const idx=(this.row*cols+this.col)*4;
        let lum=(0.299*id.data[idx]+0.587*id.data[idx+1]+0.114*id.data[idx+2])/255;
        lum=Math.pow(Math.max(0,lum),GM);
        lum=(lum-0.5)*CT+0.5;
        lum=Math.max(0,Math.min(1,lum+BR));
        const bl=darkRef.current?1-lum:lum;
        const thr=(BAYER[this.row&3][this.col&3]+0.5)/4;
        const ch=(bl<=thr)?(darkRef.current?DON:LON):(darkRef.current?DOFF:LOFF);
        this.r=ch[0]; this.g=ch[1]; this.b=ch[2];
      }
      paint(W){
        const gx=Math.floor(this.x/PX)*PX, gy=Math.floor(this.y/PX)*PX;
        const r=this.r, g=this.g, b=this.b;
        for(let dy=0;dy<PX;dy++){
          let base=((gy+dy)*W+gx)*4;
          for(let dx=0;dx<PX;dx++){
            outBuf[base]=r; outBuf[base+1]=g; outBuf[base+2]=b; outBuf[base+3]=255;
            base+=4;
          }
        }
      }
    }

    function build(){
      cols=Math.floor(canvas.width/PX);
      rows=Math.floor(canvas.height/PX);
      smpl.width=cols; smpl.height=rows;
      outBuf=new Uint8ClampedArray(canvas.width*canvas.height*4);
      outImageData=ctx.createImageData(canvas.width, canvas.height);
      particles=[];
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) particles.push(new P(c,r));
    }

    function setSize(){
      const vw=video.videoWidth||640, vh=video.videoHeight||360;
      canvas.width =Math.floor(vw*2/PX)*PX;
      canvas.height=Math.floor(vh*2/PX)*PX;
      canvas.style.width =canvas.width+'px';
      canvas.style.height=canvas.height+'px';
      build();
    }

    function loop(){
      raf=requestAnimationFrame(loop);
      frameCount++;
      if(!outBuf||video.readyState<2) return;

      // Re-sample video every 2 frames
      if(frameCount%4===0){
        sctx.drawImage(video,0,0,cols,rows);
        cachedId=sctx.getImageData(0,0,cols,rows);
      }
      if(!cachedId) return;

      outBuf.fill(0);
      const W=canvas.width;
      for(const p of particles){
        p.sample(cachedId);
        p.paint(W);
      }
      outImageData.data.set(outBuf);
      ctx.putImageData(outImageData, 0, 0);
    }

    video.addEventListener('loadedmetadata', setSize);
    setSize();

    // ── Intro animation: synchronous so centering applies before first paint ──
    {
      const wrap = wrapRef.current;
      if (wrap) {
        const cW = canvas.offsetWidth  || 1280;
        const cH = canvas.offsetHeight || 720;
        const initialScale = Math.min(196 / cW, 196 / cH);

        gsap.set(wrap, { xPercent:-50, yPercent:-50, y:128, scale:1 });
      }
    }

    video.play().catch(()=>{});
    loop();

    return ()=>{ cancelAnimationFrame(raf); };
  },[]);

  return (
    <>
      <video ref={videoRef} src="videos/thumbnail_02.mp4?v=3" autoPlay muted loop playsInline
        crossOrigin="anonymous"
        style={{position:'absolute',opacity:0,width:1,height:1,pointerEvents:'none'}}
      />
      {/* GSAP owns all transform/position on this wrapper */}
      <div ref={wrapRef} style={{position:'absolute',left:'50%',top:0,zIndex:0,pointerEvents:'none'}}>
        <canvas ref={canvasRef} style={{display:'block',opacity:0.9}}/>
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════
   MOBILE DITHER VIDEO
   Stripped-down version of DitherCanvas for mobile:
   same Bayer dithering, no particle physics, sized to
   fit within the hero viewport (overflow:hidden clips it).
═══════════════════════════════════════════════════ */
function MobileDitherVideo({ dark }) {
  const canvasRef = useRef(null);
  const wrapRef   = useRef(null);
  const videoRef  = useRef(null);
  const darkRef   = useRef(dark);
  useEffect(()=>{ darkRef.current = dark; }, [dark]);

  useEffect(()=>{
    const canvas = canvasRef.current;
    const video  = videoRef.current;
    const wrap   = wrapRef.current;
    if (!canvas || !video || !wrap) return;

    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d', { willReadFrequently: true });

    const PX    = 12;
    const BAYER = [[0,2,0,2],[3,1,3,1],[0,2,0,2],[3,1,3,1]];
    const GM=1.13, CT=2.4, BR=0.10;
    const LON=[237,234,229], LOFF=[245,243,238];
    const DON=[18,16,16],    DOFF=[0,0,0];

    let cols=0, rows=0, raf;
    let outBuf=null, outImageData=null;
    let frameCount=0, cachedId=null;

    function build() {
      cols = Math.floor(canvas.width  / PX);
      rows = Math.floor(canvas.height / PX);
      smpl.width = cols; smpl.height = rows;
      outBuf = new Uint8ClampedArray(canvas.width * canvas.height * 4);
      outImageData = ctx.createImageData(canvas.width, canvas.height);
    }

    function setSize() {
      const vw = video.videoWidth  || 640;
      const vh = video.videoHeight || 360;
      // Scale to fill viewport width on mobile — 2x for larger dither effect
      const s = (window.innerWidth / vw) * 2;
      canvas.width  = Math.floor(vw * s / PX) * PX;
      canvas.height = Math.floor(vh * s / PX) * PX;
      canvas.style.width  = canvas.width  + 'px';
      canvas.style.height = canvas.height + 'px';
      build();

      gsap.set(wrap, { xPercent:-50, yPercent:-50, x: window.innerWidth * 0.5, y: 128, scale: 1 });
    }

    function loop() {
      raf = requestAnimationFrame(loop);
      frameCount++;
      if (!outBuf || video.readyState < 2) return;

      if (frameCount % 4 === 0) {
        sctx.fillStyle = darkRef.current ? '#121010' : '#F5F3EE';
        sctx.fillRect(0, 0, cols, rows);
        sctx.drawImage(video, 0, 0, cols, rows);
        cachedId = sctx.getImageData(0, 0, cols, rows);
      }
      if (!cachedId) return;
      const id = cachedId;
      outBuf.fill(0);
      const W = canvas.width;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = (r * cols + c) * 4;
          let lum = (0.299*id.data[idx] + 0.587*id.data[idx+1] + 0.114*id.data[idx+2]) / 255;
          lum = Math.pow(Math.max(0, lum), GM);
          lum = (lum - 0.5) * CT + 0.5;
          lum = Math.max(0, Math.min(1, lum + BR));
          const bl  = darkRef.current ? 1 - lum : lum;
          const thr = (BAYER[r & 3][c & 3] + 0.5) / 4;
          const ch  = (bl <= thr) ? (darkRef.current ? DON : LON) : (darkRef.current ? DOFF : LOFF);
          for (let dy = 0; dy < PX; dy++) {
            let base = ((r * PX + dy) * W + c * PX) * 4;
            for (let dx = 0; dx < PX; dx++) {
              outBuf[base]=ch[0]; outBuf[base+1]=ch[1]; outBuf[base+2]=ch[2]; outBuf[base+3]=255;
              base += 4;
            }
          }
        }
      }
      outImageData.data.set(outBuf);
      ctx.putImageData(outImageData, 0, 0);
    }

    // Call setSize once metadata is available (real dimensions); fall back to direct call if already loaded
    if (video.videoWidth > 0) {
      setSize();
    } else {
      video.addEventListener('loadedmetadata', setSize, { once: true });
    }
    video.play().catch(()=>{});
    loop();

    return ()=>{
      cancelAnimationFrame(raf);
      video.removeEventListener('loadedmetadata', setSize, { once: true });
    };
  }, []);

  return (
    <>
      <video ref={videoRef} src="videos/thumbnail_02.mp4?v=3" autoPlay muted loop playsInline
        crossOrigin="anonymous"
        style={{ position:'absolute', opacity:0, width:1, height:1, pointerEvents:'none' }}
      />
      <div ref={wrapRef} style={{ position:'absolute', left:0, top:0, zIndex:0, pointerEvents:'none' }}>
        <canvas ref={canvasRef} style={{ display:'block', opacity:0.9 }} />
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════
   MENU PIXEL REVEAL
   Same diagonal canvas animation as work thumbnails.
   Always uses #121010 fill (dark-mode palette on both themes).
═══════════════════════════════════════════════════ */
function MenuGlitch({ onComplete, onMidpoint }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const H = window.innerHeight;
    const sliceH = window.innerWidth <= 768 ? 4 : 2;
    const total = Math.ceil(H / sliceH);
    const speed = 0.04, spread = 0.04, stagger = 0.00025, bellStrength = 0.1;

    // Same randomised strip order as the intro glitch
    const ordered = Array.from({length: total}, (_, i) => i).sort(() => Math.random() - 0.5);
    const stripData = ordered.map((sliceIdx, i) => {
      const duration = speed * (0.2 + Math.random() * 1.6);
      const t = sliceIdx / Math.max(total - 1, 1);
      const norm = t * 2 - 1;
      const bellDelay = Math.exp(-norm * norm * 3.5) * bellStrength;
      const delay = stagger * i + bellDelay + Math.random() * spread;
      return { sliceIdx, duration, delay };
    });
    const maxEnd = Math.max(...stripData.map(d => (d.delay + d.duration) * 1000));

    // Build strip divs — start translateX(100%) (off right), animate to translateX(0)
    const slices = [];
    for (let i = 0; i < total; i++) {
      const div = document.createElement('div');
      div.style.cssText = `position:absolute;left:0;width:100%;top:${i * sliceH}px;height:${sliceH}px;background:#121010;will-change:transform;transform:translateX(100%);`;
      el.appendChild(div);
      slices.push(div);
    }

    let midpointFired = false;
    const midTimer = setTimeout(() => { if (!midpointFired) { midpointFired = true; onMidpoint?.(); } }, maxEnd * 0.85);
    stripData.forEach(({ sliceIdx, duration, delay }) => {
      setTimeout(() => {
        slices[sliceIdx].style.transition = `transform ${duration.toFixed(3)}s linear`;
        slices[sliceIdx].style.transform = 'translateX(0)';
      }, delay * 1000);
    });
    const doneTimer = setTimeout(() => onComplete(), maxEnd + 100);
    return () => { clearTimeout(midTimer); clearTimeout(doneTimer); };
  }, []);

  return <div ref={ref} style={{position:"fixed",inset:0,zIndex:210,pointerEvents:"none",overflow:"hidden"}} />;
}

                  <span style={{fontFamily:"var(--sans)",fontSize:22,fontWeight:350,color:"var(--secondary)"}}>{w.title}</span>

                <a href="#" className="cta-btn" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"12px 16px",background:"var(--tech)",border:"none",borderRadius:0,fontFamily:"var(--sans)",fontSize:13,fontWeight:500,color:"#121010",textDecoration:"none",whiteSpace:"nowrap",flexShrink:0}}>

      <ContactSection dark={dark} isMobile={isMobile} setCtaOpen={setCtaOpen} />
      <SiteFooter dark={dark} isMobile={isMobile} onBackToTop={()=>{ window.scrollTo({top:0,behavior:"instant"}); }}/>
    </div>
  );
}
