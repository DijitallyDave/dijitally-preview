<script>
(function(){
  var isDark = localStorage.getItem('dijitally-theme') === 'dark';
  var C = {
    speed:0.3, spread:0.3, stagger:0.002,
    bellStrength:0.8, curveShape:'bell',
    sliceH:2, order:'random', direction:'right',
    easing:'linear', overlayColor: isDark ? '#F5F3EE' : '#1A1818'
  };
  window.__glitchDone = false;
  window.__onGlitchDone = null;
  window.__invertIntroLogo = null;
  window.__beginGlitchTransition = null;
  if (sessionStorage.getItem('skipIntro')) {
    window.__glitchDone = true;
    var _ov = document.getElementById('glitch-overlay');
    if (_ov) _ov.remove();
    var _il = document.getElementById('intro-logo-overlay');
    if (_il) _il.remove();
    return;
  }
  document.addEventListener('DOMContentLoaded', function() {
    var overlay = document.getElementById('glitch-overlay');
    if (!overlay) return;
    var H = window.innerHeight;
    var total = Math.ceil(H / C.sliceH);
    var slices = [];
    for (var i = 0; i < total; i++) {
      var el = document.createElement('div');
      el.style.cssText = 'position:absolute;left:0;width:100%;top:' + (i * C.sliceH) + 'px;height:' + C.sliceH + 'px;background:' + C.overlayColor + ';will-change:transform;';
      overlay.appendChild(el);
      slices.push(el);
    }
    var exitTransform = 'translateX(100%)';
    var indices = Array.from({length:total}, function(_,i){ return i; });
    var ordered = indices.slice().sort(function(){ return Math.random() - 0.5; });
    // Pre-calculate all strip timings
    var stripData = ordered.map(function(sliceIdx, i) {
      var variation = 0.2 + Math.random() * 1.6;
      var duration = C.speed * variation;
      var t = sliceIdx / Math.max(total - 1, 1);
      var norm = t * 2 - 1;
      var curveFactor = Math.exp(-norm * norm * 3.5);
      var bellDelay = curveFactor * C.bellStrength;
      var delay = (C.stagger * i) + bellDelay + (Math.random() * C.spread);
      return { sliceIdx: sliceIdx, duration: duration, delay: delay };
    });
    var maxEnd = 0;
    stripData.forEach(function(d) {
      var ms = (d.delay + d.duration) * 1000;
      if (ms > maxEnd) maxEnd = ms;
    });
    // Find when center of screen clears (for logo color inversion)
    var centerStripIdx = Math.round(total / 2);
    var centerMs = maxEnd / 2; // fallback
    for (var j = 0; j < stripData.length; j++) {
      if (stripData[j].sliceIdx === centerStripIdx) {
        centerMs = (stripData[j].delay + stripData[j].duration) * 1000;
        break;
      }
    }
    window.__beginGlitchTransition = function() {
      // Capture logo A's top offset once so mask rects use correct local coordinates
      var introEl = document.getElementById('intro-logo-overlay');
      var logoTop = introEl ? introEl.getBoundingClientRect().top : 0;
      var maskEl = document.getElementById('logo-a-mask');
      stripData.forEach(function(d) {
        (function(sl, sliceIdx, dur, del) {
          // Animate strip exit
          setTimeout(function() {
            sl.style.transition = 'transform ' + dur.toFixed(3) + 's ' + C.easing;
            sl.style.transform = exitTransform;
          }, del * 1000);
          // When strip finishes sliding away, mask Logo A at that Y band
          setTimeout(function() {
            if (!maskEl) return;
            var vy = sliceIdx * C.sliceH;
            var ly = vy - logoTop;
            var r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            r.setAttribute('x', '-99999');
            r.setAttribute('y', String(ly - 1));
            r.setAttribute('width', '199998');
            r.setAttribute('height', String(C.sliceH + 2));
            r.setAttribute('fill', 'black');
            maskEl.appendChild(r);
          }, (del + dur) * 1000);
        })(slices[d.sliceIdx], d.sliceIdx, d.duration, d.delay);
      });
      setTimeout(function() {
        overlay.remove();
        window.__glitchDone = true;
        if (window.__onGlitchDone) window.__onGlitchDone();
      }, maxEnd + 100);
    };
  });
})();
</script>

<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useRef } = React;

if (typeof gsap !== 'undefined') {
  if (typeof ScrollTrigger !== 'undefined') {
    gsap.registerPlugin(ScrollTrigger);
    // Prevent ScrollTrigger from refreshing (and snapping scroll) when iOS browser chrome hides/shows
    ScrollTrigger.config({
      ignoreMobileResize: true,
      // Prevent resize/orientationchange from triggering ScrollTrigger refresh
      // (iOS chrome show/hide fires these and causes scroll position jumps)
      autoRefreshEvents: "visibilitychange,DOMContentLoaded,load",
    });
  }
  if (typeof SplitText !== 'undefined') gsap.registerPlugin(SplitText);
  if (typeof ScrambleTextPlugin !== 'undefined') gsap.registerPlugin(ScrambleTextPlugin);
}

/* ── ASCII reveal — left to right, 9 randomisations per char, 2s total ── */
const SPECIAL = '!@#$%&|<>{}░▒▓×±§÷¶~^*_+=[]/?\\';

function useAsciiReveal(text, totalMs=2000, active=true) {
  const [state, setState] = useState({
    chars: Array.from(text).map(c => c===' ' ? ' ' : ' '),
    cursorIdx: 0,
    done: false,
  });

  useEffect(() => {
    const RAND = 6;
    const perChar = totalMs / text.length;
    const perFrame = perChar / (RAND + 1);
    const ts = [];

    for (let step = 0; step < text.length; step++) {
      const i = step; // left → right
      const base = step * perChar;

      if (text[i] === ' ') {
        ts.push(setTimeout(() =>
          setState(prev => {
            const chars = [...prev.chars]; chars[i] = ' ';
            return { chars, cursorIdx: i + 1, done: i === text.length - 1 };
          }), base));
      } else {
        for (let r = 0; r < RAND; r++) {
          ts.push(setTimeout(() =>
            setState(prev => {
              const chars = [...prev.chars];
              chars[i] = SPECIAL[Math.floor(Math.random() * SPECIAL.length)];
              return { chars, cursorIdx: i, done: false };
            }), base + r * perFrame));
        }
        ts.push(setTimeout(() =>
          setState(prev => {
            const chars = [...prev.chars]; chars[i] = text[i];
            return { chars, cursorIdx: i + 1, done: i === text.length - 1 };
          }), base + RAND * perFrame));
      }
    }
    return () => ts.forEach(clearTimeout);
    if (!active) return;
  }, [text, totalMs, active]);

  return state;
}

function AsciiReveal({ text, style, active=true, getColor=null }) {
  const { chars, cursorIdx, done } = useAsciiReveal(text, 2000, active);
  const isCursor = (i) => active && !done && i === cursorIdx;
  return (
    <span style={style}>
      {Array.from(text).map((_, i) => (
        <span key={i} style={{
          background: isCursor(i) ? 'var(--secondary)' : 'transparent',
          color: isCursor(i) ? 'var(--bg)' : getColor ? getColor(i) : 'inherit',
        }}>
          {chars[i]}
        </span>
      ))}
    </span>
  );
}

/* ── PixelRevealImg — digitising pixel reveal animation ── */
function PixelRevealImg({ src, alt, style = {}, externalTrigger = false, delay = 0 }) {
  const containerRef = useRef(null);
  const imgRef       = useRef(null);
  const revealRef    = useRef(null);  // reveal canvas
  const hoverRef     = useRef(null);  // hover pixel canvas
  const mouseRef     = useRef({ x: -9999, y: -9999 });
  const hoveredRef   = useRef(false);
  const hoverRafRef  = useRef(null);
  const [ready,  setReady]  = useState(false);
  const [inView, setInView] = useState(false);

  const PX = 16;

  // IntersectionObserver — skip if externalTrigger controls inView
  useEffect(() => {
    if (externalTrigger) return; // controlled externally
    const el = containerRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { threshold: 0.45 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [externalTrigger]);

  // Accept external trigger
  useEffect(() => {
    if (externalTrigger) setInView(true);
  }, [externalTrigger]);

  // ── Pixel reveal on load + in-view ──
  useEffect(() => {
    if (!ready || !inView) return;
    const img    = imgRef.current;
    const canvas = revealRef.current;
    if (!img || !canvas) return;
    const W = img.offsetWidth, H = img.offsetHeight;
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const BG = document.body.classList.contains('dark') ? '#121010' : '#1A1A1A';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    img.style.opacity = 1;
    const cols = Math.ceil(W / PX), rows = Math.ceil(H / PX);

    const blocks = [];
    for (let r = 0; r < rows; r++)
      for (let cl = 0; cl < cols; cl++)
        blocks.push({ r, c: cl, d: r + cl });
    blocks.sort((a, b) => (a.d + (Math.random()-0.5)*4) - (b.d + (Math.random()-0.5)*4));
    const total = blocks.length, DURATION = 600;
    const LEAD = 14; // number of blocks in the SVG frontier ahead of the clear wave
    let next = 0, start = null, raf;

    const drawFrontier = (from, to) => {
      for (let i = from; i < Math.min(to, total); i++) {
        const { r, c } = blocks[i];
        if (Math.random() > 0.25) {
          const p = PATTERN_IMGS[Math.floor(Math.random() * PATTERN_IMGS.length)];
          if (p.complete && p.naturalWidth > 0) {
            ctx.globalAlpha = 0.4 + Math.random() * 0.6;
            ctx.drawImage(p, c * PX, r * PX, PX, PX);
            ctx.globalAlpha = 1;
          }
        }
      }
    };

    const tick = (now) => {
      if (!start) start = now;
      const tp = Math.min((now - start) / DURATION, 1);
      const target = Math.floor(tp * total);
      // Clear blocks (also wipes previous frontier SVGs)
      const prevNext = next;
      while (next < target) { const { r, c } = blocks[next++]; ctx.clearRect(c * PX, r * PX, PX, PX); }
      // Draw new SVG frontier at the leading edge of the wave
      if (next < total) drawFrontier(next, next + LEAD);
      if (tp < 1) raf = requestAnimationFrame(tick);
      else canvas.style.display = 'none';
    };
    const t = setTimeout(() => { raf = requestAnimationFrame(tick); }, delay * 1000);
    return () => { clearTimeout(t); cancelAnimationFrame(raf); };
  }, [ready, inView]);

  // ── Hover: pixelation ramp 1→16 over 1s + zoom + cursor displacement ──
  useEffect(() => {
    if (!ready) return;
    const container = containerRef.current;
    const img    = imgRef.current;
    const canvas = hoverRef.current;
    if (!container || !img || !canvas) return;

    const W = img.offsetWidth, H = img.offsetHeight;
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;

    const ctx    = canvas.getContext('2d');
    const smpl   = document.createElement('canvas'); // off-screen sampler
    const sctx   = smpl.getContext('2d');
    const RAMP   = 1000; // ms — 1→16 ramp duration
    const MAX_PX = PX; // 16

    let enterTime = null, leaveTime = null;
    const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // ease in-out
    const mounted = { v: true };

    const loop = (now) => {
      if (!mounted.v) return;
      const isHov = hoveredRef.current;
      if (isHov && !enterTime) { enterTime = now; leaveTime = null; }
      if (!isHov && !leaveTime) { leaveTime = now; enterTime = null; }

      // Pixelation progress: ramp up on enter, ramp down on leave
      const rampUp   = enterTime ? Math.min((now - enterTime) / RAMP, 1) : 0;
      const rampDown = leaveTime ? Math.min((now - leaveTime) / (RAMP * 0.5), 1) : 0;
      const prog     = isHov ? ease(rampUp) : ease(1 - rampDown);

      if (!isHov && prog <= 0) {
        // Fully de-pixelated — stop
        ctx.clearRect(0, 0, W, H);
        img.style.transform = '';
        img.style.opacity = '1';
        hoverRafRef.current = null;
        return;
      }

      // Current pixel block size: 1 → 16
      const curPX  = Math.max(1, Math.round(1 + (MAX_PX - 1) * prog));
      // Zoom proportional to pixelation
      img.style.transform   = `scale(${1 + prog * 0.06})`;
      img.style.transition  = 'none';

      ctx.clearRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = false;

      // Step 1 — draw full pixelated image (fast)
      const cCols = Math.ceil(W / curPX), cRows = Math.ceil(H / curPX);
      smpl.width = cCols; smpl.height = cRows;
      sctx.drawImage(img, 0, 0, cCols, cRows);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(smpl, 0, 0, cCols, cRows, 0, 0, W, H);

      hoverRafRef.current = requestAnimationFrame(loop);
    };

    const onEnter = () => {
      hoveredRef.current = true;
      img.style.opacity = '0';
      if (!hoverRafRef.current) hoverRafRef.current = requestAnimationFrame(loop);
    };
    const onLeave = (e) => {
      // Keep effect active if cursor moved to a sibling inside the same .wc card (e.g. the CTA button)
      const card = container.closest('.wc');
      if (card && card.contains(e.relatedTarget)) return;
      hoveredRef.current = false; mouseRef.current = { x:-9999, y:-9999 };
    };
    const onMove  = e  => {
      const r = canvas.getBoundingClientRect();
      mouseRef.current = { x: e.clientX - r.left, y: e.clientY - r.top };
    };

    container.addEventListener('mouseenter', onEnter);
    container.addEventListener('mouseleave', onLeave);
    container.addEventListener('mousemove',  onMove);
    return () => {
      mounted.v = false;
      container.removeEventListener('mouseenter', onEnter);
      container.removeEventListener('mouseleave', onLeave);
      container.removeEventListener('mousemove',  onMove);
      cancelAnimationFrame(hoverRafRef.current);
    };
  }, [ready]);

  return (
    <div ref={containerRef} style={{ position: 'relative', lineHeight: 0, overflow: 'hidden', borderRadius: 4, background: '#1A1A1A', ...style }}>
      <img
        ref={imgRef}
        src={src}
        alt={alt}
        draggable={false}
        onDragStart={e=>e.preventDefault()}
        crossOrigin="anonymous"
        onLoad={() => setReady(true)}
        style={{ display: 'block', width: '100%', height: 'auto', opacity: 0 }}
      />
      <canvas ref={revealRef} style={{ position: 'absolute', top: 0, left: 0, pointerEvents: 'none' }} />
      <canvas ref={hoverRef}  style={{ position: 'absolute', top: 0, left: 0, pointerEvents: 'none' }} />
    </div>
  );
}

/* ── PixelResolveVideo — reverse hover effect: starts fully pixelated, resolves to clear ── */
function PixelResolveVideo({ src, videoRef: externalVideoRef, videoProps={}, style={}, externalTrigger=false }) {
  const containerRef     = useRef(null);
  const internalVideoRef = useRef(null);
  const canvasRef        = useRef(null);
  const rafRef           = useRef(null);
  const [ready, setReady] = useState(false);
  const PX   = 16;
  const RAMP = 1200;

  const setVideoRef = (el) => {
    internalVideoRef.current = el;
    if (typeof externalVideoRef === 'function') externalVideoRef(el);
    else if (externalVideoRef && 'current' in externalVideoRef) externalVideoRef.current = el;
  };

  const drawAt = (ctx, smpl, sctx, video, W, H, curPX) => {
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
    smpl.width  = Math.ceil(W / curPX);
    smpl.height = Math.ceil(H / curPX);

    // Replicate objectFit:cover — scale to fill, crop centre
    const vW = video.videoWidth  || W;
    const vH = video.videoHeight || H;
    const scale = Math.max(W / vW, H / vH);
    const dW = vW * scale, dH = vH * scale;
    const sx = (dW - W) / 2 / scale;   // source x in video coords
    const sy = (dH - H) / 2 / scale;   // source y in video coords
    const sw = W / scale;               // visible width  in video coords
    const sh = H / scale;               // visible height in video coords

    sctx.drawImage(video, sx, sy, sw, sh, 0, 0, smpl.width, smpl.height);
    ctx.drawImage(smpl, 0, 0, smpl.width, smpl.height, 0, 0, W, H);
  };

  const visibleRef = useRef(false);

  // WAITING loop — continuously sample video at full pixelation until trigger fires.
  // Runs whenever ready=true and externalTrigger=false.
  useEffect(() => {
    if (!ready || externalTrigger) return;
    cancelAnimationFrame(rafRef.current);
    const canvas = canvasRef.current;
    const video  = internalVideoRef.current;
    if (!canvas || !video) return;
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;
    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d');
    const loop = () => {
      drawAt(ctx, smpl, sctx, video, W, H, PX);
      rafRef.current = requestAnimationFrame(loop);
    };
    const startLoop = () => { cancelAnimationFrame(rafRef.current); rafRef.current = requestAnimationFrame(loop); };
    const stopLoop  = () => { cancelAnimationFrame(rafRef.current); };

    // Only run rAF when container is visible
    const obs = new IntersectionObserver(([entry]) => {
      visibleRef.current = entry.isIntersecting;
      if (entry.isIntersecting) {
        startLoop();
      } else {
        stopLoop();
      }
    }, { threshold: 0 });
    if (containerRef.current) obs.observe(containerRef.current);

    if (visibleRef.current) startLoop();

    return () => { stopLoop(); obs.disconnect(); };
  }, [ready, externalTrigger]);

  // RESOLVE animation — pixelate 16→1 using same technique as work-card hover.
  useEffect(() => {
    if (!externalTrigger || !ready) return;
    cancelAnimationFrame(rafRef.current);
    const canvas = canvasRef.current;
    const video  = internalVideoRef.current;
    if (!canvas || !video) return;
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;
    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d');
    const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    let start = null;
    const tick = (now) => {
      if (!start) start = now;
      const tp    = Math.min((now - start) / RAMP, 1);
      const prog  = ease(1 - tp);
      const curPX = Math.max(1, Math.round(1 + (PX - 1) * prog));
      drawAt(ctx, smpl, sctx, video, W, H, curPX);
      if (tp < 1) { rafRef.current = requestAnimationFrame(tick); }
      else        { ctx.clearRect(0, 0, W, H); } // transparent — NO display:none avoids size shift
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [externalTrigger, ready]);

  return (
    <div ref={containerRef} style={{ position:'relative', width:'100%', height:'100%', ...style }}>
      <video
        ref={setVideoRef}
        src={src}
        onCanPlay={() => setReady(true)}
        {...videoProps}
        style={{ display:'block', width:'100%', height:'100%', ...(videoProps.style||{}) }}
      />
      <canvas ref={canvasRef} style={{ position:'absolute', top:0, left:0, width:'100%', height:'100%', pointerEvents:'none' }} />
    </div>
  );
}

/* ── PixelResolveImg — same block-pixel resolve effect as PixelResolveVideo but for images ── */
function PixelResolveImg({ src, alt, style={}, delay=0 }) {
  const containerRef = useRef(null);
  const imgElRef     = useRef(null);
  const canvasRef    = useRef(null);
  const rafRef       = useRef(null);
  const timerRef     = useRef(null);
  const [ready, setReady]     = useState(false);
  const [inView, setInView]   = useState(false);
  const PX = 16, RAMP = 1200;

  // Fire ready even when image is already cached (onLoad missed)
  useEffect(() => {
    const img = imgElRef.current;
    if (!img) return;
    if (img.complete && img.naturalWidth) { setReady(true); return; }
    const handler = () => setReady(true);
    img.addEventListener('load', handler);
    return () => img.removeEventListener('load', handler);
  }, []);

  // Each thumbnail triggers itself when it enters the viewport
  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  const drawAt = (ctx, W, H, curPX) => {
    const img = imgElRef.current;
    if (!img || !img.complete || !img.naturalWidth) return;
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
    const smpl = document.createElement('canvas');
    smpl.width  = Math.max(1, Math.ceil(W / curPX));
    smpl.height = Math.max(1, Math.ceil(H / curPX));
    const sctx = smpl.getContext('2d');
    const vW = img.naturalWidth, vH = img.naturalHeight;
    const scale = Math.max(W / vW, H / vH);
    const sx = ((vW * scale - W) / 2) / scale;
    const sy = ((vH * scale - H) / 2) / scale;
    sctx.drawImage(img, sx, sy, W / scale, H / scale, 0, 0, smpl.width, smpl.height);
    ctx.drawImage(smpl, 0, 0, smpl.width, smpl.height, 0, 0, W, H);
  };

  const getDims = () => {
    const c = containerRef.current;
    return c ? { W: c.offsetWidth, H: c.offsetHeight } : { W: 0, H: 0 };
  };

  // Show fully pixelated while waiting for in-view
  useEffect(() => {
    if (!ready || inView) return;
    cancelAnimationFrame(rafRef.current);
    const canvas = canvasRef.current;
    if (!canvas) return;
    const { W, H } = getDims();
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    drawAt(ctx, W, H, PX);
  }, [ready, inView]);

  // Resolve 16→1 when in view
  useEffect(() => {
    if (!inView || !ready) return;
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => {
      cancelAnimationFrame(rafRef.current);
      const canvas = canvasRef.current;
      if (!canvas) return;
      const { W, H } = getDims();
      if (!W || !H) return;
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      let start = null;
      const tick = (now) => {
        if (!start) start = now;
        const tp    = Math.min((now - start) / RAMP, 1);
        const curPX = Math.max(1, Math.round(1 + (PX - 1) * ease(1 - tp)));
        drawAt(ctx, W, H, curPX);
        if (tp < 1) rafRef.current = requestAnimationFrame(tick);
        else        ctx.clearRect(0, 0, W, H);
      };
      rafRef.current = requestAnimationFrame(tick);
    }, delay * 1000);
    return () => { clearTimeout(timerRef.current); cancelAnimationFrame(rafRef.current); };
  }, [inView, ready]);

  return (
    <div ref={containerRef} style={{ position:'relative', width:'100%', height:'100%', ...style }}>
      <img
        ref={imgElRef}
        src={src}
        alt={alt||''}
        style={{ display:'block', width:'100%', height:'100%', objectFit:'cover' }}
      />
      <canvas ref={canvasRef} style={{ position:'absolute', top:0, left:0, width:'100%', height:'100%', pointerEvents:'none' }} />
    </div>
  );
}

/* ── InViewAscii — triggers AsciiReveal when element enters viewport ── */
function InViewAscii({ text, style, getColor=null }) {
  const [active, setActive] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setActive(true); obs.disconnect(); } },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <span ref={ref} style={{display:'contents'}}>
      <AsciiReveal text={text} style={style} active={active} getColor={getColor} />
    </span>
  );
}

/* ── Eyebrow label (JetBrains Mono 12px) ── */
function Eyebrow({children,style={},center=true}) {
  const ref = useRef(null);

  useEffect(()=>{
    const el = ref.current;
    if (!el || typeof gsap==='undefined' || typeof ScrambleTextPlugin==='undefined') return;
    const text = String(children||'');
    const obs = new IntersectionObserver(([e])=>{
      if (!e.isIntersecting) return;
      obs.disconnect();
      gsap.to(el, {
        duration: 1.5, ease:'none',
        scrambleText:{ text, chars:'upperCase', revealDelay:0.3, speed:0.6 },
      });
    },{ threshold:0.5 });
    obs.observe(el);
    return ()=> obs.disconnect();
  },[]);

  return (
    <span
      ref={ref}
      dangerouslySetInnerHTML={{__html: String(children||'')}}
      style={{fontFamily:"var(--mono)",fontSize:"var(--eyebrow)",fontWeight:400,lineHeight:"100%",letterSpacing:"var(--eyebrow-ls)",color:"var(--static)",textAlign:center?"center":"left",...style}}
    />
  );
}

/* ── ScrambleSpan — applies ScrambleText to any inline element on scroll-enter ── */
function ScrambleSpan({children, style={}, tag='span'}) {
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if (!el || typeof gsap==='undefined' || typeof ScrambleTextPlugin==='undefined') return;
    const text = String(children||'');

    // Scroll-enter scramble (one-shot)
    const obs = new IntersectionObserver(([e])=>{
      if (!e.isIntersecting) return;
      obs.disconnect();
      gsap.to(el, { duration:1.5, ease:'none',
        scrambleText:{ text, chars:'upperCase', revealDelay:0.3, speed:0.6 },
      });
    },{ threshold:0.5 });
    obs.observe(el);

    // Hover scramble — lock width first so layout never shifts
    const lockAndScramble = () => {
      el.style.display    = 'inline-block';
      el.style.whiteSpace = 'nowrap';
      if (!el.style.width) el.style.width = el.offsetWidth + 'px';
      el.style.overflow   = 'hidden';
      gsap.to(el, { duration:0.5, ease:'none',
        scrambleText:{ text, chars:'upperCase', revealDelay:0.1, speed:0.8 },
      });
    };
    el.addEventListener('mouseenter', lockAndScramble);

    return ()=>{ obs.disconnect(); el.removeEventListener('mouseenter', lockAndScramble); };
  },[]);
  const Tag = tag;
  return React.createElement(Tag, {
    ref,
    dangerouslySetInnerHTML:{__html: String(children||'')},
    style,
  });
}

function BackToTopButton({ dark, smootherRef }) {
  const [hov, setHov] = React.useState(false);
  const bg    = hov ? (dark ? "#F5F3EE" : "#1A1818") : "var(--tech)";
  const color = hov ? (dark ? "#121010" : "#F5F3EE") : "#121010";
  const dot   = hov ? (dark ? "#121010" : "#F5F3EE") : "var(--static)";
  return (
    <button
      onClick={()=>{ if(smootherRef.current) smootherRef.current.scrollTo(0,true); else window.scrollTo({top:0,behavior:"smooth"}); }}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        display:"flex", alignItems:"center", justifyContent:"center", gap:6,
        width:"100%", height:42,
        background:bg, border:"none", cursor:"pointer",
        padding:0, margin:0, flexShrink:0,
      }}
    >
      <span style={{width:3,height:3,borderRadius:"50%",background:dot,flexShrink:0,display:"block",transition:"background 0.2s ease"}}/>
      <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"-0.24px",color,lineHeight:1}}>BACK TO TOP</ScrambleSpan>
    </button>
  );
}

/* ── ContactPixels — grid-aligned corner pixel clusters matching Figma design ── */
const SVG_LOGOS = [
  'svgs/pattern_01.svg',
  'svgs/pattern_02.svg',
  'svgs/pattern_03.svg',
];
// Preloaded at module level — shared by PixelRevealImg and ContactPixels
const PATTERN_IMGS = SVG_LOGOS.map(src => {
  const img = new Image(); img.src = src; return img;
});

function ContactPixels({ dark, mobile }) {
  const canvasRef     = useRef(null);
  const darkRef       = useRef(dark);
  const scrollProgRef = useRef(0);

  useEffect(()=>{ darkRef.current = dark; }, [dark]);

  useEffect(()=>{
    const canvas = canvasRef.current;
    if (!canvas) return;

    const CELL = mobile ? Math.round(32 * 0.66) : 32;

    let W = 0, H = 0, particles = [], raf;

    // Preload SVG images
    let svgImgs = [];
    Promise.all(SVG_LOGOS.map(src => new Promise(res => {
      const img = new Image();
      img.onload = img.onerror = () => res(img);
      img.src = src;
    }))).then(imgs => { svgImgs = imgs; });

    // Deterministic hash
    const hash = (col, row) => {
      let h = (col * 2654435761 ^ row * 2246822519) >>> 0;
      h ^= h >>> 16; h = Math.imul(h, 0x45d9f3b); h ^= h >>> 16;
      return (h >>> 0) / 0xFFFFFFFF;
    };

    const init = () => {
      particles = [];
      const reach   = mobile ? Math.min(W, H) * 0.50 : H * 0.67;
      const cols    = Math.ceil(reach / CELL);
      const rows    = Math.ceil(reach / CELL);
      const maxDist = Math.sqrt(cols*cols + rows*rows);

      ['tl','br'].forEach(corner => {
        for (let ci = 0; ci < cols; ci++) {
          for (let ri = 0; ri < rows; ri++) {
            const dist    = Math.sqrt(ci*ci + ri*ri);
            const invDist = (maxDist - dist) / maxDist;
            const prob    = Math.min(Math.pow(invDist, mobile ? 2.2 : 1.6) * (mobile ? 1.2 : 1.6), 1);
            const h1 = hash(ci + (corner==='br'?1000:0), ri + (corner==='br'?1000:0));
            if (h1 > prob) continue;

            const totalCols = Math.floor(W / CELL);
            const totalRows = Math.floor(H / CELL);
            const hcol = corner==='tl' ? ci : totalCols - ci;
            const hrow = corner==='tl' ? ri : totalRows - ri;

            const h2 = hash(ci + (corner==='br'?2000:500), ri + (corner==='br'?2000:500));
            const isSvg = h2 < (corner==='tl' ? 0.38 : 0.18);
            const svgIdx = isSvg
              ? Math.floor(hash(ci + (corner==='br'?5000:3000), ri + (corner==='br'?5000:3000)) * SVG_LOGOS.length)
              : -1;

            // Random reveal threshold: spread staggered entry across 0→0.75 of scroll range
            const revealAt = hash(ci + (corner==='br'?6000:8000), ri + (corner==='br'?6000:8000)) * 0.95;

            particles.push({ hcol, hrow, col:hcol, row:hrow,
              cL:'#F5F3EE', cD:'#121010', isSvg, svgIdx, revealAt });
          }
        }
      });
    };

    const setSize = () => {
      W = canvas.offsetWidth; H = canvas.offsetHeight;
      if (!W || !H) return;
      canvas.width = W; canvas.height = H;
      init();
    };

    // ScrollTrigger: progress 0 when section enters bottom of viewport → 1 when section top hits top
    let st;
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
      const section = canvas.parentElement;
      st = ScrollTrigger.create({
        trigger: section,
        start: 'top bottom',
        end:   'top top',
        onUpdate: self => { scrollProgRef.current = self.progress; },
      });
    }

    const loop = () => {
      if (W && H) {
        const ctx      = canvas.getContext('2d');
        const isDark   = darkRef.current;
        const progress = scrollProgRef.current;
        ctx.clearRect(0, 0, W, H);
        for (const p of particles) {
          if (progress < p.revealAt) continue;
          const x = p.col * CELL, y = p.row * CELL;
          if (p.isSvg && svgImgs[p.svgIdx]?.complete) {
            ctx.drawImage(svgImgs[p.svgIdx], x, y, CELL, CELL);
          } else if (!p.isSvg) {
            ctx.fillStyle = isDark ? p.cD : p.cL;
            ctx.fillRect(x, y, CELL, CELL);
          }
        }
      }
      raf = requestAnimationFrame(loop);
    };

    const ro = new ResizeObserver(setSize);
    ro.observe(canvas);
    setSize();
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      if (st) st.kill();
    };
  }, []);

  return (
    <canvas ref={canvasRef} style={{
      position:'absolute', inset:0, width:'100%', height:'100%',
      pointerEvents:'none', zIndex:0,
    }}/>
  );
}

/* ═══════════════════════════════════════════════════
   DITHER CANVAS — hero background
═══════════════════════════════════════════════════ */
function DitherCanvas({ dark }) {
  const canvasRef     = useRef(null);
  const wrapRef       = useRef(null);
  const videoRef      = useRef(null);
  const darkRef   = useRef(dark);
  useEffect(()=>{ darkRef.current = dark; }, [dark]);

  useEffect(()=>{
    const canvas = canvasRef.current;
    const video  = videoRef.current;
    if (!canvas || !video) return;

    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d', { willReadFrequently:true });

    const PX=8, RADIUS=300, FORCE=6, WOBBLE=5, SPRING=0.06, DAMP=0.5;
    const BR=0.10, CT=2.4, GM=1.13;
    const LON=[237,234,229], LOFF=[245,243,238];
    const DON=[18,16,16],    DOFF=[0,0,0];
    const BAYER=[[0,2,0,2],[3,1,3,1],[0,2,0,2],[3,1,3,1]];
    const R2=RADIUS*RADIUS, IDLE_V=0.3, IDLE_D=(RADIUS+PX*2)**2;

    let particles=[], cols=0, rows=0, time=0, raf;
    let outBuf=null;
    let outImageData=null;
    let frameCount=0, cachedId=null;
    const mouse={ x:-9999, y:-9999 };

    class P {
      constructor(col,row){
        this.col=col; this.row=row;
        this.hx=(col+0.5)*PX; this.hy=(row+0.5)*PX;
        this.x=this.hx; this.y=this.hy;
        this.vx=0; this.vy=0;
        this.phase=Math.random()*Math.PI*2;
        this.r=255; this.g=255; this.b=255;
      }
      sample(id){
        const idx=(this.row*cols+this.col)*4;
        let lum=(0.299*id.data[idx]+0.587*id.data[idx+1]+0.114*id.data[idx+2])/255;
        lum=Math.pow(Math.max(0,lum),GM);
        lum=(lum-0.5)*CT+0.5;
        lum=Math.max(0,Math.min(1,lum+BR));
        const bl=darkRef.current?1-lum:lum;
        const thr=(BAYER[this.row&3][this.col&3]+0.5)/4;
        const ch=(bl<=thr)?(darkRef.current?DON:LON):(darkRef.current?DOFF:LOFF);
        this.r=ch[0]; this.g=ch[1]; this.b=ch[2];
      }
      update(){
        const dx=this.x-mouse.x, dy=this.y-mouse.y;
        const d2=dx*dx+dy*dy;
        if(d2>IDLE_D && Math.abs(this.vx)<IDLE_V && Math.abs(this.vy)<IDLE_V){
          this.x=this.hx; this.y=this.hy; this.vx=0; this.vy=0; return;
        }
        if(d2<R2&&d2>0.01){
          const d=Math.sqrt(d2), prx=1-d/RADIUS;
          this.vx+=(dx/d)*prx*FORCE;
          this.vy+=(dy/d)*prx*FORCE;
          const w=prx*prx*WOBBLE;
          this.vx+=Math.cos(time+this.phase)*w;
          this.vy+=Math.sin(time+this.phase*1.3)*w;
        }
        this.vx+=(this.hx-this.x)*SPRING;
        this.vy+=(this.hy-this.y)*SPRING;
        this.vx*=DAMP; this.vy*=DAMP;
        this.x+=this.vx; this.y+=this.vy;
      }
      paint(W){
        const gx=Math.floor(this.x/PX)*PX, gy=Math.floor(this.y/PX)*PX;
        const r=this.r, g=this.g, b=this.b;
        for(let dy=0;dy<PX;dy++){
          let base=((gy+dy)*W+gx)*4;
          for(let dx=0;dx<PX;dx++){
            outBuf[base]=r; outBuf[base+1]=g; outBuf[base+2]=b; outBuf[base+3]=255;
            base+=4;
          }
        }
      }
    }

    function build(){
      cols=Math.floor(canvas.width/PX);
      rows=Math.floor(canvas.height/PX);
      smpl.width=cols; smpl.height=rows;
      outBuf=new Uint8ClampedArray(canvas.width*canvas.height*4);
      outImageData=ctx.createImageData(canvas.width, canvas.height);
      particles=[];
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) particles.push(new P(c,r));
    }

    function setSize(){
      const vw=video.videoWidth||640, vh=video.videoHeight||360;
      canvas.width =Math.floor(vw*2/PX)*PX;
      canvas.height=Math.floor(vh*2/PX)*PX;
      canvas.style.width =canvas.width+'px';
      canvas.style.height=canvas.height+'px';
      build();
    }

    function loop(){
      raf=requestAnimationFrame(loop);
      time+=0.06; frameCount++;
      if(!outBuf||video.readyState<2) return;

      // Re-sample video every 2 frames
      if(frameCount%2===0){
        sctx.drawImage(video,0,0,cols,rows);
        cachedId=sctx.getImageData(0,0,cols,rows);
      }
      if(!cachedId) return;

      // Fill background with off-colour
      const bg=darkRef.current?DOFF:LOFF;
      outBuf.fill(0);
      const W=canvas.width;

      for(const p of particles){
        p.sample(cachedId);
        p.update();
        p.paint(W);
      }
      // Single putImageData instead of thousands of fillRect calls
      outImageData.data.set(outBuf);
      ctx.putImageData(outImageData, 0, 0);
    }

    const onMove = e=>{
      const r=canvas.getBoundingClientRect();
      const x=e.clientX-r.left, y=e.clientY-r.top;
      const over=document.elementFromPoint(e.clientX,e.clientY);
      const inNav=over&&over.closest('header');
      if(!inNav && x>=0 && x<=r.width && y>=0 && y<=r.height){ mouse.x=x; mouse.y=y; }
      else { mouse.x=-9999; mouse.y=-9999; }
    };
    window.addEventListener('mousemove', onMove, {passive:true});
    video.addEventListener('loadedmetadata', setSize);
    setSize();

    // ── Intro animation: synchronous so centering applies before first paint ──
    {
      const wrap = wrapRef.current;
      if (wrap) {
        const cW = canvas.offsetWidth  || 1280;
        const cH = canvas.offsetHeight || 720;
        const initialScale = Math.min(196 / cW, 196 / cH);

        if (sessionStorage.getItem('skipIntro')) {
          // Returning visitor — show dither at full size immediately, hide counter
          gsap.set(wrap, { xPercent:-50, yPercent:-50, y:128, scale:1 });
          const counter = document.getElementById('preloader-counter');
          if (counter) counter.style.display = 'none';
        } else {
          gsap.set(wrap, { xPercent:-50, yPercent:-50, y:128, scale:1 });
          const counter = document.getElementById('preloader-counter');
          if (counter) counter.style.display = 'none';
        }
      }
    }

    video.play().catch(()=>{});
    loop();

    return ()=>{
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMove);
    };
  },[]);

  return (
    <>
      <video ref={videoRef} src="videos/thumbnail_02.mp4?v=3" autoPlay muted loop playsInline
        crossOrigin="anonymous"
        style={{position:'absolute',opacity:0,width:1,height:1,pointerEvents:'none'}}
      />
      {/* GSAP owns all transform/position on this wrapper */}
      <div ref={wrapRef} style={{position:'absolute',left:'50%',top:0,zIndex:0,pointerEvents:'none'}}>
        <canvas ref={canvasRef} style={{display:'block',opacity:0.9}}/>
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════
   MOBILE DITHER VIDEO
   Stripped-down version of DitherCanvas for mobile:
   same Bayer dithering, no particle physics, sized to
   fit within the hero viewport (overflow:hidden clips it).
═══════════════════════════════════════════════════ */
function MobileDitherVideo({ dark }) {
  const canvasRef = useRef(null);
  const wrapRef   = useRef(null);
  const videoRef  = useRef(null);
  const darkRef   = useRef(dark);
  useEffect(()=>{ darkRef.current = dark; }, [dark]);

  useEffect(()=>{
    const canvas = canvasRef.current;
    const video  = videoRef.current;
    const wrap   = wrapRef.current;
    if (!canvas || !video || !wrap) return;

    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d', { willReadFrequently: true });

    const PX    = 8;
    const BAYER = [[0,2,0,2],[3,1,3,1],[0,2,0,2],[3,1,3,1]];
    const GM=1.13, CT=2.4, BR=0.10;
    const LON=[237,234,229], LOFF=[245,243,238];
    const DON=[18,16,16],    DOFF=[0,0,0];

    let cols=0, rows=0, raf;
    let outBuf=null, outImageData=null;

    function build() {
      cols = Math.floor(canvas.width  / PX);
      rows = Math.floor(canvas.height / PX);
      smpl.width = cols; smpl.height = rows;
      outBuf = new Uint8ClampedArray(canvas.width * canvas.height * 4);
      outImageData = ctx.createImageData(canvas.width, canvas.height);
    }

    function setSize() {
      const vw = video.videoWidth  || 640;
      const vh = video.videoHeight || 360;
      // Scale to fill viewport width on mobile — 2x for larger dither effect
      const s = (window.innerWidth / vw) * 2;
      canvas.width  = Math.floor(vw * s / PX) * PX;
      canvas.height = Math.floor(vh * s / PX) * PX;
      canvas.style.width  = canvas.width  + 'px';
      canvas.style.height = canvas.height + 'px';
      build();

      gsap.set(wrap, { xPercent:-50, yPercent:-50, x: window.innerWidth * 0.5, y: 128, scale: 1 });
      const counter = document.getElementById('preloader-counter');
      if (counter) counter.style.display = 'none';
    }

    function loop() {
      raf = requestAnimationFrame(loop);
      if (!outBuf || video.readyState < 2) return;

      // Fill with solid background before compositing video — eliminates transparency checkerboard artifacts
      sctx.fillStyle = darkRef.current ? '#121010' : '#F5F3EE';
      sctx.fillRect(0, 0, cols, rows);
      sctx.drawImage(video, 0, 0, cols, rows);
      const id = sctx.getImageData(0, 0, cols, rows);
      outBuf.fill(0);
      const W = canvas.width;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = (r * cols + c) * 4;
          let lum = (0.299*id.data[idx] + 0.587*id.data[idx+1] + 0.114*id.data[idx+2]) / 255;
          lum = Math.pow(Math.max(0, lum), GM);
          lum = (lum - 0.5) * CT + 0.5;
          lum = Math.max(0, Math.min(1, lum + BR));
          const bl  = darkRef.current ? 1 - lum : lum;
          const thr = (BAYER[r & 3][c & 3] + 0.5) / 4;
          const ch  = (bl <= thr) ? (darkRef.current ? DON : LON) : (darkRef.current ? DOFF : LOFF);
          for (let dy = 0; dy < PX; dy++) {
            let base = ((r * PX + dy) * W + c * PX) * 4;
            for (let dx = 0; dx < PX; dx++) {
              outBuf[base]=ch[0]; outBuf[base+1]=ch[1]; outBuf[base+2]=ch[2]; outBuf[base+3]=255;
              base += 4;
            }
          }
        }
      }
      outImageData.data.set(outBuf);
      ctx.putImageData(outImageData, 0, 0);
    }

    // Call setSize once metadata is available (real dimensions); fall back to direct call if already loaded
    if (video.videoWidth > 0) {
      setSize();
    } else {
      video.addEventListener('loadedmetadata', setSize, { once: true });
    }
    video.play().catch(()=>{});
    loop();

    return ()=>{
      cancelAnimationFrame(raf);
      video.removeEventListener('loadedmetadata', setSize, { once: true });
    };
  }, []);

  return (
    <>
      <video ref={videoRef} src="videos/thumbnail_02.mp4?v=3" autoPlay muted loop playsInline
        crossOrigin="anonymous"
        style={{ position:'absolute', opacity:0, width:1, height:1, pointerEvents:'none' }}
      />
      <div ref={wrapRef} style={{ position:'absolute', left:0, top:0, zIndex:0, pointerEvents:'none' }}>
        <canvas ref={canvasRef} style={{ display:'block', opacity:0.9 }} />
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════
   MENU PIXEL REVEAL
   Same diagonal canvas animation as work thumbnails.
   Always uses #121010 fill (dark-mode palette on both themes).
═══════════════════════════════════════════════════ */
function MenuGlitch({ onComplete, onMidpoint }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const H = window.innerHeight;
    const sliceH = 2;
    const total = Math.ceil(H / sliceH);
    const speed = 0.15, spread = 0.15, stagger = 0.001, bellStrength = 0.4;

    // Same randomised strip order as the intro glitch
    const ordered = Array.from({length: total}, (_, i) => i).sort(() => Math.random() - 0.5);
    const stripData = ordered.map((sliceIdx, i) => {
      const duration = speed * (0.2 + Math.random() * 1.6);
      const t = sliceIdx / Math.max(total - 1, 1);
      const norm = t * 2 - 1;
      const bellDelay = Math.exp(-norm * norm * 3.5) * bellStrength;
      const delay = stagger * i + bellDelay + Math.random() * spread;
      return { sliceIdx, duration, delay };
    });
    const maxEnd = Math.max(...stripData.map(d => (d.delay + d.duration) * 1000));

    // Build strip divs — start translateX(100%) (off right), animate to translateX(0)
    const slices = [];
    for (let i = 0; i < total; i++) {
      const div = document.createElement('div');
      div.style.cssText = `position:absolute;left:0;width:100%;top:${i * sliceH}px;height:${sliceH}px;background:#121010;will-change:transform;transform:translateX(100%);`;
      el.appendChild(div);
      slices.push(div);
    }

    let midpointFired = false;
    const midTimer = setTimeout(() => { if (!midpointFired) { midpointFired = true; onMidpoint?.(); } }, maxEnd * 0.85);
    stripData.forEach(({ sliceIdx, duration, delay }) => {
      setTimeout(() => {
        slices[sliceIdx].style.transition = `transform ${duration.toFixed(3)}s linear`;
        slices[sliceIdx].style.transform = 'translateX(0)';
      }, delay * 1000);
    });
    const doneTimer = setTimeout(() => onComplete(), maxEnd + 100);
    return () => { clearTimeout(midTimer); clearTimeout(doneTimer); };
  }, []);

  return <div ref={ref} style={{position:"fixed",inset:0,zIndex:210,pointerEvents:"none",overflow:"hidden"}} />;
}

function Page() {
  const [dark,        setDark]        = useState(()=> localStorage.getItem("dijitally-theme") === "dark");
  const [page,        setPage]        = useState('home');
  const [scrolled,    setScrolled]    = useState(false);
  const [isMobile,    setIsMobile]    = useState(()=> window.innerWidth <= 768);
  const scrollYRef    = useRef(0);
  const menuScrollRef = useRef(0);
  const scrolledRef   = useRef(false);
  const [activeModel, setActiveModel] = useState(0);
  const [hoverModel,  setHoverModel]  = useState(-1);
  const [activeFilter,setActiveFilter]= useState("ALL");
  const [email,       setEmail]       = useState("");
  const [reelOpen,    setReelOpen]    = useState(false);
  const [ctaOpen,     setCtaOpen]     = useState(false);
  const [menuOpen,    setMenuOpen]    = useState(false);
  const [menuReady,      setMenuReady]      = useState(false);
  const [menuItemsReady, setMenuItemsReady] = useState(false);
  const menuContentRef = useRef(null);
  const [thumbHover,  setThumbHover]  = useState(false);

  const CTA_W = isMobile ? window.innerWidth : 661;

  // Slide #smooth-wrapper left and animate CTA panel in/out
  useEffect(()=>{
    const wrapper = document.getElementById("smooth-wrapper");
    const panel   = document.getElementById("cta-panel");
    const overlay = document.getElementById("cta-overlay");
    if (!wrapper || !panel || !overlay) return;
    const cursor  = document.getElementById("dj-cursor");
    const heading = document.getElementById("cta-heading");
    const slideTarget = isMobile ? document.getElementById("smooth-content") || wrapper : wrapper;
    if (ctaOpen) {
      gsap.to(slideTarget, { x: -CTA_W, duration: 0.7, ease: "power3.inOut" });
      panel.classList.add("open");
      overlay.classList.add("open");
      wrapper.classList.add("cta-open");
      if (cursor) cursor.classList.add("cta-open");

      // SplitText on the heading — animate lines up after panel slides in
      if (heading && typeof SplitText !== "undefined") {
        // Revert any previous split so the DOM is clean
        heading._ctaSplit && heading._ctaSplit.revert();
        const split = new SplitText(heading, { type:"lines", linesClass:"split-line" });
        heading._ctaSplit = split;
        split.lines.forEach(line => {
          const wrap = document.createElement("div");
          wrap.style.overflow = "hidden";
          wrap.style.display = "block";
          line.parentNode.insertBefore(wrap, line);
          wrap.appendChild(line);
        });
        gsap.from(split.lines, {
          y: "110%",
          duration: 0.75,
          ease: "power3.out",
          stagger: 0.08,
          delay: 0.35,
        });
      }
    } else {
      gsap.to(slideTarget, { x: 0, duration: 0.7, ease: "power3.inOut" });
      panel.classList.remove("open");
      overlay.classList.remove("open");
      wrapper.classList.remove("cta-open");
      if (cursor) cursor.classList.remove("cta-open");
    }
  }, [ctaOpen]);

  // Menu Lottie — load after pixel reveal completes (menuReady), not on open
  useEffect(()=>{
    if (!menuReady || typeof lottie === "undefined") return;
    const el = menuLogoRef.current;
    if (!el || el._menuAnim) return;
    el._menuAnim = lottie.loadAnimation({
      container: el,
      renderer: "svg",
      loop: false,
      autoplay: true,
      path: "json/Dijitally-Logo.json",
      rendererSettings: { preserveAspectRatio:"xMidYMid meet" },
    });
    return () => {
      if (el._menuAnim) { el._menuAnim.destroy(); el._menuAnim = null; }
    };
  }, [menuReady]);

  // Mobile menu open/close — lock body scroll and pointer events while open
  useLayoutEffect(()=>{
    if (!isMobile) return;
    const wrapper = document.getElementById("smooth-wrapper");
    const cursor  = document.getElementById("dj-cursor");
    if (menuOpen) {
      // Lock scroll: use position saved before setState to avoid timing gap
      const scrollY = menuScrollRef.current;
      document.body.style.position   = 'fixed';
      document.body.style.top        = `-${scrollY}px`;
      document.body.style.left       = '0';
      document.body.style.right      = '0';
      document.body.style.overflowY  = 'scroll'; // keep scrollbar width stable
      wrapper?.classList.add("cta-open");
      if (cursor) cursor.classList.add("cta-open");

                  <div style={{position:"relative",width:"100%",paddingBottom:"64.58%",overflow:"hidden",borderRadius:4,background:w.img?(dark?"#121010":"#1A1A1A"):w.bg}}>
                    <div style={{position:"absolute",top:0,left:0,width:"100%",height:"100%"}}>
                      {w.img && <PixelResolveImg src={w.img} alt={w.title} delay={i*0.1}/>}
                      {cardCta('View project')}
                    </div>
                  </div>
                  {cardMeta(w, true)}
                </div>
              ))}
            </div>
          );
          return (
            <div style={{width:"100%",paddingLeft:"var(--s64)",paddingRight:"var(--s64)",display:"flex",flexDirection:"column",gap:0,alignItems:"center"}}>
              {/* Row 1: large left + small right offset down */}
              <div style={{display:"flex",gap:128,alignItems:"flex-start"}}>
                {filtered[0] && (
                  <div className="wc" style={{width:720,flexShrink:0}}>
                    <div className="work-grid-thumb" style={{height:465,background:filtered[0].img?(dark?"#121010":"#1A1A1A"):filtered[0].bg}}>
                      {filtered[0].img && <PixelResolveImg src={filtered[0].img} alt={filtered[0].title} delay={0}/>}
                      {cardCta('View project')}
                    </div>
                    {cardMeta(filtered[0])}
                  </div>
                )}
                {filtered[1] && (
                  <div className="wc" style={{width:378,flexShrink:0,paddingTop:252}}>
                    <div className="work-grid-thumb" style={{height:378,background:filtered[1].img?(dark?"#121010":"#1A1A1A"):filtered[1].bg}}>
                      {filtered[1].img && <PixelResolveImg src={filtered[1].img} alt={filtered[1].title} delay={0.2}/>}
                      {cardCta('View project')}
                    </div>
                    {cardMeta(filtered[1])}
                  </div>
                )}
              </div>
              {/* Row 2: small left + large right offset down */}
              <div style={{display:"flex",gap:128,alignItems:"flex-start",paddingBottom:96}}>
                {filtered[2] && (
                  <div className="wc" style={{width:378,flexShrink:0,paddingBottom:320}}>
                    <div className="work-grid-thumb" style={{height:378,background:filtered[2].img?(dark?"#121010":"#1A1A1A"):filtered[2].bg}}>
                      {filtered[2].img && <PixelResolveImg src={filtered[2].img} alt={filtered[2].title} delay={0.1}/>}
                      {cardCta('View project')}
                    </div>
                    {cardMeta(filtered[2])}
                  </div>
                )}
                {filtered[3] && (
                  <div className="wc" style={{width:720,flexShrink:0,paddingTop:252}}>
                    <div className="work-grid-thumb" style={{height:465,background:filtered[3].img?(dark?"#121010":"#1A1A1A"):filtered[3].bg}}>
                      {filtered[3].img && <PixelResolveImg src={filtered[3].img} alt={filtered[3].title} delay={0.3}/>}
                      {cardCta('View project')}
                    </div>
                    {cardMeta(filtered[3])}
                  </div>
                )}
              </div>
            </div>
          );
        })()}

        {/* View all CTA — below thumbnails, centred */}
        <div style={{width:"100%",display:"flex",justifyContent:"center",paddingTop:isMobile?24:0,paddingBottom:256,paddingLeft:"var(--s42)",paddingRight:"var(--s42)"}}>
          <a href="#work" className="cta-btn" style={{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:10,padding:"18px 24px",background:"var(--tech)",border:"none",borderRadius:0,fontFamily:"var(--sans)",fontSize:16,fontWeight:500,letterSpacing:0,color:"#121010",textDecoration:"none",whiteSpace:"nowrap"}}>
            <span style={{display:"inline-block",width:4,height:4,background:"currentColor",flexShrink:0}}/><span className="cta-text">View all our work</span>
          </a>
        </div>

      </section>

      {/* ══════════════════════════════════════
          CONTACT SECTION — padding: 96px 64px, bg #DEDEDE, gap 24px
      ══════════════════════════════════════ */}
      <section ref={contactSectionRef} style={{
        ...divider,
        background: dark ? "#1A1A1A" : "#EDEAE5",
        padding: isMobile ? "48px 16px" : "var(--s96) var(--s64)",
        minHeight: isMobile ? (contactHeight ? `${contactHeight}px` : "66svh") : "auto",
        display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center", gap:"var(--s24)",
        position:"relative", overflow:"hidden",
      }}>
        {/* Corner pixel effects — interactive, light/dark-aware */}
        <ContactPixels dark={dark} mobile={isMobile} />

        {/* Inner contact card — 720×409px, bg #F5F3EE, br 4px */}
        <div ref={contactCardRef} className="contact-card-inner" style={{
          background: dark ? "#121010" : "var(--primary)",
          borderRadius:4,
          width: isMobile ? "calc(100% - 32px)" : 736,
          height: isMobile ? (contactCardHeight ? contactCardHeight : "auto") : 416,
          position:"relative",
          zIndex:1,
          display:"flex", alignItems:"center", justifyContent:"center",
          paddingLeft: isMobile ? 24 : "var(--s64)",
          paddingRight: isMobile ? 24 : "var(--s64)",
          paddingTop: isMobile ? 32 : 0,
          paddingBottom: isMobile ? 32 : 0,
          overflow:"hidden",
          flexShrink:0,
        }}>
          {/* Form — centred */}
          <div style={{width:"100%",display:"flex",flexDirection:"column",gap:"var(--s24)",alignItems:"center",textAlign:"center"}}>
            <Eyebrow center={false} style={{letterSpacing:"0.08em"}}>LET'S CHAT</Eyebrow>

            {/* Heading always full width; input+button row below on mobile, inline on desktop */}
            <div role="heading" aria-level="2" style={{fontFamily:"var(--sans)",fontSize:"var(--h2)",fontWeight:350,lineHeight:"var(--h2-lh)",letterSpacing:"var(--h2-ls)",color:"var(--secondary)"}}>
              Looking for an ally<br/>on your next project?
            </div>
            <div style={{display:"flex",gap:12,alignItems:"stretch",flexDirection: isMobile ? "column" : "row"}}>
              <input
                type="email" placeholder="Your contact email"
                value={email} onChange={e=>setEmail(e.target.value)}
                style={{
                  width:240,flexShrink:0,padding:"18px 14px",fontFamily:"var(--sans)",fontSize:16,fontWeight:500,
                  border:"1px solid var(--grey)",outline:"none",
                  background:"var(--bg)",color:"#878787",
                  boxSizing:"border-box",
                }}
              />
              <button className="cta-btn" style={{
                display:"inline-flex",alignItems:"center",justifyContent:"center",gap:10,
                padding:"18px 24px",
                background:"var(--tech)",
                border:"none",borderRadius:0,
                fontFamily:"var(--sans)",fontSize:16,fontWeight:500,letterSpacing:0,
                color:"#121010",
                cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,
              }}>
                <span style={{display:"inline-block",width:4,height:4,background:"currentColor",flexShrink:0}}/>
                <span className="cta-text">Submit</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      {/* ══════════════════════════════════════
          FOOTER — flex column, align-items flex-end, 447px
      ══════════════════════════════════════ */}
      <footer style={{
        ...divider,
        minHeight: "auto",
        padding: isMobile ? "64px 24px 24px" : "var(--s64) var(--s64) 0",
        display:"flex", flexDirection:"column", alignItems: isMobile ? "flex-start" : "flex-end",
        gap: isMobile ? 24 : 0,
        background:"var(--bg)",
      }}>
        {/* Mobile Row 1 — nav links spread + LinkedIn icon right | Desktop Row 1 — nav links + Privacy Policy */}
        {isMobile ? (
          <div style={{width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between"}}>
            {["WORK","SERVICES","ABOUT","BLOG"].map(l=>(
              <span key={l} style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
                <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)",}}>{l}</ScrambleSpan>
              </span>
            ))}
            <a href="#" aria-label="LinkedIn" style={{display:"flex",alignItems:"center",justifyContent:"center",width:24,height:24,flexShrink:0}}>
              <img src="dijitally-footer.svg" alt="LinkedIn" style={{width:24,height:24,display:"block"}}/>
            </a>
          </div>
        ) : (
          <div className="footer-row" style={{width:"100%", paddingTop:"var(--s32)", display:"flex", alignItems:"center", justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:"var(--s12)",flexWrap:"wrap"}}>
              {["WORK","SERVICES","ABOUT","BLOG"].map(l=>(
                <span key={l} style={{display:"flex",alignItems:"center",gap:"var(--s12)"}}>
                  <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
                  <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)",}}>{l}</ScrambleSpan>
                </span>
              ))}
            </div>
            <span style={{display:"flex",alignItems:"center",gap:"var(--s12)"}}>
              <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
              <a href="#" style={{textDecoration:"none"}}>
                <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)",}}>PRIVACY POLICY</ScrambleSpan>
              </a>
            </span>
          </div>
        )}

        {/* Mobile Row 2 — Privacy Policy left, Terms + Conditions right | Desktop Row 2 — LinkedIn + Terms */}
        {isMobile ? (
          <div style={{width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between"}}>
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
              <a href="#" style={{textDecoration:"none"}}>
                <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)",}}>PRIVACY POLICY</ScrambleSpan>
              </a>
            </span>
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
              <a href="#" style={{textDecoration:"none"}}>
                <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)",}}>TERMS + CONDITIONS</ScrambleSpan>
              </a>
            </span>
          </div>
        ) : (
          <div className="footer-row" style={{width:"100%", padding:"var(--s12) 0 var(--s32) 0", display:"flex", alignItems:"center", justifyContent:"space-between"}}>
            <a href="#" aria-label="LinkedIn" style={{display:"flex",alignItems:"center",justifyContent:"center",width:24,height:24,flexShrink:0}}>
              <img src="dijitally-footer.svg" alt="LinkedIn" style={{width:24,height:24,display:"block"}}/>
            </a>
            <span style={{display:"flex",alignItems:"center",gap:"var(--s12)"}}>
              <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
              <a href="#" style={{textDecoration:"none"}}>
                <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)",}}>TERMS + CONDITIONS</ScrambleSpan>
              </a>
            </span>
          </div>
        )}

        {/* Footer DIJITALLY™ logo — Lottie, plays once on enter */}
        <div ref={footerLogoRef} style={{width:"100%",overflow:"hidden",filter:dark?"url(#to-warm-white)":"none",transition:"filter 0.3s ease"}} />

      </footer>

      {/* Back to top — full-width bar, outside footer */}
      <div style={{height:64}}/>
      <BackToTopButton dark={dark} smootherRef={smootherRef}/>

      </>}

      {/* ══════════════════════════════════════
          REEL LIGHTBOX — portalled outside smooth-wrapper so position:fixed works
      ══════════════════════════════════════ */}
      {ReactDOM.createPortal(
        <div className={"lb " + (reelOpen?"open":"")} style={{
          position:"fixed",inset:0,zIndex:200,
          background:"rgba(18,16,16,0.75)",
          backdropFilter:"blur(24px)", WebkitBackdropFilter:"blur(24px)",
          display:"flex",alignItems:"center",justifyContent:"center",
        }} onClick={()=>setReelOpen(false)}>
          <div style={{position:"relative",width:"80vw",aspectRatio:"16/9",background:"#0a0a0a",borderRadius:4,overflow:"hidden"}} onClick={e=>e.stopPropagation()}>
            <video
              src="videos/thumbnail.mp4?v=2"
              autoPlay muted loop playsInline
              style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",display:"block"}}
            />
            {/* Close button — same X style as CTA panel */}
            <button onClick={()=>setReelOpen(false)} style={{
              position:"absolute",top:16,right:16,zIndex:1,
              background:"none",border:"none",cursor:"pointer",
              width:28,height:19,flexShrink:0,
            }}>
              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <div style={{width:30,height:2,background:"#F5F3EE",transform:"rotate(-30deg)",position:"absolute",opacity:0.6}}/>
                <div style={{width:30,height:2,background:"#F5F3EE",transform:"rotate(-150deg)",position:"absolute",opacity:0.6}}/>
              </div>
            </button>
          </div>
        </div>,
        document.getElementById("lb-portal")
      )}

      {/* ══════════════════════════════════════
          MOBILE NAV MENU — tile reveal + SplitText content animation
      ══════════════════════════════════════ */}
      {isMobile && menuOpen && ReactDOM.createPortal(
        <>
          {/* Tile grid — flips from edges to centre, fires onComplete when done */}
          {!menuReady && (
            <MenuGlitch onComplete={()=> setMenuReady(true)} onMidpoint={()=> setMenuItemsReady(true)} />
          )}

          {/* Menu panel — always dark (#121010) regardless of site theme */}
          <div
            id="menu-panel"
            className="dark"
            style={{
              position:"fixed", inset:0, zIndex:200,
              background: menuReady ? "#121010" : "transparent",
              display:"flex", flexDirection:"column",
              boxSizing:"border-box",
              overflow:"hidden",
            }}
            onClick={e=>e.stopPropagation()}
          >
            {/* Header row — X close only, positioned to match hamburger in main nav (right:16px, vertically centred in 64px) */}
            <div style={{ position:"relative", height:64, flexShrink:0, zIndex:1, visibility: menuReady ? "visible" : "hidden" }}>
              <button
                onClick={()=>setMenuOpen(false)}
                aria-label="Close menu"
                style={{ background:"none", border:"none", cursor:"pointer", width:24, height:10, position:"absolute", right:16, top:"50%", transform:"translateY(-50%)", padding:0 }}
              >
                <div style={{ position:"absolute", top:"50%", left:"50%", width:30, height:2, background:"#F5F3EE", transform:"translate(-50%,-50%) rotate(-30deg)" }} />
                <div style={{ position:"absolute", top:"50%", left:"50%", width:30, height:2, background:"#F5F3EE", transform:"translate(-50%,-50%) rotate(-150deg)" }} />
              </button>
            </div>

            {/* Nav content — hidden until menuReady, then items animate up */}
            <div
              ref={menuContentRef}
              style={{
                flex:1, display:"flex", flexDirection:"column", justifyContent:"center",
                padding:"42px", gap:28,
                visibility: "visible",
              }}
            >
              {/* Work, Services, About, Blog */}
              {["Work","Services","About","Blog"].map(label => (
                <div key={label} style={{ overflow:"hidden" }}>
                  <a
                    href="#"
                    className="menu-nav-item"
                    onClick={e=>{ e.preventDefault(); setMenuOpen(false); if(label==="Services"){ setTimeout(()=>{ window.location.href='dijitally-services.html'; },300); } else if(label==="Work"){ setTimeout(()=>{ setPage('home'); window.scrollTo(0,0); },300); } }}
                    style={{
                      fontFamily:"var(--sans)", fontSize:26, fontWeight:350,
                      lineHeight:"120%", letterSpacing:"0.26px",
                      color:"#F5F3EE", textDecoration:"none",
                      display:"block", opacity:0,
                    }}
                  >{label}</a>
                </div>
              ))}

              {/* Get in touch — 4×4 dot + NeuSans Medium 26px */}
              <div style={{ overflow:"hidden" }}>
                <button
                  className="menu-nav-item"
                  onClick={()=>{ setMenuOpen(false); setTimeout(()=>setCtaOpen(true), 400); }}
                  style={{
                    display:"flex", alignItems:"center", gap:10,
                    background:"none", border:"none", cursor:"pointer", padding:0,
                    fontFamily:"var(--sans)", fontSize:26, fontWeight:500,
                    lineHeight:"120%", letterSpacing:"0.26px",
                    color:"#F5F3EE", opacity:0,
                  }}
                >
                  <span style={{ width:4, height:4, background:"#F5F3EE", flexShrink:0, display:"inline-block" }} />
                  <span>Get in touch</span>
                </button>
              </div>

              {/* Email — JetBrains Mono 14px, muted */}
              <div style={{ overflow:"hidden", paddingTop:8 }}>
                <span
                  className="menu-nav-item"
                  style={{
                    fontFamily:"var(--mono)", fontSize:14, fontWeight:400,
                    lineHeight:"100%", letterSpacing:"-0.28px",
                    color:"#878787", display:"block", opacity:0,
                  }}
                >hello@dijitally.com</span>
              </div>
            </div>

            {/* Footer — DIJITALLY™ Lottie logo full width */}
            <div style={{ flexShrink:0, width:"100%" }}>
              <div
                ref={menuLogoRef}
                style={{ width:"100%", overflow:"hidden", filter:"invert(1)" }}
              />
            </div>
          </div>
        </>,
        document.getElementById("lb-portal")
      )}

      {/* ══════════════════════════════════════
          GET IN TOUCH — dark overlay + slide-in panel, both portalled outside smooth-wrapper
      ══════════════════════════════════════ */}
      {ReactDOM.createPortal(
        React.createElement(React.Fragment, null,
          /* Dark overlay — covers the shifted page content */
          React.createElement("div", {
            id: "cta-overlay",
            onClick: ()=>setCtaOpen(false),
            style: { position:"fixed", inset:0, zIndex:199 }
          }),
          /* Slide-in panel */
          React.createElement("div", {
            id: "cta-panel",
            style: {
              position:"fixed", top:0, right:0, height:"100vh", width:CTA_W, zIndex:200,
              background:"var(--primary)",
              display:"flex", flexDirection:"column",
              padding: isMobile ? "32px 24px" : "42px 64px",
              overflowY:"auto",
            },
            onClick: e=>e.stopPropagation()
          },
            /* Close button */
            React.createElement("div", { style:{display:"flex",justifyContent:"flex-end",marginBottom:42} },
              React.createElement("button", {
                onClick: ()=>setCtaOpen(false),
                style:{ background:"none",border:"none",cursor:"pointer",width:28,height:19,position:"relative",flexShrink:0 }
              },
                React.createElement("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}},
                  React.createElement("div",{style:{width:30,height:2,background:"var(--secondary)",transform:"rotate(-30deg)",position:"absolute"}}),
                  React.createElement("div",{style:{width:30,height:2,background:"var(--secondary)",transform:"rotate(-150deg)",position:"absolute"}})
                )
              )
            ),
            /* Content */
            React.createElement("div", { style:{display:"flex",flexDirection:"column",gap:42,flex:1,justifyContent:"center"} },
              /* Heading */
              React.createElement("div", { id:"cta-heading", style:{fontFamily:"var(--sans)",fontSize:32,fontWeight:350,lineHeight:"110%",letterSpacing:"-0.64px"} },
                React.createElement("span",{style:{color:"var(--static)"}},"Need an ally? "),
                React.createElement("span",{style:{color:"var(--secondary)"}}, "Let's start"),
                React.createElement("br",null),
                React.createElement("span",{style:{color:"var(--secondary)"}},"a project together.")
              ),
              /* Form */
              React.createElement("div", { style:{display:"flex",flexDirection:"column",width: isMobile ? "100%" : 533} },
                React.createElement("input",{placeholder:"Your name",type:"text",style:{padding:16,fontFamily:"var(--sans)",fontSize:16,fontWeight:350,border:"1px solid var(--grey)",outline:"none",background:"var(--primary)",color:"var(--secondary)",letterSpacing:"0.16px"}}),
                React.createElement("input",{placeholder:"Your email",type:"email",style:{padding:16,fontFamily:"var(--sans)",fontSize:16,fontWeight:350,border:"1px solid var(--grey)",borderTop:"none",outline:"none",background:"var(--primary)",color:"var(--secondary)",letterSpacing:"0.16px"}}),
                React.createElement("textarea",{placeholder:"Add any notes, if desired.",style:{padding:16,fontFamily:"var(--sans)",fontSize:16,fontWeight:350,border:"1px solid var(--grey)",borderTop:"none",outline:"none",background:"var(--primary)",color:"var(--static)",resize:"none",height:186,letterSpacing:"0.16px"}}),
                React.createElement("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:10}},
                  React.createElement("button",{className:"cta-btn",style:{background:"var(--tech)",color:"#121010",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:4,padding:6,fontFamily:"var(--sans)",fontSize:19,fontWeight:500,letterSpacing:0,lineHeight:1}},
                    React.createElement("span",{style:{width:3,height:3,background:"currentColor",display:"inline-block",flexShrink:0}}),
                    React.createElement("span",{className:"cta-text"},"Submit")
                  )
                )
              )
            )
          )
        ),
        document.getElementById("lb-portal")
      )}








    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Page/>);
</script>
</body>
</html>
