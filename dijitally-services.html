    /* ── Design Tokens ── */
    :root {
      --primary:   #F5F3EE;
      --secondary: #121010;
      --static:    #878787;
      --grey:      #DEDEDE;
      --tech:      #B6F4C9;
      --bg:        #F5F3EE;
      --electric:  #c9cec3;
      --stream:    #b8dbd8;

      --sans: "NeuSans Trial", "Helvetica Neue", Arial, sans-serif;
      --mono: "JetBrains Mono", monospace;

      --h1: 48px; --h1-w: 500; --h1-lh: 100%; --h1-ls: -0.96px;
      --h2: 32px; --h2-w: 500; --h2-lh: 110%; --h2-ls: -0.64px;
      --nav-size: 19px; --nav-w: 600; --nav-ls: -0.38px;
      --eyebrow: 12px; --eyebrow-ls: -0.24px;
      --card: 24px; --card-lh: 120%;
      --meta: 10px; --meta-ls: -0.2px;
      --acc-body: 17px; --acc-body-lh: 120%;

      --s4:4px; --s6:6px; --s8:8px; --s10:10px; --s12:12px;
      --s16:16px; --s24:24px; --s32:32px; --s42:42px;
      --s48:48px; --s64:64px; --s82:82px; --s96:96px; --s128:128px;

      --nav-h: 126px;
      --frame: 1690px;
      --content: 1606px;

      --scrollbar-thumb: #121010;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scrollbar-gutter: stable;
    }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--secondary);
      -webkit-font-smoothing: antialiased;
      min-width: 320px;
    }

    ::-webkit-scrollbar { height: 10px; width: 10px; }
    [data-carousel]::-webkit-scrollbar { display: none; }
    [data-carousel] { scrollbar-width: none; -ms-overflow-style: none; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border: 2px solid transparent;
      background-clip: padding-box;
      border-radius: 5px;
    }

    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-inner {
      display: flex;
      width: max-content;
      animation: ticker 30s linear infinite;
      will-change: transform;
    }

    .dot-grid {
      position:absolute; inset:0; pointer-events:none;
      background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .acc-body { overflow:hidden; max-height:0; transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1); }
    .acc-body.open { max-height:600px; }

    /* Nav item hover */
    .nav-item { transition: background 0.2s ease, color 0.2s ease; }
    .nav-item:hover { background: var(--secondary) !important; color: var(--bg) !important; }
    .nav-item:hover .nav-dot { background: var(--bg) !important; }

    /* CTA button hover */
    .cta-btn { transition: background 0.2s ease, color 0.2s ease; }
    .cta-btn:hover { background: #121010 !important; color: #B6F4C9 !important; }
    .dark .cta-btn:hover { background: #F5F3EE !important; color: #121010 !important; }

    /* Dark mode overrides */
    .dark {
      --primary:   #1a1a1a;
      --secondary: #F5F3EE;
      --static:    #666666;
      --grey:      #2a2a2a;
      --bg:        #121010;

    .dark .dot-grid {
      background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);

    /* Services hero scroll panel */
    .svc-panel {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }


    /* SplitText line-clip wrapper */
    .st-line { overflow: hidden; display: block; }

    /* Services page: disable fixed scroll wrapper — sticky panels need native scroll */
    #smooth-wrapper { position: static !important; overflow: visible !important; height: auto !important; }
    #smooth-content { will-change: auto !important; transform: none !important; }
    html, body { overflow-x: hidden; }

  <defs>
    <!--
      Single duotone: dark pixels → #121010 (secondary/light, bg/dark)
                      bright pixels → #F5F3EE (bg/light, secondary/dark)
      In light mode: bg areas of video map to #F5F3EE = var(--bg), objects map to #121010 = var(--secondary)
      In dark mode:  bg areas of video map to #121010 = var(--bg), objects map to #F5F3EE = var(--secondary)
    -->
    <!-- Light: dark pixels→#f1efeb, bright pixels→#f5f3ef -->
    <filter id="duotone-svc-light" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.0157" intercept="0.9451"/>
        <feFuncG type="linear" slope="0.0157" intercept="0.9373"/>
        <feFuncB type="linear" slope="0.0157" intercept="0.9216"/>
      </feComponentTransfer>
    </filter>
    <!-- Dark: dark pixels→#151414, bright pixels→#111010 -->
    <filter id="duotone-svc-dark" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="-0.0157" intercept="0.0824"/>
        <feFuncG type="linear" slope="-0.0157" intercept="0.0784"/>
        <feFuncB type="linear" slope="-0.0157" intercept="0.0784"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<div id="entry-overlay" style="position:fixed;inset:0;z-index:9999;background:#F5F3EE;pointer-events:none;overflow:hidden;"></div>
<script>
  (function(){
    var h = new Date().getHours();
    var isDark = localStorage.getItem('dijitally-theme') === 'dark' || (!localStorage.getItem('dijitally-theme') && (h >= 18 || h < 6));
    var color = isDark ? '#121010' : '#F5F3EE';
    var el = document.getElementById('entry-overlay');
    if (el) el.style.background = color;
    window.addEventListener('load', function() {
      if (!el) return;
      el.style.background = 'transparent';
      var sliceH = 2, H = window.innerHeight, total = Math.ceil(H / sliceH);
      var frag = document.createDocumentFragment(), maxEnd = 0;
      var delays = [], durs = [];
      for (var i = 0; i < total; i++) {
        var frac = i / Math.max(total - 1, 1);
        var delay = frac * 0.45 + Math.random() * 0.05;
        var dur = 0.16 + Math.random() * 0.1;
        delays.push(delay); durs.push(dur);
        if (delay + dur > maxEnd) maxEnd = delay + dur;
        var s = document.createElement('div');
        s.style.cssText = 'position:absolute;left:0;width:100%;top:' + (i*sliceH) + 'px;height:' + (sliceH+1) + 'px;background:' + color + ';transform:translateX(0);will-change:transform;';
        frag.appendChild(s);
      }
      el.appendChild(frag);
      var slices = Array.from(el.children);
      slices.forEach(function(sl, i) {
        (function(sl, delay, dur){ setTimeout(function(){ sl.style.transition = 'transform '+dur.toFixed(3)+'s linear'; sl.style.transform = 'translateX(100%)'; }, delay*1000); })(sl, delays[i], durs[i]);
      });
      setTimeout(function(){ el.parentNode && el.parentNode.removeChild(el); }, (maxEnd + 0.2) * 1000);
    });
  })();
</script>

<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useRef } = React;

if (typeof gsap !== 'undefined') {
  if (typeof ScrollTrigger !== 'undefined') {
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.config({ ignoreMobileResize: true, autoRefreshEvents: "visibilitychange,DOMContentLoaded,load" });
  }
  if (typeof SplitText !== 'undefined') gsap.registerPlugin(SplitText);
  if (typeof ScrambleTextPlugin !== 'undefined') gsap.registerPlugin(ScrambleTextPlugin);
}

/* ── ScrambleSpan ── */
function ScrambleSpan({children, style={}, tag='span'}) {
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if (!el || typeof gsap==='undefined' || typeof ScrambleTextPlugin==='undefined') return;
    const text = String(children||'');
    const obs = new IntersectionObserver(([e])=>{
      if (!e.isIntersecting) return;
      obs.disconnect();
      gsap.to(el, { duration:1.5, ease:'none', scrambleText:{ text, chars:'upperCase', revealDelay:0.3, speed:0.6 } });
    },{ threshold:0.5 });
    obs.observe(el);
    const lockAndScramble = () => {
      el.style.display='inline-block'; el.style.whiteSpace='nowrap';
      if (!el.style.width) el.style.width=el.offsetWidth+'px';
      el.style.overflow='hidden';
      gsap.to(el, { duration:0.5, ease:'none', scrambleText:{ text, chars:'upperCase', revealDelay:0.1, speed:0.8 } });
    };
    el.addEventListener('mouseenter', lockAndScramble);
    return ()=>{ obs.disconnect(); el.removeEventListener('mouseenter', lockAndScramble); };
  },[]);
  const Tag = tag;
  return React.createElement(Tag, { ref, dangerouslySetInnerHTML:{__html: String(children||'')}, style });
}

/* ── Eyebrow ── */
function Eyebrow({children, style={}, center=true}) {
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if (!el || typeof gsap==='undefined' || typeof ScrambleTextPlugin==='undefined') return;
    const text = String(children||'');
    const obs = new IntersectionObserver(([e])=>{
      if (!e.isIntersecting) return;
      obs.disconnect();
      gsap.to(el, { duration:1.5, ease:'none', scrambleText:{ text, chars:'upperCase', revealDelay:0.3, speed:0.6 } });
    },{ threshold:0.5 });
    obs.observe(el);
    return ()=> obs.disconnect();
  },[]);
  return (
    <span ref={ref} dangerouslySetInnerHTML={{__html: String(children||'')}}
      style={{fontFamily:"var(--mono)",fontSize:"var(--eyebrow)",fontWeight:400,lineHeight:"100%",
        letterSpacing:"var(--eyebrow-ls)",color:"var(--static)",textAlign:center?"center":"left",...style}}/>
  );
}

/* ── BackToTopButton ── */
function BackToTopButton({ dark }) {
  const [hov, setHov] = useState(false);
  const bg    = hov ? (dark ? "#F5F3EE" : "#1A1818") : "var(--tech)";
  const color = hov ? (dark ? "#121010" : "#F5F3EE") : "#121010";
  const dot   = hov ? (dark ? "#121010" : "#F5F3EE") : "var(--static)";
  return (
    <button
      onClick={()=>{ window.__servicesResetOnEnter = true; window.scrollTo({top:0,behavior:"instant"}); requestAnimationFrame(function(){ if(typeof ScrollTrigger!=="undefined") ScrollTrigger.refresh(); }); }}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,
        width:"100%",height:42,background:bg,border:"none",cursor:"pointer",padding:0,margin:0,flexShrink:0}}
    >
      <span style={{width:3,height:3,borderRadius:"50%",background:dot,flexShrink:0,display:"block",transition:"background 0.2s ease"}}/>
      <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"-0.24px",color,lineHeight:1}}>BACK TO TOP</ScrambleSpan>
    </button>
  );
}

/* ── ContactPixels ── */
const SVG_LOGOS = ['svgs/pattern_01.svg','svgs/pattern_02.svg','svgs/pattern_03.svg'];
const PATTERN_IMGS = SVG_LOGOS.map(src => { const img = new Image(); img.src = src; return img; });

function ContactPixels({ dark, mobile }) {
  const canvasRef     = useRef(null);
  const darkRef       = useRef(dark);
  const scrollProgRef = useRef(0);
  useEffect(()=>{ darkRef.current = dark; }, [dark]);

  useEffect(()=>{
    const canvas = canvasRef.current;
    if (!canvas) return;
    const CELL = mobile ? Math.round(32*0.66) : 32;
    let W=0, H=0, particles=[], raf;
    let svgImgs=[];
    Promise.all(SVG_LOGOS.map(src=>new Promise(res=>{ const img=new Image(); img.onload=img.onerror=()=>res(img); img.src=src; }))).then(imgs=>{ svgImgs=imgs; });
    const hash=(col,row)=>{ let h=(col*2654435761^row*2246822519)>>>0; h^=h>>>16; h=Math.imul(h,0x45d9f3b); h^=h>>>16; return (h>>>0)/0xFFFFFFFF; };
    const init=()=>{
      particles=[];
      const reach=mobile?Math.min(W,H)*0.50:H*0.67;
      const cols=Math.ceil(reach/CELL), rows=Math.ceil(reach/CELL);
      const maxDist=Math.sqrt(cols*cols+rows*rows);
      ['tl','br'].forEach(corner=>{
        for(let ci=0;ci<cols;ci++) for(let ri=0;ri<rows;ri++){
          const dist=Math.sqrt(ci*ci+ri*ri);
          const invDist=(maxDist-dist)/maxDist;
          const prob=Math.min(Math.pow(invDist,mobile?2.2:1.6)*(mobile?1.2:1.6),1);
          const h1=hash(ci+(corner==='br'?1000:0),ri+(corner==='br'?1000:0));
          if(h1>prob) continue;
          const totalCols=Math.floor(W/CELL), totalRows=Math.floor(H/CELL);
          const hcol=corner==='tl'?ci:totalCols-ci;
          const hrow=corner==='tl'?ri:totalRows-ri;
          const h2=hash(ci+(corner==='br'?2000:500),ri+(corner==='br'?2000:500));
          const isSvg=h2<(corner==='tl'?0.38:0.18);
          const svgIdx=isSvg?Math.floor(hash(ci+(corner==='br'?5000:3000),ri+(corner==='br'?5000:3000))*SVG_LOGOS.length):-1;
          const revealAt=hash(ci+(corner==='br'?6000:8000),ri+(corner==='br'?6000:8000))*0.95;
          particles.push({hcol,hrow,col:hcol,row:hrow,cL:'#F5F3EE',cD:'#121010',isSvg,svgIdx,revealAt});
        }
      });
    };
    const setSize=()=>{ W=canvas.offsetWidth; H=canvas.offsetHeight; if(!W||!H) return; canvas.width=W; canvas.height=H; init(); };
    let st;
    if(typeof gsap!=='undefined'&&typeof ScrollTrigger!=='undefined'){
      const section=canvas.parentElement;
      st=ScrollTrigger.create({ trigger:section, start:'top bottom', end:'top top', onUpdate:self=>{ scrollProgRef.current=self.progress; } });
    }
    const loop=()=>{
      if(W&&H){
        const ctx=canvas.getContext('2d');
        const isDark=darkRef.current, progress=scrollProgRef.current;
        ctx.clearRect(0,0,W,H);
        for(const p of particles){
          if(progress<p.revealAt) continue;
          const x=p.col*CELL, y=p.row*CELL;
          if(p.isSvg&&svgImgs[p.svgIdx]?.complete) ctx.drawImage(svgImgs[p.svgIdx],x,y,CELL,CELL);
          else if(!p.isSvg){ ctx.fillStyle=isDark?p.cD:p.cL; ctx.fillRect(x,y,CELL,CELL); }
        }
      }
      raf=requestAnimationFrame(loop);
    };
    const ro=new ResizeObserver(setSize); ro.observe(canvas); setSize(); raf=requestAnimationFrame(loop);
    return ()=>{ cancelAnimationFrame(raf); ro.disconnect(); if(st) st.kill(); };
  },[]);

  return <canvas ref={canvasRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:0}}/>;
}

/* ── PixelResolveImg ── */
function PixelResolveImg({ src, alt, style={}, delay=0 }) {
  const containerRef = useRef(null), imgElRef = useRef(null), canvasRef = useRef(null);
  const timerRef = useRef(null);
  const [ready, setReady] = useState(false), [inView, setInView] = useState(false);
  const PX = 16, RAMP = 1200;
  // Persistent offscreen canvas — never reallocated
  const smplRef = useRef(document.createElement('canvas'));
  const sctxRef = useRef(smplRef.current.getContext('2d'));

  useEffect(() => {
    const img = imgElRef.current;
    if (!img) return;
    if (img.complete && img.naturalWidth) { setReady(true); return; }
    const h = () => setReady(true);
    img.addEventListener('load', h);
    return () => img.removeEventListener('load', h);
  }, []);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  const drawAt = (ctx, W, H, curPX, img) => {
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
    const smpl = smplRef.current, sctx = sctxRef.current;
    const sw = Math.max(1, Math.ceil(W / curPX)), sh = Math.max(1, Math.ceil(H / curPX));
    if (smpl.width !== sw)  smpl.width  = sw;
    if (smpl.height !== sh) smpl.height = sh;
    const vW = img.naturalWidth, vH = img.naturalHeight;
    const scale = Math.max(W / vW, H / vH);
    const sx = ((vW * scale - W) / 2) / scale, sy = ((vH * scale - H) / 2) / scale;
    sctx.drawImage(img, sx, sy, W / scale, H / scale, 0, 0, sw, sh);
    ctx.drawImage(smpl, 0, 0, sw, sh, 0, 0, W, H);
  };

  // Show fully pixelated while waiting for in-view
  useEffect(() => {
    if (!ready || inView) return;
    const canvas = canvasRef.current, img = imgElRef.current;
    if (!canvas || !img) return;
    const W = containerRef.current?.offsetWidth, H = containerRef.current?.offsetHeight;
    if (!W || !H) return;
    canvas.width = W; canvas.height = H;
    drawAt(canvas.getContext('2d'), W, H, PX, img);
  }, [ready, inView]);

  // Resolve via discrete pixel steps — no per-frame rAF
  useEffect(() => {
    if (!inView || !ready) return;
    const timers = [];
    timerRef.current = setTimeout(() => {
      const canvas = canvasRef.current, img = imgElRef.current;
      if (!canvas || !img) return;
      const W = containerRef.current?.offsetWidth, H = containerRef.current?.offsetHeight;
      if (!W || !H) return;
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');
      const ease = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      const steps = new Set();
      for (let i = 0; i <= 60; i++) {
        const t = i / 60;
        steps.add(Math.max(1, Math.round(1 + (PX - 1) * ease(1 - t))));
      }
      Array.from(steps).sort((a,b) => b-a).forEach(px => {
        const t = 1 - (px - 1) / (PX - 1);
        const id = setTimeout(() => {
          if (px === 1) ctx.clearRect(0, 0, W, H);
          else          drawAt(ctx, W, H, px, img);
        }, ease(t) * RAMP);
        timers.push(id);
      });
    }, delay * 1000);
    return () => { clearTimeout(timerRef.current); timers.forEach(clearTimeout); };
  }, [inView, ready]);

  return (
    <div ref={containerRef} style={{position:'relative',width:'100%',height:'100%',...style}}>
      <img ref={imgElRef} src={src} alt={alt||''} style={{display:'block',width:'100%',height:'100%',objectFit:'cover'}}/>
      <canvas ref={canvasRef} style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none'}}/>
    </div>
  );
}

/* ── MenuGlitch ── */
function MenuGlitch({ onComplete, onMidpoint }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const H = window.innerHeight;
    const sliceH = 2;
    const total = Math.ceil(H / sliceH);
    const speed = 0.04, spread = 0.04, stagger = 0.00025, bellStrength = 0.1;
    const ordered = Array.from({length: total}, (_,i)=>i).sort(()=>Math.random()-0.5);
    const stripData = ordered.map((sliceIdx, i) => {
      const duration = speed*(0.2+Math.random()*1.6);
      const t = sliceIdx/Math.max(total-1,1);
      const norm = t*2-1;
      const bellDelay = Math.exp(-norm*norm*3.5)*bellStrength;
      const delay = stagger*i+bellDelay+Math.random()*spread;
      return {sliceIdx, duration, delay};
    });
    const maxEnd = Math.max(...stripData.map(d=>(d.delay+d.duration)*1000));
    const slices = [];
    for(let i=0;i<total;i++){
      const div=document.createElement('div');
      div.style.cssText=`position:absolute;left:0;width:100%;top:${i*sliceH}px;height:${sliceH}px;background:#121010;will-change:transform;transform:translateX(100%);`;
      el.appendChild(div); slices.push(div);
    }
    let midpointFired = false;
    const midTimer = setTimeout(()=>{ if(!midpointFired){midpointFired=true;onMidpoint?.();} }, maxEnd*0.85);
    stripData.forEach(({sliceIdx, duration, delay})=>{
      setTimeout(()=>{ slices[sliceIdx].style.transition=`transform ${duration.toFixed(3)}s linear`; slices[sliceIdx].style.transform='translateX(0)'; }, delay*1000);
    });
    const doneTimer = setTimeout(()=>onComplete(), maxEnd+100);
    return ()=>{ clearTimeout(midTimer); clearTimeout(doneTimer); };
  }, []);
  return <div ref={ref} style={{position:"fixed",inset:0,zIndex:210,pointerEvents:"none",overflow:"hidden"}}/>;
}

/* ═══════════════════════════════════════════════════
   DITHER CANVAS — intro hero background
═══════════════════════════════════════════════════ */
function DitherCanvas({ dark }) {
  const canvasRef = React.useRef(null);
  const wrapRef   = React.useRef(null);
  const videoRef  = React.useRef(null);
  const darkRef   = React.useRef(dark);
  React.useEffect(()=>{ darkRef.current = dark; }, [dark]);

  React.useEffect(()=>{
    const canvas = canvasRef.current;
    const video  = videoRef.current;
    if (!canvas || !video) return;

    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d', { willReadFrequently:true });

    const PX=12;
    const BR=0.10, CT=2.4, GM=1.13;
    const LON=[237,234,229], LOFF=[245,243,238];
    const DON=[18,16,16],    DOFF=[0,0,0];
    const BAYER=[[0,2,0,2],[3,1,3,1],[0,2,0,2],[3,1,3,1]];

    let particles=[], cols=0, rows=0, raf;
    let outBuf=null, outImageData=null;
    let frameCount=0, cachedId=null;

    class P {
      constructor(col,row){
        this.col=col; this.row=row;
        this.r=255; this.g=255; this.b=255;
      }
      sample(id){
        const idx=(this.row*cols+this.col)*4;
        let lum=(0.299*id.data[idx]+0.587*id.data[idx+1]+0.114*id.data[idx+2])/255;
        lum=Math.pow(Math.max(0,lum),GM);
        lum=(lum-0.5)*CT+0.5;
        lum=Math.max(0,Math.min(1,lum+BR));
        const bl=darkRef.current?1-lum:lum;
        const thr=(BAYER[this.row&3][this.col&3]+0.5)/4;
        const ch=(bl<=thr)?(darkRef.current?DON:LON):(darkRef.current?DOFF:LOFF);
        this.r=ch[0]; this.g=ch[1]; this.b=ch[2];
      }
      paint(W){
        const gx=this.col*PX, gy=this.row*PX;
        const r=this.r, g=this.g, b=this.b;
        for(let dy=0;dy<PX;dy++){
          let base=((gy+dy)*W+gx)*4;
          for(let dx=0;dx<PX;dx++){
            outBuf[base]=r; outBuf[base+1]=g; outBuf[base+2]=b; outBuf[base+3]=255;
            base+=4;
          }
        }
      }
    }

    function build(){
      cols=Math.floor(canvas.width/PX);
      rows=Math.floor(canvas.height/PX);
      smpl.width=cols; smpl.height=rows;
      outBuf=new Uint8ClampedArray(canvas.width*canvas.height*4);
      outImageData=ctx.createImageData(canvas.width, canvas.height);
      particles=[];
      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) particles.push(new P(c,r));
    }

    function setSize(){
      const vw=video.videoWidth||640, vh=video.videoHeight||360;
      canvas.width =Math.floor(vw*2/PX)*PX;
      canvas.height=Math.floor(vh*2/PX)*PX;
      canvas.style.width =canvas.width+'px';
      canvas.style.height=canvas.height+'px';
      build();
    }

    function loop(){
      raf=requestAnimationFrame(loop);
      frameCount++;
      if(!outBuf||video.readyState<2) return;
      if(frameCount%4===0){
        sctx.drawImage(video,0,0,cols,rows);
        cachedId=sctx.getImageData(0,0,cols,rows);
      }
      if(!cachedId) return;
      outBuf.fill(0);
      const W=canvas.width;
      for(const p of particles){ p.sample(cachedId); p.paint(W); }
      outImageData.data.set(outBuf);
      ctx.putImageData(outImageData, 0, 0);
    }

    video.addEventListener('loadedmetadata', setSize);
    setSize();
    gsap.set(wrapRef.current, { xPercent:-50, yPercent:-50, y:128, scale:1 });
    video.play().catch(()=>{});
    loop();
    return ()=>{ cancelAnimationFrame(raf); };
  },[]);

  return (
    <>
      <video ref={videoRef} src="videos/thumbnail_02.mp4?v=3" autoPlay muted loop playsInline
        crossOrigin="anonymous"
        style={{position:'absolute',opacity:0,width:1,height:1,pointerEvents:'none'}}
      />
      <div ref={wrapRef} style={{position:'absolute',left:'50%',top:0,zIndex:0,pointerEvents:'none'}}>
        <canvas ref={canvasRef} style={{display:'block',opacity:0.9}}/>
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════
   DITHER BG — per-section background, no mouse interaction
═══════════════════════════════════════════════════ */
function DitherBg({ src, dark, active, px=8 }) {
  const canvasRef  = React.useRef(null);
  const videoRef   = React.useRef(null);
  const darkRef    = React.useRef(dark);
  const activeRef  = React.useRef(active);
  React.useEffect(()=>{ darkRef.current  = dark;   }, [dark]);
  React.useEffect(()=>{ activeRef.current = active; }, [active]);

  React.useEffect(()=>{
    const canvas = canvasRef.current;
    const video  = videoRef.current;
    if (!canvas || !video) return;

    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d', { willReadFrequently: true });

    const PX=px;
    const BR=0.10, CT=2.4, GM=1.13;
    const LON=[237,234,229], LOFF=[245,243,238];
    const DON=[18,16,16],    DOFF=[0,0,0];
    const BAYER=[[0,2,0,2],[3,1,3,1],[0,2,0,2],[3,1,3,1]];

    let cols=0, rows=0, raf;
    let outBuf=null, outImageData=null;
    let frameCount=0, cachedId=null;

    function build(){
      cols = Math.floor(canvas.width/PX);
      rows = Math.floor(canvas.height/PX);
      smpl.width=cols; smpl.height=rows;
      outBuf = new Uint8ClampedArray(canvas.width*canvas.height*4);
      outImageData = ctx.createImageData(canvas.width, canvas.height);
    }

    function setSize(){
      const vw = video.videoWidth  || 640;
      const vh = video.videoHeight || 360;
      const cw = canvas.parentElement ? canvas.parentElement.offsetWidth  : 400;
      const ch = canvas.parentElement ? canvas.parentElement.offsetHeight : 400;
      // Cover: scale to fill container while preserving video aspect ratio, then reduce by 15%
      const scale = Math.max(cw / vw, ch / vh) * 0.85;
      const w = Math.round(vw * scale);
      const h = Math.round(vh * scale);
      canvas.width  = Math.floor(w / PX) * PX;
      canvas.height = Math.floor(h / PX) * PX;
      canvas.style.width  = canvas.width  + 'px';
      canvas.style.height = canvas.height + 'px';
      canvas.style.left   = Math.round((cw - canvas.width)  / 2) + 'px';
      canvas.style.top    = Math.round((ch - canvas.height) / 2) + 'px';
      build();
    }

    function loop(){
      raf = requestAnimationFrame(loop);
      if (!activeRef.current) return;
      frameCount++;
      if (!outBuf || video.readyState < 2) return;
      if (frameCount % 2 === 0) {
        sctx.drawImage(video, 0, 0, cols, rows);
        cachedId = sctx.getImageData(0, 0, cols, rows);
      }
      if (!cachedId) return;
      outBuf.fill(0);
      const W = canvas.width;
      const isDark = darkRef.current;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const idx = (row * cols + col) * 4;
          let lum = (0.299*cachedId.data[idx] + 0.587*cachedId.data[idx+1] + 0.114*cachedId.data[idx+2]) / 255;
          lum = Math.pow(Math.max(0, lum), GM);
          lum = (lum - 0.5) * CT + 0.5;
          lum = Math.max(0, Math.min(1, lum + BR));
          const bl = isDark ? 1 - lum : lum;
          const thr = (BAYER[row & 3][col & 3] + 0.5) / 4;
          const ch = (bl <= thr) ? (isDark ? DON : LON) : (isDark ? DOFF : LOFF);
          const gx = col * PX, gy = row * PX;
          for (let dy = 0; dy < PX; dy++) {
            let base = ((gy + dy) * W + gx) * 4;
            for (let dx = 0; dx < PX; dx++) {
              outBuf[base]=ch[0]; outBuf[base+1]=ch[1]; outBuf[base+2]=ch[2]; outBuf[base+3]=255;
              base += 4;
            }
          }
        }
      }
      outImageData.data.set(outBuf);
      ctx.putImageData(outImageData, 0, 0);
    }

    const ro = new ResizeObserver(setSize);
    ro.observe(canvas.parentElement);
    setSize();
    video.addEventListener('loadedmetadata', setSize);
    video.play().catch(()=>{});
    loop();
    return () => { cancelAnimationFrame(raf); ro.disconnect(); };
  }, []);

  return (
    <>
      <video ref={videoRef} src={src} autoPlay muted loop playsInline crossOrigin="anonymous"
        style={{position:'absolute', opacity:0, width:1, height:1, pointerEvents:'none'}} />
      <canvas ref={canvasRef} style={{
        position:'absolute',
        pointerEvents:'none', zIndex:0, opacity:0.9,
      }} />
    </>
  );
}

function MobileDitherVideo({ dark }) {
  const canvasRef = React.useRef(null);
  const wrapRef   = React.useRef(null);
  const videoRef  = React.useRef(null);
  const darkRef   = React.useRef(dark);
  React.useEffect(()=>{ darkRef.current = dark; }, [dark]);

  React.useEffect(()=>{
    const canvas = canvasRef.current;
    const video  = videoRef.current;
    const wrap   = wrapRef.current;
    if (!canvas || !video || !wrap) return;

    const ctx  = canvas.getContext('2d');
    const smpl = document.createElement('canvas');
    const sctx = smpl.getContext('2d', { willReadFrequently: true });

    const PX=8;
    const BAYER=[[0,2,0,2],[3,1,3,1],[0,2,0,2],[3,1,3,1]];
    const GM=1.13, CT=2.4, BR=0.10;
    const LON=[237,234,229], LOFF=[245,243,238];
    const DON=[18,16,16],    DOFF=[0,0,0];

    let cols=0, rows=0, raf;
    let outBuf=null, outImageData=null;

    function build(){
      cols=Math.floor(canvas.width/PX);
      rows=Math.floor(canvas.height/PX);
      smpl.width=cols; smpl.height=rows;
      outBuf=new Uint8ClampedArray(canvas.width*canvas.height*4);
      outImageData=ctx.createImageData(canvas.width, canvas.height);
    }

    function setSize(){
      const vw=video.videoWidth||640, vh=video.videoHeight||360;
      const s=(window.innerWidth/vw)*2;
      canvas.width =Math.floor(vw*s/PX)*PX;
      canvas.height=Math.floor(vh*s/PX)*PX;
      canvas.style.width =canvas.width+'px';
      canvas.style.height=canvas.height+'px';
      build();
      gsap.set(wrap, { xPercent:-50, yPercent:-50, x:window.innerWidth*0.5, y:128, scale:1 });
    }

    function loop(){
      raf=requestAnimationFrame(loop);
      if(!outBuf||video.readyState<2) return;
      sctx.fillStyle=darkRef.current?'#121010':'#F5F3EE';
      sctx.fillRect(0,0,cols,rows);
      sctx.drawImage(video,0,0,cols,rows);
      const id=sctx.getImageData(0,0,cols,rows);
      outBuf.fill(0);
      const W=canvas.width;
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          const idx=(r*cols+c)*4;
          let lum=(0.299*id.data[idx]+0.587*id.data[idx+1]+0.114*id.data[idx+2])/255;
          lum=Math.pow(Math.max(0,lum),GM);
          lum=(lum-0.5)*CT+0.5;
          lum=Math.max(0,Math.min(1,lum+BR));
          const bl=darkRef.current?1-lum:lum;
          const thr=(BAYER[r&3][c&3]+0.5)/4;
          const ch=(bl<=thr)?(darkRef.current?DON:LON):(darkRef.current?DOFF:LOFF);
          for(let dy=0;dy<PX;dy++){
            let base=((r*PX+dy)*W+c*PX)*4;
            for(let dx=0;dx<PX;dx++){
              outBuf[base]=ch[0]; outBuf[base+1]=ch[1]; outBuf[base+2]=ch[2]; outBuf[base+3]=255;
              base+=4;
            }
          }
        }
      }
      outImageData.data.set(outBuf);
      ctx.putImageData(outImageData, 0, 0);
    }

    if(video.videoWidth>0){ setSize(); } else { video.addEventListener('loadedmetadata',setSize,{once:true}); }
    video.play().catch(()=>{});
    loop();
    return ()=>{ cancelAnimationFrame(raf); };
  },[]);

  return (
    <>
      <video ref={videoRef} src="videos/thumbnail_02.mp4?v=3" autoPlay muted loop playsInline
        crossOrigin="anonymous"
        style={{position:'absolute',opacity:0,width:1,height:1,pointerEvents:'none'}}
      />
      <div ref={wrapRef} style={{position:'absolute',left:0,top:0,zIndex:0,pointerEvents:'none'}}>
        <canvas ref={canvasRef} style={{display:'block',opacity:0.9}}/>
      </div>
    </>
  );
}

function ServicesHero({ isMobile, dark }) {

  useEffect(() => {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    if (typeof SplitText === 'undefined') return;
    if (isMobile) return;
    const el = allyContainerRef.current;
    if (!el) return;

    const N = 7;
    const STEP = 1 / N;

    // Measure natural word widths BEFORE SplitText mangles the DOM.
    // Use getBoundingClientRect for sub-pixel accuracy, then ceil to avoid fractional clipping.
    const posNaturalW  = posRef.current ? Math.ceil(posRef.current.getBoundingClientRect().width) : 0;
    const svcNaturalWs = svcWordRefs.current.map(el => el ? Math.ceil(el.getBoundingClientRect().width) : 0);

    // Initialise slot to "point of scale" width
    if (wordSlotRef.current) gsap.set(wordSlotRef.current, { width: posNaturalW });

    // SplitText "Your"
    const yourSplit = new SplitText(yourInnerRef.current, { type: "words" });
    gsap.set(yourSplit.words, { y: "0%" });

    // SplitText "point of scale"
    const posSplit = new SplitText(posRef.current, { type: "words" });
    gsap.set(posSplit.words, { y: "0%" });

    // SplitText each service word
    const svcSplits = svcWordRefs.current.map(el => {
      if (!el) return null;
      const s = new SplitText(el, { type: "chars" });
      gsap.set(s.chars, { y: "110%", opacity: 0 });

    });

    // Cascade: animate each element so words rise visibly from below

      yourWrapRef.current,
      bracketOpenRef.current,
      posRef.current,
      bracketCloseRef.current,

    if (step0BodyRef.current) gsap.set(step0BodyRef.current, { opacity: 0 });

    const pillWidths = pillTextRefs.current.map(el => el ? Math.ceil(el.getBoundingClientRect().width) : 0);

    // ── STEPS 1–6: Background crossfades + SplitText word transitions ──
    SVC_ROWS.forEach((svc, i) => {
      const s = (i + 1) * STEP;

      // Videos are managed in handleSectionChange for reliability — tl.tweenTo(s) never

    var circleLayout = CIRCLE_IMGS.map(function(_, i) {

      return {

        stackX:  (Math.random() - 0.5) * 28,
        stackY:  110 + (Math.random() - 0.5) * 18,
        stackR:  (Math.random() - 0.5) * 32,
        fanX:    Math.cos(baseAngle) * CIRCLE_R,

    function positionCircleCenter() {

    function initCircleSlide() {

      circleSlideX = 0;

      circleLayout.forEach(function(d, i) {
        var img = circleImgRefs.current[i];
        if (!img) return;
        var a = d.baseAngle + orbitAngle;
        gsap.set(img, { x: Math.cos(a) * CIRCLE_R, y: Math.sin(a) * CIRCLE_R, opacity: 1 });

    }
    // Rotate the orbit so slot 9 (video) lands at 3 o'clock (most visible from left edge).

        },
        onComplete: function() { circleRotateTween = null; if (pi < 0) startOrbitTicker(); },
      });
    }
    // ────────────────────────────────────────────────────────

    function getBgColor() {
      return darkPropRef.current ? '#121010' : '#F5F3EE';
    }

    function resetOverlay(ov) {
      if (!ov) return;
      if (ov.__stripTimer) { clearTimeout(ov.__stripTimer); ov.__stripTimer = null; }
      ov.innerHTML = '';
      ov.style.background = getBgColor();
    }

    function triggerStripReveal(ov) {
      if (!ov) return;
      if (ov.__stripTimer) { clearTimeout(ov.__stripTimer); ov.__stripTimer = null; }
      var color = getBgColor();
      var W = ov.offsetWidth;
      var sliceW = 6; // vertical columns, full height — same as transition tool "up" direction
      var total = Math.ceil(W / sliceW);
      ov.innerHTML = '';

      var frag = document.createDocumentFragment();
      for (var i = 0; i < total; i++) {
        var s = document.createElement('div');
        s.style.cssText = 'position:absolute;top:0;height:100%;left:' + (i * sliceW) + 'px;width:' + (sliceW + 1) + 'px;background:' + color + ';transform:translateY(0);will-change:transform;';
        frag.appendChild(s);

      ov.appendChild(frag);

        }

      svcSplits.forEach(function(split) {
        if (!split || !split.chars) return;
        gsap.killTweensOf(split.chars);
        gsap.set(split.chars, { y: "110%", opacity: 0 });
      });

      // Reset all body copy
      bodyRefs.current.forEach(function(bel, idx) {
        if (!bel) return;
        gsap.set(bel, { opacity: 0 });
        if (bodySplits[idx] && bodySplits[idx].words) {
          gsap.killTweensOf(bodySplits[idx].words);
          gsap.set(bodySplits[idx].words, { y: "18px", opacity: 0 });
        }
      });

      // step 0 body + hero dither: visible only when no service is active
      if (step0BodyRef.current) gsap.to(step0BodyRef.current, { opacity: pi < 0 ? 1 : 0, duration: 0.3, ease: "power1.out" });
      if (ditherHeroRef.current) gsap.to(ditherHeroRef.current, { opacity: pi < 0 ? 1 : 0, duration: 0.4, ease: "power1.out" });

      if (pi >= 0) {
        // Hard-hide the "point of scale" text whenever a service section is active.
        // tl.tweenTo going backward can reverse the posSplit exit tween and briefly
        // bring these words back into view; killing and setting prevents that.
        if (posSplit && posSplit.words) {
          gsap.killTweensOf(posSplit.words);
          gsap.set(posSplit.words, { y: "-110%", opacity: 0 });
        }
        if (yourWrapRef.current) {
          gsap.killTweensOf(yourWrapRef.current);
          gsap.set(yourWrapRef.current, { opacity: 0, width: 0 });
        }

        // Snap slot to exact word width before chars appear — the timeline width tween
        // may be mid-transition when tweenTo(s) completes, leaving the slot too narrow.
        if (wordSlotRef.current && svcNaturalWs[pi]) {
          gsap.set(wordSlotRef.current, { width: svcNaturalWs[pi] });
        }
        // Snap pill box width and y (y may have been mid-tween on pill-click jumps)
        if (pillBoxRef.current && pillWidths[pi]) {
          gsap.set(pillBoxRef.current, { width: pillWidths[pi], y: pi * pillPitch });
        }
        // Sync pill text colours: active = section bg colour, rest = default
        pillTextRefs.current.forEach(function(pel, idx) {
          if (!pel) return;
          gsap.set(pel, { color: idx === pi ? "var(--bg)" : "var(--secondary)" });
        });
        // Animate service word chars in
        if (svcSplits[pi] && svcSplits[pi].chars) {
          gsap.to(svcSplits[pi].chars, { y: "0%", opacity: 1, duration: 0.375, ease: "power2.out", stagger: { each: 0.0225 } });
        }
        // Show body container and stagger-animate words in
        if (bodyRefs.current[pi]) {
          gsap.set(bodyRefs.current[pi], { opacity: 1 });
          if (bodySplits[pi] && bodySplits[pi].words) {
            gsap.to(bodySplits[pi].words, {
              y: "0px", opacity: 1, duration: 0.5, ease: "power2.out",
              stagger: { each: 0.02 }, delay: 0.1,
            });
          }
        }
      }
    }

    var tlTween = null;
    var lastStepTime = 0;
    var STEP_COOLDOWN = 750; // ms — tween is 700ms; accumulation handles momentum
    var wheelAcc = 0;
    var wheelAccTimer = null;
    var pendingExitDown = false;

    function goToStep(next) {
      // Also called from pill click handlers via goToStepRef
      var now = Date.now();
      if (!cascadeDone || animating || next === currentStep) return;
      if (now - lastStepTime < STEP_COOLDOWN) return;
      if (next < 0 || next >= N) return;
      animating = true;
      lastStepTime = now;
      var prevStep = currentStep;
      currentStep = next;

      if (tlTween) tlTween.kill();

      // Animate the leaving section's chars + body out before the transition starts
      var prevPi = prevStep - 1;

      // Returning to step 0: hard-hide all service chars BEFORE seeking the timeline so
      // posSplit words and service chars are never simultaneously visible in the same frame.
      if (next === 0) {
        svcSplits.forEach(function(split) {
          if (!split || !split.chars) return;
          gsap.killTweensOf(split.chars);
          gsap.set(split.chars, { y: "110%", opacity: 0 });
        });
        bodyRefs.current.forEach(function(b) { if (b) gsap.set(b, { opacity: 0 }); });
        if (step0BodyRef.current) gsap.set(step0BodyRef.current, { opacity: 0 });
        ditherOverlayRefs.current.forEach(function(ov) { resetOverlay(ov); });
        tl.seek(0, true);
        gsap.set(wordSlotRef.current, { width: posNaturalW });
        gsap.killTweensOf(posSplit.words);
        gsap.set(posSplit.words, { y: "0%", opacity: 1 });
        if (pillBoxRef.current) gsap.set(pillBoxRef.current, { y: 0 });
        handleSectionChange(0);
        setTimeout(function() { animating = false; }, 420);
        return;
      }

      if (prevPi >= 0) {
        if (svcSplits[prevPi] && svcSplits[prevPi].chars) {
          gsap.killTweensOf(svcSplits[prevPi].chars);
          gsap.to(svcSplits[prevPi].chars, {
            y: "-110%", opacity: 0,
            duration: 0.28, ease: "power2.in",
            stagger: { each: 0.014, from: "end" },
          });
        }
        if (bodyRefs.current[prevPi]) {
          gsap.to(bodyRefs.current[prevPi], { opacity: 0, duration: 0.2, ease: "power1.in" });
        }
      }

      // All three pill + section animations run in parallel — no sequential blocking
      var pi = next - 1;
      if (pillBoxRef.current && pillWidths[pi]) {
        // Width snaps to destination label as section starts
        gsap.to(pillBoxRef.current, { width: pillWidths[pi], duration: 0.22, ease: "power2.inOut" });
        // Y slides with a slight lag for a trailing feel
        gsap.to(pillBoxRef.current, { y: pi * pillPitch, duration: 0.6, ease: "back.out(1.2)", delay: 0.08, overwrite: "auto" });
      }
      // Slot width as standalone tween — keeps brackets smooth on multi-step pill jumps
      if (wordSlotRef.current && svcNaturalWs[pi]) {
        gsap.killTweensOf(wordSlotRef.current);
        gsap.to(wordSlotRef.current, { width: svcNaturalWs[pi], duration: 0.15, ease: "power2.inOut" });
      }
      tlTween = tl.tweenTo(next / N, {
        duration: 0.7,
        ease: "power2.inOut",
        onComplete: function() {
          animating = false;
          handleSectionChange(next);
          if (pendingExitDown) {
            pendingExitDown = false;
            sectionActive = false;
            wheelAcc = 0;
            if (pinST) window.scrollTo(0, pinST.end + 10);
          }
        },
      });
    }

    // Expose to pill click handlers (defined in JSX, outside this effect)
    goToStepRef.current = goToStep;

    var wheelHandler = function(e) {
      if (!sectionActive) return;
      if (!cascadeDone) { e.preventDefault(); return; }
      e.preventDefault();
      var dir = e.deltaY > 0 ? 1 : -1;

      if (dir > 0 && currentStep >= N - 1) {
        if (animating) {
          // Tween to last section still running — queue exit for when it completes
          pendingExitDown = true;
          return;
        }
        sectionActive = false;
        wheelAcc = 0;
        if (tlTween) { tlTween.kill(); tlTween = null; }
        if (pinST) window.scrollTo(0, pinST.end + 10);
        return;
      }

      if (animating) return;

      // ── Circle slide-in phase ─────────────────────────────────────────────
      if (currentStep === 0 && !circleAnimDone) {
        if (dir < 0) {
          sectionActive = false; animating = false; wheelAcc = 0;
          if (pinST) window.scrollTo(0, Math.max(0, pinST.start - 10));
          return;
        }
        wheelAcc += e.deltaY;
        clearTimeout(wheelAccTimer);
        wheelAccTimer = setTimeout(function() { wheelAcc = 0; }, 150);
        if (Math.abs(wheelAcc) < 60) return;
        wheelAcc = 0;
        slideCircleStep();
        return;
      }

      if (dir < 0 && currentStep <= 0) {
        sectionActive = false;
        animating = false;
        wheelAcc = 0;
        if (tlTween) { tlTween.kill(); tlTween = null; }
        if (pinST) window.scrollTo(0, Math.max(0, pinST.start - 10));
        return;
      }
      // Accumulate delta — reset on idle so momentum tail doesn't stack across pauses
      wheelAcc += e.deltaY;
      clearTimeout(wheelAccTimer);
      wheelAccTimer = setTimeout(function() { wheelAcc = 0; }, 150);
      // Only advance once the gesture has enough weight; reset so momentum can't re-trigger
      if (Math.abs(wheelAcc) < 60) return;
      wheelAcc = 0;
      goToStep(currentStep + dir);
    };
    window.addEventListener('wheel', wheelHandler, { passive: false });

    // Touch support
    var touchStartY = 0;
    var touchHandler = function(e) {
      if (!sectionActive || !cascadeDone) return;
      if (e.type === "touchstart") { touchStartY = e.touches[0].clientY; return; }
      var dy = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(dy) < 30) return;
      var dir = dy > 0 ? 1 : -1;
      // Circle slide-in phase on touch
      if (currentStep === 0 && !circleAnimDone) {
        if (dir < 0) { sectionActive = false; if (pinST) window.scrollTo(0, Math.max(0, pinST.start - 10)); return; }
        slideCircleStep();
        return;
      }
      if (dir > 0 && currentStep >= N - 1) return;
      if (dir < 0 && currentStep <= 0) return;
      e.preventDefault();
      goToStep(currentStep + dir);
    };
    window.addEventListener('touchstart', touchHandler, { passive: true });
    window.addEventListener('touchend', touchHandler, { passive: false });

    pinST = ScrollTrigger.create({
      trigger: el,
      start: "top top",
      end: "+=" + ((N - 1) * window.innerHeight),
      pin: true,
      onEnter: function() {
        sectionActive = true;
        currentStep = 0;
        cascadeDone = false;
        animating = false;

        // Reset timeline and all timeline-driven state so re-entry is always clean.
        tl.seek(0, true);
        videoRefs.current.forEach(function(v) { if (v) gsap.set(v, { opacity: 0 }); });
        gsap.set(pillsRef.current, { opacity: 0 });
        if (pillBoxRef.current) gsap.set(pillBoxRef.current, { y: 0, opacity: 0 });
        svcSplits.forEach(function(split) {
          if (split && split.chars) gsap.set(split.chars, { y: "110%" });
        });
        bodyRefs.current.forEach(function(b) { if (b) gsap.set(b, { opacity: 0 }); });
        ditherOverlayRefs.current.forEach(function(ov) { resetOverlay(ov); });
        gsap.set(wordSlotRef.current, { width: posNaturalW });
        if (posSplit && posSplit.words) gsap.set(posSplit.words, { y: "0%", opacity: 1 });
        setActiveStep(0);

        if (cascadeHasPlayed) {
          // Already played once — snap to final position and allow interaction immediately.
          gsap.set([yourWrapRef.current, bracketOpenRef.current, posRef.current, bracketCloseRef.current, allyMarkRef.current], { y: 0, opacity: 1 });
          cascadeDone = true;
          handleSectionChange(0);
          return;
        }

        // First-time entry: animate the cascade in.
        gsap.set([yourWrapRef.current, bracketOpenRef.current, posRef.current, bracketCloseRef.current, allyMarkRef.current], { y: 60, opacity: 0 });
        var dur = 0.5, ease = "power2.out", stagger = 0.12;
        var t = gsap.timeline({
          delay: 0.2,
          onComplete: function() {
            cascadeDone = true;
            cascadeHasPlayed = true;
            handleSectionChange(0);
          },
        });
        [yourWrapRef.current, bracketOpenRef.current, posRef.current, bracketCloseRef.current, allyMarkRef.current].forEach(function(cel, idx) {
          t.to(cel, { y: 0, opacity: 1, duration: dur, ease: ease }, idx * stagger);
        });
      },
      onLeave: function() {
        sectionActive = false;
        animating = false;
        if (tlTween) { tlTween.kill(); tlTween = null; }
      },
      onEnterBack: function() {
        sectionActive = true;
        if (window.__servicesResetOnEnter) {
          window.__servicesResetOnEnter = false;
          currentStep = 0;
          cascadeHasPlayed = false;
          cascadeDone = false;
          animating = false;
          tl.seek(0, true);
          gsap.set(pillsRef.current, { opacity: 0 });
          if (pillBoxRef.current) gsap.set(pillBoxRef.current, { y: 0, opacity: 0 });
          videoRefs.current.forEach(function(v) { if (v) gsap.set(v, { opacity: 0 }); });
          bodyRefs.current.forEach(function(b) { if (b) gsap.set(b, { opacity: 0 }); });
          if (step0BodyRef.current) gsap.set(step0BodyRef.current, { opacity: 0 });
          if (ditherHeroRef.current) gsap.set(ditherHeroRef.current, { opacity: 1 });
          if (posSplit && posSplit.words) gsap.set(posSplit.words, { y: "0%", opacity: 1 });
          if (wordSlotRef.current) gsap.set(wordSlotRef.current, { width: posNaturalW });
          svcSplits.forEach(function(split) { if (split && split.chars) gsap.set(split.chars, { y: "110%", opacity: 0 }); });
          setActiveStep(0);
          // onEnter won't re-fire — play the cascade directly
          gsap.set([yourWrapRef.current, bracketOpenRef.current, posRef.current, bracketCloseRef.current, allyMarkRef.current], { y: 60, opacity: 0 });
          var dur = 0.5, ease = "power2.out", stagger = 0.12;
          var ct = gsap.timeline({ delay: 0.2, onComplete: function() { cascadeDone = true; cascadeHasPlayed = true; handleSectionChange(0); } });
          [yourWrapRef.current, bracketOpenRef.current, posRef.current, bracketCloseRef.current, allyMarkRef.current].forEach(function(cel, idx) {
            ct.to(cel, { y: 0, opacity: 1, duration: dur, ease: ease }, idx * stagger);
          });
        } else {
          // Returning from below — restore to last step so user can scroll back through sections
          tl.seek(currentStep / N, true);
          var pi = currentStep - 1;
          if (pillBoxRef.current && pi >= 0) gsap.set(pillBoxRef.current, { y: pi * pillPitch });
          handleSectionChange(currentStep);
        }
      },
      onLeaveBack: function() { sectionActive = false; },
    });

    return () => {
      window.removeEventListener('wheel', wheelHandler);
      window.removeEventListener('touchstart', touchHandler);
      window.removeEventListener('touchend', touchHandler);
      goToStepRef.current = null;
      stopOrbitTicker();
      ScrollTrigger.getAll().forEach(t => t.kill());
      yourSplit.revert();
      posSplit.revert();
      svcSplits.forEach(s => s && s.revert());
      bodySplits.forEach(s => s && s.revert());
    };
  }, [isMobile]);

  // Mobile bracket word auto-cycle — SplitText char animation matching desktop
  useEffect(()=>{
    if (!isMobile) return;
    if (typeof gsap === 'undefined' || typeof SplitText === 'undefined') return;
    const words = ["point of scale", ...SVC_ROWS.map(s => s.bracket)];

    function swapTo(newText) {
      const el = mobileBracketRef.current;
      if (!el) return;
      const doIn = () => {
        if (mobileSplitRef.current) { try { mobileSplitRef.current.revert(); } catch(e){} }
        el.textContent = newText;
        mobileSplitRef.current = new SplitText(el, { type: "chars" });
        gsap.fromTo(mobileSplitRef.current.chars,
          { y: "110%", opacity: 0 },
          { y: "0%", opacity: 1, duration: 0.375, ease: "power2.out", stagger: { each: 0.0225 } }
        );
      };
      if (mobileSplitRef.current && mobileSplitRef.current.chars && mobileSplitRef.current.chars.length) {
        gsap.to(mobileSplitRef.current.chars, {
          y: "-110%", opacity: 0, duration: 0.2, ease: "power2.in",
          stagger: { each: 0.015 }, onComplete: doIn,
        });
      } else {
        doIn();
      }
    }

    function next() {
      i = (i + 1) % words.length;
      swapTo(words[i]);
      mobileCycleRef.current = setTimeout(next, i === 0 ? 2000 : 1500);
    }

    swapTo(words[0]);
    mobileCycleRef.current = setTimeout(next, 2000);

    return () => {
      if (mobileCycleRef.current) clearTimeout(mobileCycleRef.current);
      if (mobileSplitRef.current) { try { mobileSplitRef.current.revert(); } catch(e){} }
      const el = mobileBracketRef.current;
      if (el) gsap.killTweensOf(el);
    };
  }, [isMobile]);

  // Carousel scroll progress bar
  useEffect(()=>{
    if (!isMobile) return;
    const el = carouselRef.current;
    const thumb = carouselThumbRef.current;
    if (!el || !thumb) return;
    const onScroll = () => {
      const max = el.scrollWidth - el.clientWidth;
      if (max <= 0) return;
      const pct = el.scrollLeft / max;
      const trackW = thumb.parentElement.offsetWidth;
      const thumbW = thumb.offsetWidth;
      thumb.style.transform = `translateX(${pct * (trackW - thumbW)}px)`;
      const cardW = el.scrollWidth / SVC_ROWS.length;
      if (el.scrollLeft >= cardW * 0.5) setCarouselEngaged(true);
      const idx = Math.round(pct * (SVC_ROWS.length - 1));
      setCarouselIndex(idx);
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);
  }, [isMobile]);

  const fs  = "clamp(36px,5vw,72px)";
  const bsz = isMobile ? 56 : 80;
  const allyW = Math.round(369 * bsz / 102); // px width of AllyWordmark SVG at current bsz
  const allyRowRight = 64 + 368 - allyW;     // aligns ALLY left edge with body copy left edge
  const wordStyle = {
    display:"inline-block",
    fontFamily:"var(--sans)", fontSize:fs, fontWeight:500,
    lineHeight:1, letterSpacing:"-0.02em",
    color:"var(--secondary)", whiteSpace:"nowrap",
  };

  return (
    <>
      {/* ── ALLY container — desktop: pins as hero; mobile: static headline ── */}
      <div ref={allyContainerRef} style={{ height: isMobile ? "75vh" : "100vh", position:"relative", overflow: "clip" }}>

        {!isMobile && <div style={{ position:"absolute", inset:0, background:"var(--bg)", zIndex:0 }} />}
        {!isMobile && (
          <div ref={ditherHeroRef} style={{position:'absolute',left:'50%',top:0,transform:'translate(-50%, calc(-50% + 128px))',width:'85%',height:'85%',zIndex:0,pointerEvents:'none'}}>
            {!isSafari && <video src="videos/thumbnail_02.mp4?v=3" autoPlay muted loop playsInline style={{
              position:"absolute", inset:0, width:"100%", height:"100%", objectFit:"cover",
              filter: dark ? "url(#duotone-svc-dark)" : "url(#duotone-svc-light)",
            }} />}
          </div>
        )}

        {/* Dither bg per section — desktop only */}
        {!isMobile && SVC_ROWS.map((svc, i) => (
          <div key={i} ref={el => ditherBgRefs.current[i] = el} style={{
            position:"absolute", inset:0, opacity:0, zIndex:1, pointerEvents:"none", overflow:"visible",
          }}>
            {!isSafari && <video src={svc.video} autoPlay muted loop playsInline style={{
              position:"absolute", inset:0, width:"100%", height:"100%", objectFit:"contain",
              filter: dark ? "url(#duotone-svc-dark)" : "url(#duotone-svc-light)",
            }} />}
            {/* Strip reveal overlay — solid bg, animates bottom-to-top on reveal */}
            <div ref={el => ditherOverlayRefs.current[i] = el} style={{
              position:"absolute", inset:0, background:"var(--bg)", overflow:"hidden", pointerEvents:"none",
            }} />
          </div>
        ))}

        {/* Thumbnail video — top-left, desktop only, visible on any service step */}
        {!isMobile && (
          <video
            ref={el => videoRefs.current[0] = el}
            src="videos/thumbnail.mp4"
            autoPlay muted loop playsInline
            style={{
              position:"absolute", bottom:64, left:64,
              width:125, height:125,
              objectFit:"cover", borderRadius:4,
              opacity:0, zIndex:5, pointerEvents:"none",
            }}
          />
        )}


        {/* ALLY treatment — mobile: inline row; desktop: right-anchored SVG row */}
        {isMobile ? (
          <div style={{ position:"absolute", bottom:0, left:0, right:0, background:"var(--bg)" }}>
            <div style={{ padding:"24px 24px 20px", display:"flex", alignItems:"center", justifyContent:"center", gap:3 }}>
              <span style={{ fontFamily:"var(--sans)", fontSize:30, fontWeight:350, lineHeight:1.1, letterSpacing:"-0.3px", color:"var(--secondary)", whiteSpace:"nowrap" }}>Your</span>

        {!isMobile && (

        {/* Nav pills — desktop only */}

}

function goToHome() {
  sessionStorage.setItem('skipIntro', '1');
  const isDark = localStorage.getItem('dijitally-theme') === 'dark';
  const overlayColor = isDark ? '#121010' : '#F5F3EE';
  const sliceH = 2;
  const H = window.innerHeight;
  const total = Math.ceil(H / sliceH);

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;';
  for (var i = 0; i < total; i++) {
    var s = document.createElement('div');
    s.style.cssText = 'position:absolute;left:0;width:100%;top:' + (i * sliceH) + 'px;height:' + (sliceH + 1) + 'px;background:' + overlayColor + ';transform:translateX(-100%);will-change:transform;';
    overlay.appendChild(s);
  }
  document.body.appendChild(overlay);

  var slices = Array.from(overlay.children);
  var maxEnd = 0;
  slices.forEach(function(sl, i) {
    var frac = i / Math.max(total - 1, 1);
    var delay = frac * 0.5 + (Math.random() * 0.05);
    var dur = 0.18 + Math.random() * 0.12;
    var end = delay + dur;
    if (end > maxEnd) maxEnd = end;
    setTimeout(function() {
      sl.style.transition = 'transform ' + dur.toFixed(3) + 's linear';
      sl.style.transform = 'translateX(0)';
    }, delay * 1000);
  });

  setTimeout(function() {
    window.location.href = 'dijitally-revised.html';
  }, maxEnd * 1000 + 50);
}

function getDefaultDark() {
  const saved = localStorage.getItem("dijitally-theme");
  if (saved) return saved === "dark";
  const h = new Date().getHours();
  return h >= 18 || h < 6;
}

              <div style={{width:isMobile?82:150,height:isMobile?82:150,flexShrink:0,overflow:"hidden",borderRadius:4}}>
                <PixelResolveImg src={c.img} alt={c.title} delay={i*0.15} style={{width:"100%",height:"100%"}}/>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:"var(--s24)"}}>
                {c.logo
                  ? <img src={c.logo} alt={c.title} style={{height:c.logoH||20,width:"auto",display:"block",alignSelf:"flex-start",filter:dark?"invert(1)":"none"}} />
                  : <span style={{fontFamily:"var(--sans)",fontSize:13,fontWeight:350,letterSpacing:"var(--eyebrow-ls)",color:"var(--static)",textTransform:"uppercase"}}>{c.label||c.title}</span>
                }
                <div style={{fontFamily:"var(--sans)",fontSize:19,fontWeight:350,lineHeight:1.2,letterSpacing:"0.19px",color:"var(--static)",maxWidth:270}}>{c.desc}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Right: heading + accordion */}
        <div style={{flex:1,maxWidth:842,display:"flex",flexDirection:"column",gap:"var(--s128)"}}>
          <div style={{display:"flex",flexDirection:"column",gap:"var(--s24)"}}>
            <div style={{...h1s,maxWidth:483}}>Helping product, brand and marketing teams deliver results. Fast.</div>
            <div style={{...body22,fontSize:isMobile?19:22,maxWidth:483}}>We partner with brands at the points where growth needs to be engineered, not just executed.</div>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:"var(--s24)"}}>
            {SVC_ACCORDION.map((item,i)=>(
              <div key={item.label} style={{borderBottom:"1px solid var(--grey)",paddingBottom:24}}>
                <button onClick={()=>setOpenAccordion(openAccordion===i?-1:i)} style={{
                  display:"flex",alignItems:"center",justifyContent:"space-between",
                  width:"100%",background:"none",border:"none",cursor:"pointer",padding:0,gap:10,
                }}>
                  <span style={{fontFamily:"var(--sans)",fontSize:22,fontWeight:350,lineHeight:1.1,color:"var(--secondary)",textAlign:"left"}}>{item.label}</span>
                  <span style={{position:"relative",width:21,height:21,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <span style={{position:"absolute",width:3,height:21,background:"var(--secondary)",borderRadius:0,opacity:openAccordion===i?0:1,transition:"opacity 0.2s"}}/>
                    <span style={{position:"absolute",width:21,height:3,background:"var(--secondary)",borderRadius:0}}/>
                  </span>
                </button>
                {openAccordion===i && (
                  <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:24}}>
                    {item.body && <div style={{...body22,fontSize:isMobile?19:22,maxWidth:670}}>{item.body}</div>}
                    {item.img && (
                      <img src={item.img} alt={item.label} style={{width:"100%",maxWidth:842,height:"auto",aspectRatio:"842/378",objectFit:"cover",borderRadius:4,display:"block"}} />
                    )}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ══ CONTACT ══ */}
      <section ref={contactCardRef} style={{
        background:dark?"#1A1A1A":"#EDEAE5",
        padding:isMobile?"48px 16px":"var(--s96) var(--s64)",
        minHeight:isMobile?(contactHeight?`${contactHeight}px`:"66svh"):"auto",
        display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",gap:"var(--s24)",
        position:"relative",overflow:"hidden",
      }}>
        <ContactPixels dark={dark} mobile={isMobile}/>
        <div className="contact-card-inner" style={{
          background:dark?"#121010":"var(--primary)",
          borderRadius:4,
          width:isMobile?"calc(100% - 32px)":736,
          height:isMobile?(contactCardHeight?contactCardHeight:"auto"):416,
          position:"relative",zIndex:1,
          display:"flex",alignItems:"center",justifyContent:"center",
          paddingLeft:isMobile?24:"var(--s64)",
          paddingRight:isMobile?24:"var(--s64)",
          paddingTop:isMobile?32:0, paddingBottom:isMobile?32:0,
          overflow:"hidden",flexShrink:0,
        }}>
          <div style={{width:"100%",display:"flex",flexDirection:"column",gap:"var(--s24)",alignItems:"center",textAlign:"center"}}>
            <Eyebrow center={false} style={{letterSpacing:"0.08em"}}>LET'S CHAT</Eyebrow>
            <div role="heading" aria-level="2" style={{fontFamily:"var(--sans)",fontSize:"var(--h2)",fontWeight:350,lineHeight:"var(--h2-lh)",letterSpacing:"var(--h2-ls)",color:"var(--secondary)"}}>
              Looking for an ally<br/>on your next project?
            </div>
            <div style={{display:"flex",gap:12,alignItems:"stretch",flexDirection:isMobile?"column":"row"}}>
              <input type="email" placeholder="Your contact email" value={email} onChange={e=>setEmail(e.target.value)} style={{width:240,flexShrink:0,padding:"18px 14px",fontFamily:"var(--sans)",fontSize:16,fontWeight:500,border:"1px solid var(--grey)",outline:"none",background:"var(--bg)",color:"#878787",boxSizing:"border-box"}}/>
              <button className="cta-btn" style={{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:10,padding:"18px 24px",background:"var(--tech)",border:"none",borderRadius:0,fontFamily:"var(--sans)",fontSize:16,fontWeight:500,letterSpacing:0,color:"#121010",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
                <span style={{display:"inline-block",width:4,height:4,background:"currentColor",flexShrink:0}}/>
                <span className="cta-text">Submit</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      {/* ══ FOOTER ══ */}
      <footer style={{
        minHeight:"auto",
        padding:isMobile?"64px 24px 24px":"var(--s64) var(--s64) 0",
        display:"flex",flexDirection:"column",alignItems:isMobile?"flex-start":"flex-end",
        gap:isMobile?24:0,
        background:"var(--bg)",
      }}>
        {isMobile ? (
          <div style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            {["WORK","SERVICES","ABOUT"].map(l=>(
              <span key={l} style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
                <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)"}}>{l}</ScrambleSpan>
              </span>
            ))}
            <a href="#" aria-label="LinkedIn" style={{display:"flex",alignItems:"center",justifyContent:"center",width:24,height:24,flexShrink:0}}>
              <img src="dijitally-footer.svg" alt="LinkedIn" style={{width:24,height:24,display:"block"}}/>
            </a>
          </div>
        ) : (
          <div className="footer-row" style={{width:"100%",paddingTop:"var(--s32)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:"var(--s12)",flexWrap:"wrap"}}>
              {["WORK","SERVICES","ABOUT"].map(l=>(
                <span key={l} style={{display:"flex",alignItems:"center",gap:"var(--s12)"}}>
                  <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
                  <ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)"}}>{l}</ScrambleSpan>
                </span>
              ))}
            </div>
            <span style={{display:"flex",alignItems:"center",gap:"var(--s12)"}}>
              <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
              <a href="#" style={{textDecoration:"none"}}><ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)"}}>PRIVACY POLICY</ScrambleSpan></a>
            </span>
          </div>
        )}
        {isMobile ? (
          <div style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
              <a href="#" style={{textDecoration:"none"}}><ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)"}}>PRIVACY POLICY</ScrambleSpan></a>
            </span>
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
              <a href="#" style={{textDecoration:"none"}}><ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)"}}>TERMS + CONDITIONS</ScrambleSpan></a>
            </span>
          </div>
        ) : (
          <div className="footer-row" style={{width:"100%",padding:"var(--s12) 0 var(--s32) 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <a href="#" aria-label="LinkedIn" style={{display:"flex",alignItems:"center",justifyContent:"center",width:24,height:24,flexShrink:0}}>
              <img src="dijitally-footer.svg" alt="LinkedIn" style={{width:24,height:24,display:"block"}}/>
            </a>
            <span style={{display:"flex",alignItems:"center",gap:"var(--s12)"}}>
              <span style={{width:3,height:3,background:"#878787",display:"inline-block",flexShrink:0}}/>
              <a href="#" style={{textDecoration:"none"}}><ScrambleSpan style={{fontFamily:"var(--mono)",fontSize:12,fontWeight:400,letterSpacing:"var(--eyebrow-ls)",lineHeight:"100%",color:"var(--secondary)"}}>TERMS + CONDITIONS</ScrambleSpan></a>
            </span>
          </div>
        )}
        <div ref={footerLogoRef} style={{width:"100%",overflow:"hidden",filter:dark?"url(#to-warm-white)":"none",transition:"filter 0.3s ease"}} />
      </footer>

      <div style={{height:32}}/>
      <BackToTopButton dark={dark}/>

      {ReactDOM.createPortal(
        React.createElement(React.Fragment, null,
          React.createElement("div", {
            id: "cta-overlay",
            onClick: ()=>setCtaOpen(false),
            style: { position:"fixed", inset:0, zIndex:199 }
          }),
          React.createElement("div", {
            id: "cta-panel",
            style: {
              position:"fixed", top:0, right:0, height:"100vh", width:CTA_W, zIndex:200,
              background:"var(--primary)",
              display:"flex", flexDirection:"column",
              padding: isMobile ? "32px 24px" : "42px 64px",
              overflowY:"auto",
            },
            onClick: e=>e.stopPropagation()
          },
            React.createElement("div", { style:{display:"flex",justifyContent:"flex-end",marginBottom:42} },
              React.createElement("button", {
                onClick: ()=>setCtaOpen(false),
                style:{ background:"none",border:"none",cursor:"pointer",width:28,height:19,position:"relative",flexShrink:0 }
              },
                React.createElement("div",{style:{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}},
                  React.createElement("div",{style:{width:30,height:2,background:"var(--secondary)",transform:"rotate(-30deg)",position:"absolute"}}),
                  React.createElement("div",{style:{width:30,height:2,background:"var(--secondary)",transform:"rotate(-150deg)",position:"absolute"}})
                )
              )
            ),
            React.createElement("div", { style:{display:"flex",flexDirection:"column",gap:42,flex:1,justifyContent:"center"} },
              React.createElement("div", { id:"cta-heading", style:{fontFamily:"var(--sans)",fontSize:32,fontWeight:350,lineHeight:"110%",letterSpacing:"-0.64px",color:"var(--secondary)"} },
                React.createElement("span",{style:{color:"var(--static)"}},"Need an ally? "),
                React.createElement("span",{style:{color:"var(--secondary)"}}, "Let's start"),
                React.createElement("br",null),
                React.createElement("span",{style:{color:"var(--secondary)"}},"a project together.")
              ),
              React.createElement("div", { style:{display:"flex",flexDirection:"column",width: isMobile ? "100%" : 533} },
                React.createElement("input",{placeholder:"Your name",type:"text",style:{padding:16,fontFamily:"var(--sans)",fontSize:16,fontWeight:350,border:"1px solid var(--grey)",outline:"none",background:"var(--primary)",color:"var(--secondary)",letterSpacing:"0.16px"}}),
                React.createElement("input",{placeholder:"Your email",type:"email",style:{padding:16,fontFamily:"var(--sans)",fontSize:16,fontWeight:350,border:"1px solid var(--grey)",borderTop:"none",outline:"none",background:"var(--primary)",color:"var(--secondary)",letterSpacing:"0.16px"}}),
                React.createElement("textarea",{placeholder:"Add any notes, if desired.",style:{padding:16,fontFamily:"var(--sans)",fontSize:16,fontWeight:350,border:"1px solid var(--grey)",borderTop:"none",outline:"none",background:"var(--primary)",color:"var(--static)",resize:"none",height:186,letterSpacing:"0.16px"}}),
                React.createElement("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:10}},
                  React.createElement("button",{className:"cta-btn",style:{background:"var(--tech)",color:"#121010",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:4,padding:6,fontFamily:"var(--sans)",fontSize:19,fontWeight:500,letterSpacing:0,lineHeight:1}},
                    React.createElement("span",{style:{width:3,height:3,background:"currentColor",display:"inline-block",flexShrink:0}}),
                    React.createElement("span",{className:"cta-text"},"Submit")
                  )
                )
              )
            )
          )
        ),
        document.getElementById("lb-portal")
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page/>);
</script>
</body>
</html>
